<style>
/* Layout: a Swiss poster sheet. A heavy rule and a big title on a two-column header, the stage on the full measure,
   a flat transport bar, and the four scenes as a ruled index. Three flat colors only. */
:root {
  --paper: #f2eee6;
  --ink: #141113;
  --red: #b80016;
  --muted: #4d4648;
  --rule: #141113;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); margin: 0; }
body { font-family: var(--display); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px) 56px; display: grid; gap: 20px; }
.top { border-top: 12px solid var(--ink); padding-top: 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 12px 32px; align-items: end; }
h1 { margin: 0; font-weight: 700; font-size: clamp(64px, 13vw, 168px); line-height: 0.8; letter-spacing: -0.055em; white-space: nowrap; }
h1 .r { color: var(--red); }
h1 small { font-size: 0.3em; letter-spacing: -0.01em; vertical-align: 0.95em; margin: 0 0.12em 0 0.1em; }
.side { display: grid; gap: 10px; border-top: 3px solid var(--ink); padding-top: 10px; min-width: 0; }
.side b { font-size: 22px; letter-spacing: -0.02em; }
.meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; line-height: 1.6; }
.fmt { display: inline-grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); width: max-content; }
.fmt button { font: 700 13px var(--mono); letter-spacing: 0.04em; padding: 7px 14px; border: 0; background: var(--paper); color: var(--ink); cursor: pointer; }
.fmt button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.fmt button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; position: relative; z-index: 1; }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: var(--paper); overflow: hidden; outline: 2px solid var(--ink); }
.stage.v { aspect-ratio: 9 / 16; width: min(100%, calc((100vh - 120px) * 9 / 16)); min-width: min(100%, 300px); margin-inline: auto; }
.stage canvas { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: flex-start; border: 0; padding: clamp(12px, 3vw, 28px); cursor: pointer; background: transparent; color: var(--paper); }
.overlay[hidden] { display: none !important; }
.pill { display: inline-flex; align-items: center; gap: 16px; padding: 8px 26px 8px 8px; background: var(--ink); font: 700 clamp(17px, 2.2vw, 24px) var(--display); letter-spacing: -0.01em; transition: transform 0.15s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
.disc { width: clamp(52px, 6vw, 72px); height: clamp(52px, 6vw, 72px); background: var(--red); display: grid; place-items: center; }
.disc svg { width: 40%; height: 40%; margin-left: 8%; fill: var(--paper); }
.overlay:hover .pill { transform: translate(4px, -4px); box-shadow: -4px 4px 0 var(--paper); }
.overlay:focus-visible { outline: none; }
.overlay:focus-visible .pill { outline: 3px solid var(--paper); outline-offset: 3px; box-shadow: 0 0 0 6px var(--ink); }
.transport { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink); padding: 10px 0; }
.tbtn { display: inline-flex; align-items: center; gap: 10px; height: 42px; padding: 0 16px 0 14px; border: 0; background: var(--ink); color: var(--paper); font: 700 15px var(--display); letter-spacing: -0.01em; cursor: pointer; }
.tbtn:hover { background: var(--red); }
.tbtn:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.tbtn svg { width: 14px; height: 14px; fill: currentColor; }
.tbtn[aria-pressed="false"] { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.track { position: relative; flex: 1 1 240px; min-width: 0; height: 42px; display: flex; align-items: center; }
.ticks { position: absolute; inset: 0; pointer-events: none; }
.ticks i { position: absolute; top: 4px; width: 2px; height: 10px; background: var(--ink); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 42px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; background: linear-gradient(to right, var(--red) var(--p, 0%), var(--ink) var(--p, 0%)); }
input[type="range"]::-moz-range-track { height: 8px; background: var(--ink); }
input[type="range"]::-moz-range-progress { height: 8px; background: var(--red); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 26px; margin-top: -9px; background: var(--paper); border: 3px solid var(--ink); border-radius: 0; }
input[type="range"]::-moz-range-thumb { width: 10px; height: 20px; background: var(--paper); border: 3px solid var(--ink); border-radius: 0; }
input[type="range"]:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.tc { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tc b { font-weight: 700; }
.scenes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 20px; }
@media (max-width: 860px) { .scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 16px; } }
@media (max-width: 600px) { .top { grid-template-columns: minmax(0, 1fr); } }
.scene { position: relative; display: grid; gap: 6px; align-content: start; text-align: left; padding: 12px 0 14px; border: 0; border-top: 3px solid var(--ink); background: transparent; color: var(--ink); font: inherit; cursor: pointer; min-width: 0; }
.scene:focus-visible { outline: 3px solid var(--red); outline-offset: 4px; }
.scene .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.scene .num { font-size: clamp(30px, 3.6vw, 44px); font-weight: 700; letter-spacing: -0.04em; line-height: 0.9; }
.scene .st { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; }
.scene .sn { font-size: 18px; font-weight: 700; letter-spacing: -0.015em; }
.scene .sd { font-size: 14px; line-height: 1.42; color: var(--muted); }
.scene .fill { position: absolute; left: 0; top: -3px; height: 3px; width: 0; background: var(--red); }
.scene:hover .num, .scene.on .num { color: var(--red); }
.scene.on { border-top-color: var(--ink); }
footer { display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; border-top: 3px solid var(--ink); padding-top: 10px; }
footer .sw { display: flex; gap: 14px; flex-wrap: wrap; }
footer .sw span { display: inline-flex; align-items: center; gap: 6px; }
footer .sw i { width: 14px; height: 14px; display: inline-block; box-shadow: inset 0 0 0 1px var(--ink); }
body.render { margin: 0; overflow: hidden; background: var(--paper); }
body.render .wrap > *:not(.stage) { display: none !important; }
body.render .wrap { padding: 0; max-width: none; display: block; }
body.render .stage { width: 1920px; height: 1080px; outline: 0; aspect-ratio: auto; margin: 0; }
body.render.v .stage { width: 1080px; height: 1920px; }
body.render .overlay { display: none !important; }
@media (prefers-reduced-motion: reduce) { .pill, .overlay:hover .pill { transition: none; transform: none; box-shadow: none; } }
</style>

// GZ2H audio kit: synthesized guitar, amp rigs, drums and FX on Web Audio.
// Paste or inline into an intro page (it defines globals). Works in AudioContext and OfflineAudioContext.
//
//   const mix = gzMix(ac, t0, from, { fadeAt: 7.6, dur: 8 });
//   mix.cleanNote(0.95, mix.F.E2, 0.9, -0.2);                     // clean electric pluck
//   mix.strum([1.60, 1.61, 1.62], ['E2', 'B2', 'E3'], 3.4, 0.55);  // distorted power chord, double-tracked L/R
//   mix.kick(1.62, 0.75); mix.snare(2.0, 0.6); mix.crash(1.62, 0.8);
//
// Times are seconds on the intro's timeline. `from` lets playback start mid-timeline (events before it are skipped).
// Mix lessons from earlier intros: keep kick \u2264 0.75 and boom \u2264 0.55 or the sub-bass swamps the guitars;
// the clean bus at 0.24 sits under distorted hits; master them to about -14 LUFS.

const gzMulberry = a => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// Karplus-Strong plucked string \u2192 AudioBuffer
function gzKS(ac, f, dur, o = {}) {
  const sr = ac.sampleRate, n = Math.floor(sr * dur), out = new Float32Array(n);
  const t60 = o.t60 || 3, bright = o.bright ?? 0.55, pick = o.pick ?? 0.13, damp = o.damp ?? 0.5;
  const N = Math.max(2, Math.round(sr / f - damp)), buf = new Float32Array(N), r = gzMulberry(o.seed || 1);
  let lp = 0;
  for (let i = 0; i < N; i++) { lp += bright * ((r() * 2 - 1) - lp); buf[i] = lp; }
  const D = Math.max(1, Math.round(pick * N)), ex = buf.slice();
  for (let i = 0; i < N; i++) buf[i] = ex[i] - 0.9 * ex[(i - D + N) % N];

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 layout (depends on the frame W \u00d7 H) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 canvases \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const out = document.getElementById('c');

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 fonts \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 drawing helpers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 scene 1: ZERO \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

  const drawRule = pal => {

    c.fillStyle = pal.ink; c.fillRect(L.M, ruleY, (W - 2 * L.M) * e, ruleH);

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 scene 2: Z \u2192 N \u2192 H \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

      if (t < T.lock) { const t0 = T.zcell + 0.02 + (3 - i) * 0.03, u = inv(t0, t0 + 0.13, t); dx = W * (0.3 + 0.17 * (4 - i)) * u * u; if (u >= 1) continue; }

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 scene 3: GUITAR ZERO 2 HERO \u2192 one line \u2192 initials \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function scene3(t) {

}

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 scene 4: logo, hands, wordmark \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const LOGO_C = [1611, 662];
const LBOX = { G: [58, 251, 778, 922], Z: [821, 207, 1442, 913], two: [1465, 208, 1992, 922], H: [2042, 207, 2705, 922] };
const LKEYS = ['G', 'Z', 'two', 'H'], FCH = ['G', 'Z', '2', 'H'];
const HANDS = [{ id: 'horns', w: [392, 262], c: [32, -100] }, { id: 'thumb', w: [985, 336], c: [-10, -110] }, { id: 'wave', w: [1700, 270], c: [-60, -100] }, { id: 'ok', w: [2650, 600], c: [-90, -140] }];
const logoXY = (x, y) => [L.logoC[0] + (x - LOGO_C[0]) * L.sLogo, L.logoC[1] + (y - LOGO_C[1]) * L.sLogo];
// where initial i sits: a font glyph box (screen) at a given moment, as centre + height
function fontBox(ch, x, base, k) { const b = gbox(ch); return [x + (b[0] + b[2]) / 2 * k, base + (b[1] + b[3]) / 2 * k, (b[3] - b[1]) * k]; }
function logoBox(i) { const b = LBOX[LKEYS[i]], a = logoXY(b[0], b[1]), z = logoXY(b[2], b[3]); return [(a[0] + z[0]) / 2, (a[1] + z[1]) / 2, z[1] - a[1]]; }
function scene4(t) {
  const { kLine, cx, cy, kWM, wm0, wmBase } = L;
  const packX0 = cx - PACK.w * kLine / 2 - PACK.ink0 * kLine, lb = cy + CAP * kLine / 2;
  // the initials hold for a sixteenth, accelerate into an oversized logo, and the logo snaps down to size on the beat
  const grow = eIn3(inv(T.zip + S16, T.logo, t)), OVER = 1.16;
  const hit = t >= T.logo ? 1 + (OVER - 1) * (1 - eOutX(inv(T.logo, T.logo + 0.24, t))) : 1;
  const shrink = eIn3(inv(T.out2 + 0.04, T.lock2, t));
  const open = eOut4(inv(T.lock2, T.lock2 + 0.34, t));
  const wmPackX0 = cx - WM_PACK.w * kWM / 2 - WM_PACK.ink0 * kWM;
  const neck = eOutX(inv(T.out2, T.out2 + 0.14, t));
  const draw = pal => {
    // 1. initials grow into the logo (font glyphs), 2. logo pieces, 3. shrink to packed capitals, 4. the wordmark opens
    if (t < T.logo) {
      c.fillStyle = pal.wm;
      for (let i = 0; i < 4; i++) {
        const a = fontBox(FCH[i], packX0 + PACK.xs[i] * kLine, lb, kLine), b = logoBox(i);
        b[0] = L.logoC[0] + (b[0] - L.logoC[0]) * OVER; b[1] = L.logoC[1] + (b[1] - L.logoC[1]) * OVER; b[2] *= OVER;
        const x = lerp(a[0], b[0], grow), y = lerp(a[1], b[1], grow), hgt = lerp(a[2], b[2], grow);
        const gb = gbox(FCH[i]), k = hgt / (gb[3] - gb[1]);
        glyph(c, FCH[i], x - (gb[0] + gb[2]) / 2 * k, y - (gb[1] + gb[3]) / 2 * k, k);

    }
    if (t < T.lock2) {
      c.save();

      // a zero ring bursts behind each hand as it lands
      c.save();
      c.translate(L.logoC[0], L.logoC[1]); c.scale(L.sLogo, L.sLogo); c.translate(-LOGO_C[0], -LOGO_C[1]);
      HANDS.forEach((hd, i) => {
        const rr = inv(T.hands[i], T.hands[i] + 0.26, t);
        if (rr <= 0 || rr >= 1) return;
        const e = eOutX(rr), cxr = hd.w[0] + hd.c[0], cyr = hd.w[1] + hd.c[1];
        c.strokeStyle = pal.ink; c.lineWidth = 46 * (1 - rr) ** 1.5;
        c.beginPath(); c.arc(cxr, cyr, 120 + 250 * e, 0, TAU); c.stroke();
      });
      c.restore();
      for (let i = 0; i < 4; i++) {
        const key = LKEYS[i], lb0 = logoBox(i);
        const tgt = fontBox(FCH[i], wmPackX0 + WM_PACK.xs[i] * kWM, wmBase, kWM);
        const x = lerp(lb0[0], tgt[0], shrink), y = lerp(lb0[1], tgt[1], shrink), sc = lerp(1, tgt[2] / lb0[2], shrink);
        c.save();

      const e = eOutX(inv(T.url, T.url + 0.32, t)), fs = L.urlSize;
      c.save(); c.beginPath(); c.rect(0, L.urlY - fs * 1.05, W, fs * 1.4); c.clip();

      c.fillStyle = pal.ink; drawZNH(c, st, W - L.M - (L.V ? 110 : 96), H - L.M - capm / 2 + capm * 1.3 * (1 - ap), km);

  else {
    layer(FULL(), PAPER, draw, t);

}

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 frame \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function render(t) {
  t = clamp(t, 0, DUR);
  c.setTransform(Q, 0, 0, Q, 0, 0); c.globalAlpha = 1;
  if (t < T.zcell) scene1(t);
  else if (t < T.words[0]) scene2(t);
  else if (t < T.zip) scene3(t);

}

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 score: drums, palm-muted riff in E, hits on every slam \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function buildAudio(ac, t0, from = 0) {
  const m = gzMix(ac, t0, from, { dur: DUR, fadeAt: 7.95, seed: 11 });
  const { F, kick, snare, hat, crash, boom, tom, click, swell, strum, chug, cleanNote, osc, noise, bq, G, at, live, master, send, NB } = m;
  const s = i => ORG + i * S16;
  const PC = { E5: ['E2', 'B2', 'E3'], G5: ['G2', 'D3', 'G3'], A5: ['A2', 'E3', 'A3'], B5: ['B2', 185.0, 'B3'] };
  const stab = (time, ch, gain = 0.58, len = 0.2, t60 = 1.4) => strum(PC[ch].map((_, i) => time - 0.012 + i * 0.006), PC[ch], t60, gain, time + len, false);
  const ring = (time, ch, gain = 0.6, t60 = 3, stopAt) => strum(PC[ch].map((_, i) => time - 0.014 + i * 0.007), PC[ch], t60, gain, stopAt, false);
  const pm = (time, g = 1.0) => chug(time, ['E2', 'B2'], g);
  // the rotation: two band-passed noise layers sweeping up and back, panned left to right with the turn
  const swish = (t1, t2, g) => {
    if (!live(t1)) return;
    const tm = t1 + (t2 - t1) * 0.66;
    [[500, 3800, 1100, 0.8, 1], [1800, 9000, 3000, 1.1, 0.55]].forEach(([fa, fb, fc, q, gg]) => {
      const src = ac.createBufferSource(); src.buffer = NB; const f = bq('bandpass', fa, q), a = G(0), p = ac.createStereoPanner();
      src.connect(f).connect(a).connect(p); p.connect(master); send(p, 0.25);
      f.frequency.setValueAtTime(fa, at(t1)); f.frequency.exponentialRampToValueAtTime(fb, at(tm)); f.frequency.exponentialRampToValueAtTime(fc, at(t2));
      a.gain.setValueAtTime(0.0001, at(t1)); a.gain.exponentialRampToValueAtTime(g * gg, at(tm)); a.gain.exponentialRampToValueAtTime(0.0001, at(t2));

  const clack = time => {
    noise(time, 0.016, 1.5, [bq('highpass', 1800)], master, 0.0004);
    noise(time, 0.08, 1.4, [bq('bandpass', 3000, 1.6)], master, 0.001);
    osc('square', 1760, 1760, time, 0.04, 0.12, master, 0.0004);
    osc('sine', 2870, 2870, time, 0.09, 0.32, master, 0.0004);
    osc('sine', 4410, 4410, time, 0.05, 0.18, master, 0.0004);
    osc('sine', 340, 170, time, 0.06, 0.22, master, 0.001);
    noise(time + 0.017, 0.012, 1.1, [bq('highpass', 2400)], master, 0.0003);
    snare(time, 0.5);

  // pickup: a riser into the first downbeat
  swell(0.0, T.slam - 0.004, 0.28, 1500, 9000, 0.9, 'highpass');
  // bar 1: ZERO. gallop riff, kick on the gallop, snare on 2 and 4
  crash(s(0), 0.5, 1.8); stab(s(0), 'E5', 0.6, 0.26);
  [2, 3, 4, 6, 7, 8, 10, 11, 12].forEach(i => pm(s(i), i % 4 === 0 ? 1.0 : 0.85));
  stab(s(14), 'G5', 0.5, 0.1); stab(s(15), 'A5', 0.52, 0.1);
  KICKS.forEach(k => kick(k, 0.7));
  [4, 12].forEach(i => snare(s(i), 0.62));
  snare(s(14), 0.42); snare(s(15), 0.5);
  for (let i = 0; i < 14; i += 2) hat(s(i), i % 4 ? 0.26 : 0.34);
  // bar 2: the Z. stop-time: a hit, the swish, the N lands, the clack, then HERO
  kick(s(16), 0.72); stab(s(16), 'E5', 0.62, 0.16); hat(s(16), 0.3);

  swish(T.rot0 - 0.02, T.rot1 + 0.03, 2.1);
  kick(s(20), 0.5); tom(s(20), 98, 0.42); pm(s(20), 1.0);
  hat(s(21), 0.2);
  swell(T.swing0 - 0.03, T.lock - 0.003, 0.2, 900, 6000, 1.2);
  clack(T.lock);
  swell(T.lock + 0.03, T.hero - 0.004, 0.26, 2500, 11000, 0.7, 'highpass');
  snare(T.hero - S16 / 2, 0.24);
  crash(T.hero, 0.95, 2.4); kick(T.hero, 0.62); boom(T.hero, 0.3); snare(T.hero, 0.65);
  ring(T.hero, 'E5', 0.64, 2.2, T.words[0] - 0.03);
  ['E4', 'B4', 'E5'].forEach((n, i) => cleanNote(T.hero + 0.01 + i * 0.02, F[n], 0.85, -0.4 + 0.4 * i, 2.0));
  [26, 27].forEach(i => hat(s(i), 0.22));
  // the four words: rising stabs on the eighths
  ['E5', 'G5', 'A5', 'B5'].forEach((ch, i) => {
    const tw = T.words[i];
    stab(tw, ch, 0.6, 0.19); kick(tw, 0.68);

    hat(tw + S16, 0.18);
  });
  crash(T.words[2], 0.4, 1.0);
  // one line: chugs, then the zip: a snare roll into the logo
  [36, 37, 38, 39].forEach(i => pm(s(i), 0.95)); kick(s(36), 0.6); hat(s(36), 0.26); hat(s(37), 0.2);
  for (let j = 0; j < 8; j++) snare(T.zip + j * S16 / 2, 0.18 + 0.05 * j);
  swell(T.zip - 0.1, T.logo - 0.004, 0.3, 700, 8000, 1.1);
  // logo
  crash(T.logo, 0.85, 2.2); kick(T.logo, 0.62); boom(T.logo, 0.28); snare(T.logo, 0.55);
  ['B3', 'E4', 'B4'].forEach((n, i) => cleanNote(T.logo + 0.01 + i * 0.02, F[n], 0.7, -0.4 + 0.4 * i, 1.6));
  ring(T.logo, 'E5', 0.6, 2.4, T.out2 + 0.1);
  // four hands: an E minor arpeggio, one pluck and pop per hand
  ['E4', 'G4', 'B4', 'E5'].forEach((n, i) => { const th = T.hands[i]; cleanNote(th, F[n], 0.95, -0.45 + 0.3 * i, 1.6); pop(th, 520 + 120 * i); hat(th, 0.22); });
  snare(T.hands[1], 0.55); kick(T.hands[3], 0.62); kick(T.hands[0] + S16, 0.4);
  [43, 45, 47, 49].forEach(i => pm(s(i), 0.8)); [41, 43, 45, 47].forEach(i => hat(s(i), 0.14));
  // into the lockup
  swell(T.out2 - 0.08, T.lock2 - 0.004, 0.3, 1800, 11000, 0.8, 'highpass');
  snare(s(50), 0.36); snare(s(51), 0.48); tom(s(50), 196, 0.36); tom(s(51), 147, 0.4);
  // final chord: the E5 rig plus a clean E major (zero in minor, hero in major)
  crash(T.lock2, 0.95, 3.2); kick(T.lock2, 0.62); boom(T.lock2, 0.35); snare(T.lock2, 0.5);
  ring(T.lock2, 'E5', 0.62, 4.2);
  ['E4', 'Gs4', 'B4', 'E5'].forEach((n, i) => cleanNote(T.lock2 + 0.02 + i * 0.03, F[n], 0.9, -0.45 + 0.3 * i, 3.6));
  click(T.url, 0.25); cleanNote(T.url, F.E6, 0.25, 0.4, 1.4);
  // the hold: hats on the eighths, a soft kick on the beat
  for (let i = 54; i <= 64; i++) if (i % 2 === 0) hat(s(i), i % 4 === 0 ? 0.16 : 0.1);
  [56, 60, 64].forEach(i => kick(s(i), 0.32));
}

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 boot \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const QS = new URLSearchParams(location.search);
const RENDER = QS.has('render');
if (RENDER) document.body.classList.add('render');
if (RENDER && QS.has('v')) document.body.classList.add('v');
setLayout(QS.has('v') ? 1080 : 1920, QS.has('v') ? 1920 : 1080);
if (QS.has('q')) setQuality(+QS.get('q'));

window.GZ = {
  DUR, ready, BPM,
  get size() { return [W, H]; },
  frame: t => render(t),
  // motion blur: n sub-frames across a 180\u00b0 shutter that opens at t, averaged; returns a PNG as base64.
  // The shutter opens on the frame time, so the frame that lands on a hard cut never mixes both sides of it.
  capture(t, n = 1) {
    if (!this.acc || this.acc.width !== CW || this.acc.height !== CH) { this.acc = mk(CW, CH); this.ax = this.acc.getContext('2d'); }
    for (let i = 0; i < n; i++) { render(t + (n > 1 ? ((i + 0.5) / n) / 120 : 0)); this.ax.globalAlpha = 1 / (i + 1); this.ax.drawImage(out, 0, 0); }
    this.ax.globalAlpha = 1;
    return this.acc.toDataURL('image/png').split(',')[1];
  },
  async audio() { const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr); buildAudio(oc, 0, 0); const b = await oc.startRendering(); return gzWavB64(b); },
};
if (RENDER) return;

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 player UI \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const stage = document.getElementById('stage');
const big = document.getElementById('big'), bigLabel = document.getElementById('bigLabel');
const playBtn = document.getElementById('play'), playLabel = document.getElementById('playLabel'), playIcon = document.getElementById('playIcon');
const soundBtn = document.getElementById('sound'), soundLabel = document.getElementById('soundLabel');
const scrub = document.getElementById('scrub'), tcNow = document.getElementById('tcNow');
const scenesEl = document.getElementById('scenes'), ticks = document.getElementById('ticks');
const fmtH = document.getElementById('fmtH'), fmtV = document.getElementById('fmtV');
const SOUND_FILE = 'gz2h-ztoh.mp3';
const POSTER = 3.4;
const ICON_PLAY = 'M3 1.8v12.4c0 .6.7 1 1.2.7l10-6.2c.5-.3.5-1.1 0-1.4l-10-6.2C3.7.8 3 1.2 3 1.8z';
const ICON_PAUSE = 'M3 2h3.4v12H3zM9.6 2H13v12H9.6z';

SCENES.forEach((sc, i) => {
  const b = document.createElement('button');
  b.className = 'scene'; b.type = 'button'; b.id = 'scene-' + i;
  b.innerHTML = `<span class="row"><span class="num">${String(i + 1).padStart(2, '0')}</span><span class="st">${sc.t.toFixed(2)} s</span></span><span class="sn">${sc.name}</span><span class="sd">${sc.desc}</span><span class="fill"></span>`;
  b.addEventListener('click', () => play(sc.t));
  scenesEl.appendChild(b);
  if (i) { const tk = document.createElement('i'); tk.style.left = `calc(${(sc.t / DUR) * 100}% + ${8 - 16 * sc.t / DUR}px)`; ticks.appendChild(tk); }
});

let now = POSTER, playing = false, soundOn = true, ac = null, t0 = 0, perf0 = 0, raf = 0, slow = 0;
function fitQuality() {
  const want = clamp(stage.clientWidth * Math.min(2, window.devicePixelRatio || 1) / W, 0.3, 1);
  const q = Math.round(want * 20) / 20;
  if (Math.abs(q - Q) > 0.049) setQuality(q);
}
function show(t) {
  now = t; render(t);
  scrub.value = t.toFixed(3); scrub.style.setProperty('--p', (t / DUR * 100) + '%');
  tcNow.textContent = t.toFixed(2);
  SCENES.forEach((sc, i) => {
    const el = scenesEl.children[i], on = t >= sc.t && t < sc.end;
    el.classList.toggle('on', on);
    el.querySelector('.fill').style.width = (clamp((t - sc.t) / (sc.end - sc.t)) * 100) + '%';
  });
}
function setFormat(vertical) {
  fmtH.setAttribute('aria-pressed', String(!vertical)); fmtV.setAttribute('aria-pressed', String(vertical));
  stage.classList.toggle('v', vertical);
  setLayout(vertical ? 1080 : 1920, vertical ? 1920 : 1080);
  Q = 0; fitQuality(); show(now);
}
fmtH.addEventListener('click', () => setFormat(false));
fmtV.addEventListener('click', () => setFormat(true));
// Sound comes from a pre-rendered soundtrack file played through an <audio> element, which the
// iPhone silent switch does not mute (Web Audio is muted by it). Live synthesis is the fallback.
const snd = new Audio(); snd.preload = 'auto'; snd.src = SOUND_FILE;
let fileOK = true, mode = 'none', synthFrom = 0;
snd.addEventListener('error', () => { fileOK = false; });
snd.addEventListener('playing', () => { if (mode === 'file' && ac) { ac.close().catch(() => {}); ac = null; } });
function stopAudio() { mode = 'none'; try { snd.pause(); } catch (err) {} if (ac) { ac.close().catch(() => {}); ac = null; } }
function noSound() { mode = 'none'; soundLabel.textContent = 'No sound'; }
function startSynth() {
  if (!ac) return noSound();
  try {
    synthFrom = clamp((performance.now() - perf0) / 1000, 0, DUR);
    if (ac.resume) ac.resume();
    t0 = ac.currentTime + 0.15; buildAudio(ac, t0, synthFrom); mode = 'synth';
  } catch (err) { noSound(); }
}
function setPlayingUI(p) {
  playing = p;
  playLabel.textContent = p ? 'Pause' : (now >= DUR - 0.01 ? 'Replay' : 'Play');
  playIcon.firstElementChild.setAttribute('d', p ? ICON_PAUSE : ICON_PLAY);
  big.hidden = p;
}
function play(from = 0) {
  if (from >= DUR - 0.05) from = 0;
  stopAudio(); cancelAnimationFrame(raf);
  perf0 = performance.now() - from * 1000;
  const startedAt = performance.now();
  if (soundOn) {
    soundLabel.textContent = 'Sound on';
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (err) {}
    // unlock a context inside this tap, in case the file can't play and we fall back to synthesis
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.resume) ac.resume(); } catch (err) { ac = null; }
    if (fileOK) {
      mode = 'file';
      try { snd.currentTime = from; } catch (err) {}
      const p = snd.play();
      if (p && p.catch) p.catch(() => { if (mode === 'file') startSynth(); });
    } else startSynth();
  }
  slow = 0;
  setPlayingUI(true);
  const tick = () => {
    let t;
    if (mode === 'file') {
      if (snd.ended) t = DUR;
      else if (!snd.paused && snd.readyState >= 3) { t = snd.currentTime; perf0 = performance.now() - t * 1000; }
      else if (performance.now() - startedAt < 1500) { t = from; perf0 = performance.now() - from * 1000; }
      else { startSynth(); t = (performance.now() - perf0) / 1000; }
    } else if (mode === 'synth' && ac) t = ac.currentTime - t0 + synthFrom - (ac.outputLatency || 0);
    else t = (performance.now() - perf0) / 1000;
    const f0 = performance.now();
    show(clamp(t, 0, DUR));
    if (performance.now() - f0 > 26 && ++slow > 20 && Q > 0.5) { setQuality(Math.max(0.5, Q - 0.2)); slow = 0; }
    if (t >= DUR) { setPlayingUI(false); show(7.6); now = DUR; playLabel.textContent = 'Replay'; bigLabel.textContent = 'Replay with sound'; big.hidden = false; stopAudio(); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
GZ.player = { snd, get mode() { return mode; } };
function pause() { cancelAnimationFrame(raf); stopAudio(); setPlayingUI(false); }

big.addEventListener('click', () => play(now >= DUR - 0.01 || now === POSTER ? 0 : now));
playBtn.addEventListener('click', () => (playing ? pause() : play(now >= DUR - 0.01 ? 0 : now)));
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.setAttribute('aria-pressed', String(soundOn)); soundLabel.textContent = soundOn ? 'Sound on' : 'Sound off';
  bigLabel.textContent = soundOn ? 'Play with sound' : 'Play';
  if (playing) play(now);
});
scrub.addEventListener('input', () => { if (playing) pause(); show(+scrub.value); });
window.addEventListener('resize', () => { fitQuality(); if (!playing) show(now); });

ready.then(() => { fitQuality(); show(now); });
})();
</script>
