  html, body { height: 100%; }
  body {
    margin: 0;
    padding-block: 16px;
    padding-inline: 16px;
    box-sizing: border-box;
    background: var(--bg);
    color: var(--cream);
    font-family: var(--font-display);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: min(100%, calc((100vh - 96px) * 16 / 9));
    max-width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--stage);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    cursor: pointer;
  }
  #stage svg { display: block; width: 100%; height: 100%; }
  #bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
    font-size: 14px; color: var(--ui); letter-spacing: 0.02em;
  }
  #bar button {
    font: inherit; font-weight: 600; color: var(--cream);
    background: rgba(227, 21, 31, 0.18); border: 1px solid rgba(255, 92, 92, 0.45);
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  #bar button:hover { background: rgba(227, 21, 31, 0.32); }
  #bar button:focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }
  #hint { opacity: 0.8; }
  #time { font-variant-numeric: tabular-nums; min-width: 4ch; opacity: 0.6; }
  html.export body { padding: 0; gap: 0; background: var(--stage); }
  html.export #stage { width: 1920px; height: 1080px; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
  html.export #bar { display: none; }
  .cap text, .low text, #url { font-family: var(--font-display); text-rendering: geometricPrecision; }
  .cap text, .low text { font-weight: 800; }
  #url { font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { #stage { cursor: default; } }
</style>
</head>

  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.1" style="mix-blend-mode: overlay"/>
  <rect id="fade" width="1920" height="1080" fill="#0a0103" opacity="0"/>
</svg>
</div>
<div id="bar">
  <button id="replay" type="button">Replay</button>
  <button id="sound" type="button" aria-pressed="false">Sound: off</button>
  <span id="hint">Tap the frame to play it with sound</span>
  <span id="time">0.00s</span>
</div>

<script>
(() => {
'use strict';
const SVG_NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const W = 1920, H = 1080;
const EXPORT = /[?&]export=1/.test(location.search);
if (EXPORT) document.documentElement.classList.add('export');

// ---------- timeline (seconds) ----------
const DUR = 6.6;
const STRING_Y = [420, 468, 516, 564, 612, 660];
const STRING_Y_END = [138, 180, 222, 858, 900, 942];
const STRING_W = [5.2, 4.6, 3.9, 2.9, 2.3, 1.9];
const STRUM_T0 = 1.10, STRUM_DT = 0.07, STRUM_X = 1010;
const LETTER_T = [1.50, 1.70, 1.90, 2.10];
const HEAD_T0 = 2.18, PEG_T0 = 2.38, PEG_DT = 0.045;
const RESOLVE_T = 3.30, RESOLVE_DT = 0.045;
const MORPH_T0 = 3.32, MORPH_D = 0.85;
const UNDER_T0 = 4.20, UNDER_D = 0.45;
const URL_T0 = 4.30, URL_D = 0.6;
const FADE_T0 = 6.1, FADE_D = 0.45;

// ---------- easing ----------
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  linear: p => p,
  outQuad: p => 1 - (1 - p) * (1 - p),
  outCubic: p => 1 - Math.pow(1 - p, 3),
  outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  inOutQuint: p => p < 0.5 ? 16 * p * p * p * p * p : 1 - Math.pow(-2 * p + 2, 5) / 2,
  outBack: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  inBack: p => { const c1 = 1.70158, c3 = c1 + 1; return c3 * p * p * p - c1 * p * p; },

const seg = (t, t0, d, ease = E.linear) => ease(clamp01((t - t0) / d));

// ---------- deterministic pseudo-random ----------
let seed = 12345;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

// ---------- strings ----------
const stringsG = $('strings');
const stringEls = STRING_Y.map((y, i) => {
  const p = document.createElementNS(SVG_NS, 'path');
  p.setAttribute('stroke', i < 3 ? 'url(#wound)' : 'url(#steel)');
  p.setAttribute('stroke-width', STRING_W[i]);
  p.setAttribute('pathLength', '1');
  p.setAttribute('stroke-dasharray', '1');
  p.setAttribute('stroke-dashoffset', '1');
  stringsG.appendChild(p);
  return p;
});
// pluck events per string: {t, A, f, tau}
const plucks = STRING_Y.map(() => []);
STRING_Y.forEach((_, i) => {
  plucks[i].push({ t: STRUM_T0 + i * STRUM_DT, A: [17, 16, 14, 12, 10, 8][i], f: 9 + i * 1.7, tau: 1.0 - i * 0.06 });
  plucks[i].push({ t: RESOLVE_T + i * RESOLVE_DT, A: [8, 7, 6, 5, 4.5, 4][i], f: 9 + i * 1.7, tau: 0.9 });
});
function stringPath(i, t) {
  const y0 = lerp(STRING_Y[i], STRING_Y_END[i], seg(t, MORPH_T0, 0.9, E.inOutQuint));
  const n = 72;
  let d = '';
  const active = plucks[i].filter(ev => t > ev.t && t - ev.t < 4);
  for (let k = 0; k <= n; k++) {
    const x = k / n * W;
    let y = y0;
    for (const ev of active) {
      const dt = t - ev.t;
      const env = ev.A * Math.exp(-dt / ev.tau);
      y += env * (Math.sin(Math.PI * x / W) * Math.sin(2 * Math.PI * ev.f * dt)
                + 0.35 * Math.sin(2 * Math.PI * x / W) * Math.sin(2 * Math.PI * ev.f * 2.02 * dt + 1.1));
    }
    d += (k ? ' L ' : 'M ') + x.toFixed(1) + ' ' + y.toFixed(2);
  }
  return d;
}

// ---------- effects pool ----------
const fxG = $('fx');
const fx = []; // {el, t0, dur, kind, x, y, ...}
function addRing(t0, x, y, r1, w, dur, color, maxOp) {
  const el = document.createElementNS(SVG_NS, 'circle');
  el.setAttribute('stroke', color);
  fxG.appendChild(el);
  fx.push({ el, t0, dur, kind: 'ring', x, y, r1, w, maxOp });
}
function addSparks(t0, x, y, count, color) {
  for (let k = 0; k < count; k++) {
    const el = document.createElementNS(SVG_NS, 'line');
    el.setAttribute('stroke', color);
    el.setAttribute('stroke-width', (1.5 + rnd() * 2).toFixed(1));
    fxG.appendChild(el);
    const a = rnd() * Math.PI * 2, dist = 60 + rnd() * 110, len = 10 + rnd() * 24;
    fx.push({ el, t0, dur: 0.42 + rnd() * 0.2, kind: 'spark', x, y, a, dist, len });
  }
}
STRING_Y.forEach((y, i) => {
  const t0 = STRUM_T0 + i * STRUM_DT;
  addRing(t0, STRUM_X, y, 150, 7, 0.55, i < 3 ? '#f3dc9c' : '#ffffff', 0.9);
  addSparks(t0, STRUM_X, y, 7, i < 3 ? '#ffe2a6' : '#ffffff');
});
function renderFx(t) {
  for (const f of fx) {
    const p = (t - f.t0) / f.dur;
    if (p <= 0 || p >= 1) { f.el.setAttribute('opacity', '0'); continue; }
    if (f.kind === 'ring') {
      const q = E.outCubic(p);
      f.el.setAttribute('cx', f.x); f.el.setAttribute('cy', f.y);
      f.el.setAttribute('r', (4 + f.r1 * q).toFixed(1));
      f.el.setAttribute('stroke-width', (f.w * (1 - q) + 0.5).toFixed(2));
      f.el.setAttribute('opacity', (f.maxOp * (1 - p)).toFixed(3));
    } else {
      const q = E.outCubic(p);
      const cx = f.x + Math.cos(f.a) * f.dist * q, cy = f.y + Math.sin(f.a) * f.dist * q;
      const l = f.len * (1 - p * 0.6);
      f.el.setAttribute('x1', (cx - Math.cos(f.a) * l).toFixed(1)); f.el.setAttribute('y1', (cy - Math.sin(f.a) * l).toFixed(1));
      f.el.setAttribute('x2', cx.toFixed(1)); f.el.setAttribute('y2', cy.toFixed(1));
      f.el.setAttribute('opacity', (1 - p).toFixed(3));
    }

}

// ---------- letters ----------
const CAPS = ['G', 'Z', '2', 'H'];
const PIECES = ['G', 'uitar', 'Z', 'ero', '2', 'H', 'ero'];
const CAP_IDX = [0, 2, 4, 5];           // indices of capitals inside PIECES
const LOW_IDX = [1, 3, 6];
const LOGO_SIZE = 320, WORD_SIZE = 150, LOGO_LS = 14;
const LOGO_CY = 540, WORD_CY = 522;
const capsG = $('caps'), lowG = $('low');
const capEls = CAPS.map((ch, i) => {
  const g = document.createElementNS(SVG_NS, 'g'); g.setAttribute('class', 'cap');
  const tx = document.createElementNS(SVG_NS, 'text');
  tx.textContent = ch; tx.setAttribute('fill', 'url(#redText)');
  g.appendChild(tx); capsG.appendChild(g);
  return { g, tx };
});
const lowEls = LOW_IDX.map((pi, k) => {
  const g = document.createElementNS(SVG_NS, 'g'); g.setAttribute('class', 'low');
  g.setAttribute('clip-path', `url(#clipLow${k})`);
  const tx = document.createElementNS(SVG_NS, 'text');
  tx.textContent = PIECES[pi]; tx.setAttribute('fill', 'url(#redText)'); tx.setAttribute('font-size', WORD_SIZE);
  g.appendChild(tx); lowG.appendChild(g);
  return { g, tx, clip: $('cl' + k) };
});
const ctx = document.createElement('canvas').getContext('2d');
function measure(str, size, weight) {
  ctx.font = `${weight} ${size}px Outfit, sans-serif`;
  const m = ctx.measureText(str);
  return { w: m.width, asc: m.actualBoundingBoxAscent, desc: m.actualBoundingBoxDescent };
}
const L = {}; // layout
function layout() {
  const cap320 = measure('H', LOGO_SIZE, 800).asc, cap150 = measure('H', WORD_SIZE, 800).asc;
  const capW = CAPS.map(c => measure(c, LOGO_SIZE, 800).w);
  const logoTotal = capW.reduce((a, b) => a + b, 0) + LOGO_LS * (CAPS.length - 1);
  let x = 960 - logoTotal / 2;
  L.logo = CAPS.map((c, i) => { const o = { x, w: capW[i], base: LOGO_CY + cap320 / 2, cap: cap320 }; x += capW[i] + LOGO_LS; return o; });
  const full = PIECES.join('');
  const wordTotal = measure(full, WORD_SIZE, 800).w;
  const start = 960 - wordTotal / 2;
  L.word = PIECES.map((p, i) => ({ x: start + measure(PIECES.slice(0, i).join(''), WORD_SIZE, 800).w, w: measure(p, WORD_SIZE, 800).w, base: WORD_CY + cap150 / 2, cap: cap150 }));
  L.wordLeft = start; L.wordRight = start + wordTotal;
  L.cap150 = cap150;
  lowEls.forEach((lo, k) => {
    const wp = L.word[LOW_IDX[k]];
    lo.tx.setAttribute('x', wp.x.toFixed(2)); lo.tx.setAttribute('y', wp.base.toFixed(2));
    lo.clip.setAttribute('x', (wp.x - 4).toFixed(2)); lo.clip.setAttribute('y', (wp.base - wp.cap - 30).toFixed(2));
    lo.clip.setAttribute('height', (wp.cap + 90).toFixed(2));
  });
  $('underline').setAttribute('d', `M ${L.wordLeft.toFixed(1)} ${(L.word[0].base + 38).toFixed(1)} L ${L.wordRight.toFixed(1)} ${(L.word[0].base + 38).toFixed(1)}`);
  $('url').setAttribute('y', (L.word[0].base + 104).toFixed(1));
}

// ---------- headstock pegs ----------
const pegsG = $('pegs');
const PEG_X = [268, 316, 364];
const pegEls = [];
[-1, 1].forEach(side => {
  PEG_X.forEach((px, k) => {
    const g = document.createElementNS(SVG_NS, 'g');
    const baseY = side < 0 ? -40 - k * 4 : 40 + k * 4;
    g.innerHTML = `<rect x="${px - 4}" y="${side < 0 ? baseY - 22 : baseY}" width="8" height="22" fill="#ffd9c9"/>` +
      `<ellipse cx="${px}" cy="${side < 0 ? baseY - 28 : baseY + 28}" rx="11" ry="8" fill="#8d0a12" stroke="#ffb3b3" stroke-width="1.5"/>`;
    g.dataset.ox = px; g.dataset.oy = baseY;
    pegsG.appendChild(g);
    pegEls.push({ g, ox: px, oy: baseY, idx: side < 0 ? k : 3 + k });
  });
});

// ---------- shake ----------
const SHAKES = LETTER_T.map((t, i) => ({ t, amp: [10, 9, 9, 13][i], ang: [0.35, 2.8, 1.4, -0.5][i] }));
function shake(t) {
  let dx = 0, dy = 0;
  for (const s of SHAKES) {
    const dt = t - s.t;
    if (dt > 0 && dt < 0.5) {
      const a = s.amp * Math.exp(-dt / 0.11) * Math.sin(2 * Math.PI * 19 * dt);
      dx += Math.cos(s.ang) * a; dy += Math.sin(s.ang) * a;
    }
  }
  return [dx, dy];
}

// ---------- render ----------
const spot = $('spot'), pick = $('pick'), miniPick = $('miniPick'), flash = $('flash'), fade = $('fade');
const head = $('head'), neck = $('neck'), underline = $('underline'), urlEl = $('url'), world = $('world');
function render(t) {
  // background light
  const spotOp = 0.75 * seg(t, 0.0, 1.3, E.outQuad) * (1 - 0.3 * seg(t, MORPH_T0, 0.8)) + 0.06 * Math.sin(t * 2.1);
  spot.setAttribute('opacity', clamp01(spotOp).toFixed(3));
  // strings
  const stringsOp = 1 - 0.3 * seg(t, MORPH_T0, 0.7, E.outQuad);
  stringsG.setAttribute('opacity', stringsOp.toFixed(3));
  stringEls.forEach((el, i) => {
    const draw = seg(t, 0.22 + i * 0.07, 0.6, E.outCubic);
    el.setAttribute('stroke-dashoffset', (1 - draw).toFixed(4));
    el.setAttribute('d', stringPath(i, t));
  });

  if (t > pt0 && t < pt1) {
    const py = STRING_Y[0] + (t - STRUM_T0) / STRUM_DT * 48;
    let kick = 0;
    STRING_Y.forEach((_, i) => { kick += 7 * pulse(t, STRUM_T0 + i * STRUM_DT, 0.05); });
    const px = STRUM_X - 2 + 36 * seg(t, pt0, pt1 - pt0) + kick;
    const rot = -24 + 8 * seg(t, pt0, pt1 - pt0);
    const op = seg(t, pt0, 0.12, E.outQuad) * (1 - seg(t, pt1 - 0.14, 0.14, E.outQuad));
    pick.setAttribute('transform', `translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(1.38)`);
    pick.setAttribute('opacity', op.toFixed(3));
  } else pick.setAttribute('opacity', '0');
  // flash
  let fl = 0;
  STRING_Y.forEach((_, i) => { fl += 0.12 * pulse(t, STRUM_T0 + i * STRUM_DT, 0.08); });
  LETTER_T.forEach(lt => { fl += 0.2 * pulse(t, lt, 0.1); });
  fl += 0.1 * pulse(t, RESOLVE_T, 0.25);
  flash.setAttribute('opacity', Math.min(0.5, fl).toFixed(3));
  // letters
  const morph = seg(t, MORPH_T0, MORPH_D, E.inOutQuint);
  const size = lerp(LOGO_SIZE, WORD_SIZE, morph);
  capEls.forEach((c, i) => {
    const a = L.logo[i], b = L.word[CAP_IDX[i]];
    const x = lerp(a.x, b.x, morph), base = lerp(a.base, b.base, morph);
    c.tx.setAttribute('x', x.toFixed(2)); c.tx.setAttribute('y', base.toFixed(2)); c.tx.setAttribute('font-size', size.toFixed(2));
    const p = seg(t, LETTER_T[i], 0.34, E.outExpo);
    const cap = lerp(a.cap, b.cap, morph), w = lerp(a.w, b.w, morph);
    const cx = x + w / 2, cy = base - cap / 2;
    const s = lerp(2.6, 1, p);
    c.g.setAttribute('transform', `translate(${cx.toFixed(1)} ${cy.toFixed(1)}) scale(${s.toFixed(4)}) translate(${(-cx).toFixed(1)} ${(-cy).toFixed(1)})`);
    c.g.setAttribute('opacity', (t < LETTER_T[i] ? 0 : Math.min(1, p * 1.6)).toFixed(3));
    const blur = 16 * (1 - p);
    c.g.style.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : '';
  });
  // shockwave rings for letters are built lazily (positions depend on layout)
  // lowercase reveal
  lowEls.forEach((lo, k) => {
    const wp = L.word[LOW_IDX[k]];
    const p = seg(t, MORPH_T0 + 0.28 + k * 0.1, 0.42, E.outCubic);
    lo.clip.setAttribute('width', (p * (wp.w + 8)).toFixed(2));
    lo.tx.setAttribute('x', (wp.x - 26 * (1 - p)).toFixed(2));
    lo.g.setAttribute('opacity', p > 0 ? '1' : '0');
  });
  // headstock: anchored to the H's right edge at crossbar height, scaled with the H
  {
    const hi = 3, a = L.logo[hi], b = L.word[CAP_IDX[hi]];
    const x = lerp(a.x, b.x, morph), base = lerp(a.base, b.base, morph);
    const cap = lerp(a.cap, b.cap, morph), w = lerp(a.w, b.w, morph);
    const sc = 1.12 * size / LOGO_SIZE;
    const grow = seg(t, HEAD_T0, 0.36, E.outBack);
    const shrink = 1 - seg(t, MORPH_T0 + 0.02, 0.32, E.inBack);
    const sx = Math.max(0, grow * shrink);
    head.setAttribute('opacity', sx > 0.001 ? '1' : '0');
    head.setAttribute('transform', `translate(${(x + w - 2).toFixed(1)} ${(base - cap * 0.49).toFixed(1)}) scale(${(sc * sx).toFixed(4)} ${sc.toFixed(4)})`);
    pegEls.forEach(pe => {
      const p = seg(t, PEG_T0 + pe.idx * PEG_DT, 0.26, E.outBack) * shrink;
      pe.g.setAttribute('transform', `translate(${pe.ox} ${pe.oy}) scale(${Math.max(0, p).toFixed(3)}) translate(${-pe.ox} ${-pe.oy})`);
    });
  }
  // underline + mini pick
  const up = seg(t, UNDER_T0, UNDER_D, E.outCubic);
  underline.setAttribute('stroke-dashoffset', (1 - up).toFixed(4));
  if (t > UNDER_T0 && t < UNDER_T0 + UNDER_D + 0.25) {
    const mx = lerp(L.wordLeft, L.wordRight, up), my = L.word[0].base + 38;
    const op = (1 - seg(t, UNDER_T0 + UNDER_D - 0.05, 0.25, E.outQuad));
    miniPick.setAttribute('transform', `translate(${(mx + 6).toFixed(1)} ${(my - 10).toFixed(1)}) rotate(-34) scale(0.34)`);
    miniPick.setAttribute('opacity', op.toFixed(3));
  } else miniPick.setAttribute('opacity', '0');
  // url
  const uq = seg(t, URL_T0, URL_D, E.outCubic);
  urlEl.setAttribute('opacity', (0.9 * uq).toFixed(3));
  urlEl.setAttribute('letter-spacing', (lerp(14, 2.5, uq)).toFixed(2));
  urlEl.setAttribute('transform', `translate(0 ${(14 * (1 - uq)).toFixed(1)})`);
  // shake
  const [dx, dy] = shake(t);
  world.setAttribute('transform', `translate(${dx.toFixed(2)} ${dy.toFixed(2)})`);
  // fx

  // outro
  fade.setAttribute('opacity', seg(t, FADE_T0, FADE_D, E.outQuad).toFixed(3));
}

// letter shockwaves need the layout; add them once fonts are measured
function addLetterFx() {
  L.logo.forEach((a, i) => {
    const cx = a.x + a.w / 2, cy = a.base - a.cap / 2;
    addRing(LETTER_T[i], cx, cy, 300, 10, 0.7, '#ff7a7a', 0.7);
    addSparks(LETTER_T[i], cx, cy, 5, '#ffb3b3');
  });
}

// ---------- audio (Karplus-Strong, same timings as the picture) ----------
let actx = null, soundOn = false, audioBuf = null, srcNode = null;
function synth(sr) {
  const n = Math.ceil(sr * DUR), mix = new Float32Array(n);
  let s = 7; const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296 * 2 - 1; };
  const pluckS = (freq, t0, amp, decay, bright, dur) => {

    buf[0] = r(); for (let i = 1; i < Lb; i++) buf[i] = buf[i - 1] * (1 - bright) + r() * bright;
    const st = Math.floor(t0 * sr), en = Math.min(n, st + Math.floor(dur * sr));

    const st = Math.floor(t0 * sr), en = Math.min(n, st + Math.floor(0.28 * sr));
    for (let k = st; k < en; k++) {

      const sw = 58 * (1 + 1.6 * Math.exp(-tt * 40));

    }
  };
  const EM = [82.41, 123.47, 164.81, 196.00, 246.94, 329.63];
  EM.forEach((f, k) => pluckS(f, STRUM_T0 + k * STRUM_DT, 0.42, 0.9972, 0.55, 4));
  LETTER_T.forEach(thump);
  for (let k = 0; k < 6; k++) pluckS(1318.5 * (1 + 0.02 * k), PEG_T0 + k * PEG_DT, 0.08, 0.985, 0.9, 0.4);
  const EMAJ = [82.41, 123.47, 164.81, 207.65, 246.94, 329.63];
  EMAJ.forEach((f, k) => pluckS(f, RESOLVE_T + k * RESOLVE_DT, 0.30, 0.9975, 0.45, 4));
  pluckS(659.26, URL_T0, 0.12, 0.998, 0.3, 2); pluckS(987.77, URL_T0 + 0.06, 0.08, 0.998, 0.3, 2);
  const D = Math.floor(0.135 * sr);
  for (let k = D; k < n; k++) mix[k] += 0.28 * mix[k - D];
  let peak = 0; for (let k = 0; k < n; k++) peak = Math.max(peak, Math.abs(mix[k]));
  const g = 0.89 / (peak || 1);

  peak = 0; for (let k = 0; k < n; k++) peak = Math.max(peak, Math.abs(mix[k]));
  for (let k = 0; k < n; k++) mix[k] *= 0.89 / peak;

}
function ensureAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
    const data = synth(actx.sampleRate);
    audioBuf = actx.createBuffer(1, data.length, actx.sampleRate);
    audioBuf.copyToChannel(data, 0);
  }
  if (actx.state === 'suspended') actx.resume();
  return true;
}
function playAudio() {
  if (!soundOn || !ensureAudio()) return;
  if (srcNode) { try { srcNode.stop(); } catch (e) {} }
  srcNode = actx.createBufferSource(); srcNode.buffer = audioBuf; srcNode.connect(actx.destination); srcNode.start();
}
function stopAudio() { if (srcNode) { try { srcNode.stop(); } catch (e) {} srcNode = null; } }

// ---------- playback ----------
const reduced = !EXPORT && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let startTs = 0, playing = false, raf = 0;
const timeEl = $('time');
function frame(ts) {
  if (!playing) return;
  const t = (ts - startTs) / 1000;
  if (t >= DUR + 0.6) { restart(); return; }
  render(Math.min(t, DUR));
  timeEl.textContent = Math.min(t, DUR).toFixed(2) + 's';
  raf = requestAnimationFrame(frame);
}

  cancelAnimationFrame(raf);
  playing = true;
  startTs = performance.now();
  playAudio();
  raf = requestAnimationFrame(frame);
}
function showStill() { playing = false; cancelAnimationFrame(raf); stopAudio(); render(5.4); timeEl.textContent = '5.40s'; }

async function boot() {
  try { await document.fonts.load('800 320px Outfit'); await document.fonts.load('500 46px Outfit'); } catch (e) {}
  layout(); addLetterFx();
  if (EXPORT) { render(0); window.__seek = t => render(t); window.__ready = true; return; }
  const replay = $('replay'), sound = $('sound'), hint = $('hint'), stage = $('stage');
  const setSound = on => { soundOn = on; sound.textContent = 'Sound: ' + (on ? 'on' : 'off'); sound.setAttribute('aria-pressed', String(on)); };
  replay.textContent = reduced ? 'Play' : 'Replay';
  replay.addEventListener('click', () => { restart(); });
  sound.addEventListener('click', () => { setSound(!soundOn); if (soundOn) { hint.hidden = true; ensureAudio(); } });
  stage.addEventListener('pointerdown', () => { setSound(true); hint.hidden = true; restart(); });
  window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); restart(); } });
  if (reduced) showStill(); else restart();
}
boot();
})();
</script>
