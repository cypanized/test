<title>GZ2H Intro</title>
<style>
/* Layout: one cinema stage, a transport bar under it, and the four scenes as a storyboard strip */
:root {
  --ink: #0d0306;
  --panel: #170609;
  --line: #2c1117;
  --brand: #b80016;
  --hot: #ff5a45;
  --text: #f5e9e6;
  --muted: #a88f92;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--text); }
body { font-family: var(--display); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 28px 56px; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
h1 b { color: var(--brand); font-weight: 700; }
.meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; box-shadow: 0 40px 90px -40px rgba(184, 0, 22, 0.45); }
.stage canvas { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; border: 0; padding: 0; cursor: pointer; color: var(--text); background: radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.5)); }
.overlay[hidden] { display: none !important; }
.pill { display: inline-flex; align-items: center; gap: 14px; padding: 12px 22px 12px 12px; border-radius: 999px; background: rgba(13, 3, 6, 0.74); border: 1px solid rgba(255, 255, 255, 0.14); font: 600 16px var(--display); letter-spacing: 0.01em; transition: transform 0.2s ease, background 0.2s ease; }
.overlay:hover .pill, .overlay:focus-visible .pill { transform: scale(1.04); background: rgba(13, 3, 6, 0.9); }
.overlay:focus-visible { outline: none; }
.overlay:focus-visible .pill { outline: 2px solid var(--hot); outline-offset: 3px; }
.disc { width: 46px; height: 46px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; box-shadow: 0 0 0 6px rgba(184, 0, 22, 0.25); }
.disc svg { width: 18px; height: 18px; margin-left: 3px; fill: #fff; }
.transport { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.tbtn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 600 14px var(--display); cursor: pointer; }
.tbtn:hover { border-color: #4a1a22; }
.tbtn:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.tbtn svg { width: 14px; height: 14px; fill: currentColor; }
.tbtn[aria-pressed="false"] { color: var(--muted); }
.track { position: relative; flex: 1 1 260px; min-width: 0; height: 38px; display: flex; align-items: center; }
.ticks { position: absolute; inset: 0; pointer-events: none; }
.ticks i { position: absolute; top: 6px; width: 1px; height: 7px; background: var(--muted); opacity: 0.6; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 38px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--brand) var(--p, 0%), var(--line) var(--p, 0%)); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line); }
input[type="range"]::-moz-range-progress { height: 3px; background: var(--brand); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--text); border: 0; }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--text); border: 0; }
input[type="range"]:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.tc { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tc b { color: var(--text); font-weight: 400; }
.scenes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.scene { position: relative; display: grid; gap: 6px; align-content: start; text-align: left; padding: 14px 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; overflow: hidden; min-width: 0; }
.scene:hover { border-color: #4a1a22; }
.scene:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.scene .st { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
.scene .sn { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.scene .sd { font-size: 13.5px; line-height: 1.45; color: var(--muted); }
.scene .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--brand); }
.scene.on { border-color: rgba(184, 0, 22, 0.7); }
.scene.on .st { color: var(--hot); }
body.render { margin: 0; overflow: hidden; background: #000; }
body.render .wrap > *:not(.stage) { display: none !important; }
body.render .wrap { padding: 0; max-width: none; display: block; }
body.render .stage { width: 1920px; height: 1080px; box-shadow: none; }
body.render .overlay { display: none !important; }
@media (prefers-reduced-motion: reduce) { .pill, .overlay:hover .pill { transition: none; transform: none; } }
</style>

    g.addColorStop(0, '#6d4b50'); g.addColorStop(0.45, '#f6e9e6'); g.addColorStop(1, '#7c555a');
    c.fillStyle = g; c.fillRect(x - 2.4, 502, 4.8, 126);
  }
  // nut
  const ng = c.createLinearGradient(STR.xN - 5, 0, STR.xN + 5, 0); ng.addColorStop(0, '#d9cbbd'); ng.addColorStop(0.5, '#fbf3ea'); ng.addColorStop(1, '#bfae9f');
  c.fillStyle = ng; c.fillRect(STR.xN - 4.5, 499, 9, 132);
  // headstock gloss
  const hg = c.createLinearGradient(0, 470, 0, 670); hg.addColorStop(0, 'rgba(255,255,255,0.12)'); hg.addColorStop(0.45, 'rgba(255,255,255,0)'); hg.addColorStop(1, 'rgba(0,0,0,0.25)');
  c.save(); c.beginPath(); c.rect(STR.xN + 4, 380, 500, 420); c.clip(); c.fillStyle = hg; c.fill(P.H, 'evenodd'); c.restore();
  // string posts
  for (const [x, y] of STR.posts) {
    const g = c.createRadialGradient(x - 2, y - 2, 0.5, x, y, 7.5); g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#cfc4c4'); g.addColorStop(1, '#6a5458');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, 7, 0, TAU); c.fill();
  }
  c.restore();
}

function drawStrings(st, alpha) {
  if (alpha <= 0.003) return;
  const t = st.t, k = st.cam.k;
  const N = 56;
  for (let i = 0; i < 6; i++) {
    const y0 = STR.y[i], w = STR.w[i];
    const pts = [];
    for (let j = 0; j <= N; j++) { const x = STR.xL + (STR.xN - STR.xL) * j / N; pts.push([x, y0 + strDisp(i, x, t)]); }
    const poly = (c, dy = 0) => { c.beginPath(); c.moveTo(pts[0][0], pts[0][1] + dy); for (let j = 1; j <= N; j++) c.lineTo(pts[j][0], pts[j][1] + dy); c.lineTo(STR.posts[i][0], STR.posts[i][1] + dy); };
    m.save(); m.globalAlpha = alpha;
    m.lineCap = 'round'; m.lineJoin = 'round';
    // shadow on the fretboard
    poly(m, 3.2); m.lineWidth = w * 1.3; m.strokeStyle = 'rgba(0,0,0,0.38)'; m.stroke();
    // body
    const sg = m.createLinearGradient(STR.xL, 0, STR.xL + 240, 0);
    sg.addColorStop(0, 'rgba(226,214,210,0)'); sg.addColorStop(1, 'rgba(226,214,210,1)');
    poly(m); m.lineWidth = w; m.strokeStyle = sg; m.stroke();
    if (i < 3 && k > 1.6) { m.setLineDash([0.9, 0.9]); m.lineWidth = w * 0.85; m.strokeStyle = 'rgba(70,40,40,0.45)'; m.stroke(); m.setLineDash([]); }
    poly(m, -w * 0.22); m.lineWidth = w * 0.32; m.strokeStyle = 'rgba(255,255,255,0.55)'; m.stroke();
    m.restore();
    // glow
    const en = strEnergy(i, t) * alpha;
    if (en > 0.01) {
      e.save(); e.lineCap = 'round'; e.lineJoin = 'round';
      for (let sIdx = 0; sIdx < 3; sIdx++) {
        const ts = t - sIdx * 0.0055;
        e.beginPath();
        for (let j = 0; j <= N; j++) { const x = STR.xL + (STR.xN - STR.xL) * j / N, y = y0 + strDisp(i, x, ts); j ? e.lineTo(x, y) : e.moveTo(x, y); }
        e.globalAlpha = clamp(en) * (sIdx === 0 ? 0.9 : 0.4);
        const gg = e.createLinearGradient(STR.xL, 0, STR.xL + 200, 0);
        gg.addColorStop(0, 'rgba(255,90,60,0)'); gg.addColorStop(1, 'rgba(255,120,90,1)');
        e.strokeStyle = gg; e.lineWidth = w * 1.4 + 2.4 / k; e.stroke();
      }
      e.restore();
    }
  }
  // the glint that runs along the low E in the dark
  if (t > 0.05 && t < 0.48) {
    const u = inv(0.06, 0.44, t), x = lerp(2330, STR.xN, eIO3(u)), a = Math.sin(Math.PI * u);
    const g = e.createLinearGradient(x - 60, 0, x + 60, 0);
    g.addColorStop(0, 'rgba(255,200,180,0)'); g.addColorStop(0.5, `rgba(255,236,226,${0.95 * a})`); g.addColorStop(1, 'rgba(255,200,180,0)');
    e.save(); e.strokeStyle = g; e.lineWidth = STR.w[0] * 1.6; e.lineCap = 'round';
    e.beginPath(); e.moveTo(x - 60, STR.y[0]); e.lineTo(x + 60, STR.y[0]); e.stroke(); e.restore();
  }
}

function withLetter(c, st, id, fn) {
  const t = st.t, h = HANDS.find(hh => hh.letter === id);
  c.save();
  const s = h ? squash(t, T.hands[HANDS.indexOf(h)]) : 0;
  if (s) { const b = LET[id].bb, cx = (b[0] + b[2]) / 2; c.translate(cx, b[3]); c.scale(1 + 0.5 * s, 1 - s); c.translate(-cx, -b[3]); }
  fn();
  c.restore();
}

function revealClip(c, R, withNeck) {
  c.beginPath();
  if (R > 0) c.arc(REVEAL_C.x, REVEAL_C.y, R, 0, TAU);
  if (withNeck) { c.rect(2150, 470, 620, 158); c.rect(2770, 370, 470, 420); }
  c.clip();
}

function drawLogo(st) {
  const t = st.t, R = revealR(t), revealing = R < 1e5;
  const zDetail = sstep(2.2, 5.2, st.cam.z);
  const patchA = 1 - sstep(T.hands[3] + 0.06, T.hands[3] + 0.14, t);
  const strA = (1 - 0.4 * sstep(2.3, 2.7, t)) * (1 - sstep(4.26, 4.42, t));
  const fill = letterFill();

  // H, neck, strings
  if (t < T.morph0 + 0.7) {
    const mH = t >= T.morph0 ? morphT(t, 3) : 0;
    m.save(); e.save();
    if (mH > 0) {
      const to = glyphBBW(WM.glyphs[MORPH_MAP.H]), cur = lerpBB(MBB.H, to, mH, 60);
      applyMorph(m, MBB.H, cur); applyMorph(e, MBB.H, cur);
    }
    withLetter(m, st, 'H', () => {
      if (revealing) revealClip(m, R, true);
      const aBody = 1 - sstep(0.25, 0.6, mH), aNeck = 1 - sstep(0, 0.3, mH);
      m.fillStyle = fill;
      m.save(); m.beginPath(); m.rect(0, 0, 2705, 1400); m.clip(); m.globalAlpha = aBody; m.fill(P.H, 'evenodd'); m.restore();
      m.save(); m.beginPath(); m.rect(2705, 0, 800, 1400); m.clip(); m.globalAlpha = aNeck; m.fill(P.H, 'evenodd'); m.restore();
      if (patchA > 0) {
        m.globalAlpha = patchA * aNeck; m.fillStyle = BRAND;
        m.fillRect(2150, 503, 645, 124); m.globalAlpha = patchA * aNeck * (1 - zDetail); m.fillRect(2440, 600, 282, 46);
        m.globalAlpha = 1;
      }
      neckDetails(m, zDetail);
      // strings follow the H (so they ride the squash)
      e.save();
      const s = squash(t, T.hands[3]);
      if (s) { const b = LET.H.bb, cx = (b[0] + b[2]) / 2; e.translate(cx, b[3]); e.scale(1 + 0.5 * s, 1 - s); e.translate(-cx, -b[3]); }
      drawStrings(st, strA * aNeck);
      e.restore();
    });
    m.restore(); e.restore();
  }

  // G, Z, 2
  if (t >= T.strum - 0.02 && t < T.morph0 + 0.75) {
    for (const id of ['G', 'Z', 'two']) {
      const idx = ['G', 'Z', 'two'].indexOf(id);
      const mm = t >= T.morph0 ? morphT(t, idx) : 0;
      m.save();
      if (mm > 0) applyMorph(m, MBB[id], lerpBB(MBB[id], glyphBBW(WM.glyphs[MORPH_MAP[id]]), mm, 60));
      withLetter(m, st, id, () => {
        if (revealing) revealClip(m, R, false);
        m.globalAlpha = 1 - sstep(0.3, 0.7, mm);
        m.fillStyle = fill; m.fill(P[id], 'evenodd');
      });
      m.restore();
    }
  }

  // hot reveal front
  if (revealing && R > 0) {
    const a = 1 - sstep(2600, 3500, R);
    const g = e.createRadialGradient(REVEAL_C.x, REVEAL_C.y, Math.max(0, R - 150 / st.cam.k), REVEAL_C.x, REVEAL_C.y, R);
    g.addColorStop(0, 'rgba(255,60,40,0)'); g.addColorStop(0.6, `rgba(255,60,40,${0.18 * a})`); g.addColorStop(0.93, `rgba(255,150,120,${0.5 * a})`); g.addColorStop(1, 'rgba(255,230,210,0)');
    e.save(); e.fillStyle = g;
    for (const id of ['G', 'Z', 'two', 'H']) e.fill(P[id], 'evenodd');
    e.lineWidth = 3 / st.cam.k; e.strokeStyle = `rgba(255,150,120,${0.35 * a})`;
    e.beginPath(); e.arc(REVEAL_C.x, REVEAL_C.y, R, 0, TAU); e.stroke();
    e.restore();
  }

  // hands
  HANDS.forEach((h, i) => {
    const th = T.hands[i]; if (t < th || t > T.handsOut + 0.4) return;
    const tau = t - th, s = spring(tau, 2.4, 0.36);
    const outS = inv(T.handsOut + 0.04 * i, T.handsOut + 0.04 * i + 0.2, t);
    let sc = s * (1 - eInBack(outS, 2.2));
    let rot = (1 - s) * 0.55 * h.dir + 0.03 * Math.sin(TAU * 1.4 * tau + i) * sstep(0.4, 0.8, tau) + outS * 0.7 * h.dir;
    const dy = -outS * 50;
    if (sc <= 0.001) return;
    m.save();
    withLetter(m, st, h.letter, () => {
      m.translate(h.anchor[0], h.anchor[1] + dy); m.rotate(rot); m.scale(sc, sc); m.translate(-h.anchor[0], -h.anchor[1]);
      m.globalAlpha = clamp(tau * 25) * (1 - sstep(0.7, 1, outS));
      m.fillStyle = fill; m.fill(P[h.id], 'evenodd');
      // arrival heat
      const heat = Math.exp(-tau * 5) * (1 - outS);
      if (heat > 0.02) {
        e.save(); e.setTransform(m.getTransform()); e.globalAlpha = heat * 0.75; e.fillStyle = '#ff7a5c'; e.fill(P[h.id], 'evenodd'); e.restore();
      }
    });
    m.restore();
  });

  // light sweep across the finished logo
  if (t > T.sweep1 && t < T.sweep1 + 0.65) {
    const u = inv(T.sweep1, T.sweep1 + 0.65, t), bx = lerp(-400, 3600, eIO3(u));
    const g = e.createLinearGradient(bx - 260, 1000, bx + 260, 300);
    g.addColorStop(0, 'rgba(255,220,210,0)'); g.addColorStop(0.5, 'rgba(255,225,215,0.38)'); g.addColorStop(1, 'rgba(255,220,210,0)');
    e.save(); e.fillStyle = g;
    for (const id of ['G', 'Z', 'two', 'H', 'horns', 'thumb', 'wave', 'ok']) e.fill(P[id], 'evenodd');
    e.restore();
  }
}

function drawPickScene(st) {
  const t = st.t;
  if (t < 0.02 || t > 1.95) return;
  const lift = LIFT(t), a = sstep(0.04, 0.2, t) * (1 - sstep(1.67, 1.75, t));
  const rim = 0.25 + Math.max(...[0, 1, 2, 3, 4, 5].map(i => strEnergy(i, t))) * 1.4;
  const size = 30 * (1 + 0.16 * lift);
  const strumming = t > 1.57 && t < 1.78;
  if (strumming) {
    for (let s = 4; s >= 1; s--) {
      const ts = t - s * 0.004, p = pickAt(ts);
      drawPick(m, p.x, p.y, -0.42, size, a * 0.18, lift, 0, 0, null);
    }
  }
  const p = pickAt(t);
  drawPick(m, p.x, p.y, -0.42 + 0.06 * Math.sin(t * 3), size, a, lift, 0, rim, e);
  // strum smear
  if (strumming) {
    const p0 = pickAt(t - 0.03);
    const g = e.createLinearGradient(p0.x, p0.y, p.x, p.y);
    g.addColorStop(0, 'rgba(255,120,90,0)'); g.addColorStop(1, 'rgba(255,200,170,0.55)');
    e.save(); e.strokeStyle = g; e.lineWidth = 26; e.lineCap = 'round'; e.beginPath(); e.moveTo(p0.x, p0.y); e.lineTo(p.x, p.y); e.stroke(); e.restore();
  }
}

// ───────────────────────── drawing: wordmark ─────────────────────────
function lineExtent(t) { return 980 * eOut3(inv(T.line0, T.line0 + 0.42, t)) - 320 * eIO3(inv(6.15, 6.9, t)); }
function drawWordmark(st) {
  const t = st.t;
  if (t < T.morph0 || !WM.glyphs.length) return;
  const fsW = WM.fs / K0;
  const font = `700 ${fsW}px "Space Grotesk"`;
  m.save(); e.save();
  m.font = font; e.font = font; m.textBaseline = e.textBaseline = 'alphabetic';
  const baseW = toW(0, WM.base)[1];
  const lineYW = toW(0, WM.lineY)[1];
  const fill = letterFill();
  WM.glyphs.forEach((g, i) => {
    const ride = 0.6 * wmDisp(g.cx, t) / K0;
    const [ox] = toW(g.ox, 0);
    if (g.cap) {
      const id = Object.keys(MORPH_MAP).find(k => MORPH_MAP[k] === i), idx = ['G', 'Z', 'two', 'H'].indexOf(id);
      const mm = morphT(t, idx); if (mm <= 0) return;
      const to = glyphBBW(g), cur = lerpBB(MBB[id], to, mm, 60);
      m.save(); applyMorph(m, to, cur); m.translate(0, ride);
      m.globalAlpha = sstep(0.3, 0.7, mm); m.fillStyle = fill; m.fillText(g.ch, ox, baseW); m.restore();
      const heat = Math.sin(Math.PI * mm) ** 2 * 0.8;
      if (heat > 0.01) { e.save(); applyMorph(e, to, cur); e.globalAlpha = heat; e.fillStyle = '#ff6a4c'; e.fillText(g.ch, ox, baseW); e.restore(); }
    } else {
      const s0 = T.lower0 + 0.03 * g.rank, u = inv(s0, s0 + 0.46, t);
      if (u <= 0) return;
      const yOff = (1 - eOutBack(u, 2.0)) * WM.cap * 1.25 / K0;
      m.save(); m.beginPath(); m.rect(-5000, -5000, 12000, baseW + 8 / K0 + 5000 + ride); m.clip();
      m.fillStyle = fill; m.fillText(g.ch, ox, baseW + yOff + ride); m.restore();
      const heat = (1 - inv(s0, s0 + 0.6, t)) * 0.9;
      if (heat > 0.01) { e.save(); e.beginPath(); e.rect(-5000, -5000, 12000, baseW + 8 / K0 + 5000 + ride); e.clip(); e.globalAlpha = heat; e.fillStyle = '#ff6a4c'; e.fillText(g.ch, ox, baseW + yOff + ride); e.restore(); }
    }
  });
  // the string under the wordmark
  const ext = lineExtent(t);
  if (ext > 1) {
    const x0 = 960 - ext, x1 = 960 + ext, N = 96, en = wmEnergy(t);
    const settle = 1 - 0.55 * sstep(6.15, 6.9, t);
    const path = (c, dtt = 0) => {
      c.beginPath();
      for (let j = 0; j <= N; j++) { const sx = lerp(x0, x1, j / N), [wx, wy] = toW(sx, WM.lineY + wmDisp(sx, t - dtt)); j ? c.lineTo(wx, wy) : c.moveTo(wx, wy); }
    };
    const g = m.createLinearGradient(toW(x0, 0)[0], 0, toW(x1, 0)[0], 0);
    g.addColorStop(0, 'rgba(255,214,206,0)'); g.addColorStop(0.12, `rgba(255,214,206,${0.9 * settle})`); g.addColorStop(0.88, `rgba(255,214,206,${0.9 * settle})`); g.addColorStop(1, 'rgba(255,214,206,0)');
    path(m); m.lineWidth = 2.2 / K0; m.strokeStyle = g; m.lineCap = 'round'; m.stroke();
    const glow = Math.max(en, 0.35 * (1 - inv(T.line0 + 0.2, T.line0 + 0.9, t)));
    if (glow > 0.01) {
      for (let s = 0; s < 3; s++) {
        path(e, s * 0.006); e.lineWidth = (3 + 4 * en) / K0; e.globalAlpha = glow * (s ? 0.35 : 0.9);
        const gg = e.createLinearGradient(toW(x0, 0)[0], 0, toW(x1, 0)[0], 0);
        gg.addColorStop(0, 'rgba(255,100,70,0)'); gg.addColorStop(0.2, 'rgba(255,140,110,1)'); gg.addColorStop(0.8, 'rgba(255,140,110,1)'); gg.addColorStop(1, 'rgba(255,100,70,0)');
        e.strokeStyle = gg; e.lineCap = 'round'; e.stroke();
      }
      e.globalAlpha = 1;
    }
    // drawing head
    if (t < T.line0 + 0.42) {
      for (const hx of [x0, x1]) { const [wx, wy] = toW(hx, WM.lineY); e.drawImage(SPR, wx - 40 / K0, wy - 40 / K0, 80 / K0, 80 / K0); }
    }
  }
  // URL
  if (t > T.url) {
    const u = inv(T.url, T.url + 0.7, t), a = eOut3(u) * 0.92;
    const ls = lerp(0.55, 0.16, eOut3(inv(T.url, T.url + 0.9, t))) * URL_T.fs;
    const total = URL_T.adv.reduce((s, v) => s + v, 0) + ls * (URL_T.adv.length - 1);
    let sx = 960 - total / 2;
    m.font = `500 ${URL_T.fs / K0}px "Space Grotesk"`;
    m.fillStyle = `rgba(247,233,229,${a})`;
    const [, by] = toW(0, URL_T.base + (1 - eOut3(u)) * 10);
    [...URL_T.text].forEach((ch, i) => { m.fillText(ch, toW(sx, 0)[0], by); sx += URL_T.adv[i] + ls; });
  }
  // soft neon glow while the wordmark holds
  const hold = sstep(5.7, 6.4, t);
  if (hold > 0.01) {
    e.globalAlpha = hold * (0.13 + 0.04 * Math.sin(t * 3.1)); e.fillStyle = '#ff2f3c';
    WM.glyphs.forEach(gl => { const [ox] = toW(gl.ox, 0); e.fillText(gl.ch, ox, baseW + 0.6 * wmDisp(gl.cx, t) / K0); });
    e.globalAlpha = 1;
  }
  // sweep across the wordmark
  if (t > T.sweep2 && t < T.sweep2 + 0.7) {
    const u = inv(T.sweep2, T.sweep2 + 0.7, t), bx = toW(lerp(200, 1720, eIO3(u)), 0)[0];
    const g = e.createLinearGradient(bx - 200, 900, bx + 200, 300);
    g.addColorStop(0, 'rgba(255,220,210,0)'); g.addColorStop(0.5, 'rgba(255,228,218,0.42)'); g.addColorStop(1, 'rgba(255,220,210,0)');
    e.fillStyle = g;
    WM.glyphs.forEach(gl => { const [ox] = toW(gl.ox, 0); e.fillText(gl.ch, ox, baseW + 0.6 * wmDisp(gl.cx, t) / K0); });
  }
  m.restore(); e.restore();
}

function drawFinalPick(st) {
  const t = st.t; if (t < 5.08 || t > 5.4) return;
  const key = [[5.08, 1030, 860], [5.2, 978, 600], [5.3, 966, 566], [5.36, 958, 520], [5.4, 955, 500]];
  let i = 0; while (i < key.length - 2 && key[i + 1][0] < t) i++;
  const s = eIO3(inv(key[i][0], key[i + 1][0], t));
  const sx = lerp(key[i][1], key[i + 1][1], s), sy = lerp(key[i][2], key[i + 1][2], s);
  const a = sstep(5.08, 5.16, t) * (1 - sstep(5.31, 5.36, t));
  const [wx, wy] = toW(sx, sy);
  drawPick(m, wx, wy, Math.PI - 0.25, 34 / K0, a, 0, 0, 0.5, e);
}

// ───────────────────────── HUD (tuner) ─────────────────────────
const NOTES = [
  { t: T.pluck6, n: 'E', o: '2', f: '82.41', s: 6 }, { t: T.arp[0], n: 'A', o: '2', f: '110.00', s: 5 },
  { t: T.arp[1], n: 'D', o: '3', f: '146.83', s: 4 }, { t: T.arp[2], n: 'G', o: '3', f: '196.00', s: 3 },
  { t: T.arp[3], n: 'B', o: '3', f: '246.94', s: 2 }, { t: T.arp[4], n: 'E', o: '4', f: '329.63', s: 1 },
];
function spaced(c, text, x, y, ls) { for (const ch of text) { c.fillText(ch, x, y); x += c.measureText(ch).width + ls; } return x; }
function drawHUD(st) {
  const t = st.t, A = sstep(0.38, 0.5, t) * (1 - sstep(1.57, 1.62, t));
  if (A <= 0.002) return;
  let ev = NOTES[0]; for (const nn of NOTES) if (t >= nn.t) ev = nn;
  const tau = Math.max(0, t - ev.t), inA = inv(0, 0.07, tau), dy = (1 - eOut3(inv(0, 0.12, tau))) * 16;
  setScreen(m, st);
  const x0 = 120, y0 = 820;
  m.textBaseline = 'alphabetic';
  m.font = '700 14px "Space Mono"'; m.fillStyle = `rgba(255,214,206,${0.75 * A})`;
  spaced(m, `STRING ${ev.s}`, x0, y0, 3.2);
  m.font = '400 14px "Space Mono"'; m.fillStyle = `rgba(255,214,206,${0.5 * A})`;
  spaced(m, 'OPEN · STANDARD TUNING', x0 + 132, y0, 2.2);
  m.font = '700 96px "Space Grotesk"'; m.fillStyle = `rgba(255,242,238,${A * inA})`;
  m.fillText(ev.n, x0 - 4, y0 + 96 + dy);
  const nw = m.measureText(ev.n).width;
  m.font = '500 34px "Space Grotesk"'; m.fillStyle = `rgba(255,214,206,${0.75 * A * inA})`;
  m.fillText(ev.o, x0 + nw + 2, y0 + 96 + dy);
  m.font = '400 20px "Space Mono"'; m.fillStyle = `rgba(255,214,206,${0.8 * A * inA})`;
  m.fillText(`${ev.f} Hz`, x0 + nw + 46, y0 + 62 + dy);
  // tuner scale
  const ty = y0 + 128, tw = 300, cx = x0 + tw / 2;
  for (let k = 0; k <= 20; k++) {
    const x = x0 + k * tw / 20, big = k === 10, mid = k % 5 === 0;
    m.fillStyle = `rgba(255,214,206,${(big ? 0.75 : mid ? 0.45 : 0.25) * A})`;

      const o = ac.createOscillator(), a = G(0); o.frequency.value = f * mul;
      a.gain.setValueAtTime(0.0001, at(time)); a.gain.exponentialRampToValueAtTime(g * gg, at(time + 0.006)); a.gain.exponentialRampToValueAtTime(0.0001, at(time + 1.6));
      o.connect(a); a.connect(panTo(0.15, master)); send(a, 0.8); o.start(at(time)); o.stop(at(time + 1.7));
    }
  };

  // ── score ──
  drone(0.0, T.strum - 0.02, 0.2);
  swell(0.0, T.strum - 0.01, 0.15, 300, 4200, 3);
  whoosh(0.06, 0.42, 0.12);                                  // glint along the string
  cleanNote(T.pluck6, F.E2, 0.95, -0.25, 3.6);
  ['A2', 'D3', 'G3', 'B3', 'E4'].forEach((n, i) => cleanNote(T.arp[i], F[n], 0.82, -0.15 + i * 0.11, 3.0));
  swell(1.28, T.strum - 0.005, 0.32, 3000, 9000, 0.7, 'highpass');
  strum(T.strumAt, ['E2', 'B2', 'E3', 'E3', 'B3', 'E4'], 3.6, 0.55, 2.66, false);
  kick(T.strum, 0.75); boom(T.strum, 0.5); crash(T.strum, 0.8, 2.8); snare(T.strum, 0.55);
  // four hands
  const chug = (time, notes) => strum([0, 0.006, 0.012].map(d => time + d), notes, 0.3, 1.0, null, true);
  chug(T.hands[0], ['E2', 'B2', 'E3']); kick(T.hands[0], 0.55);
  chug(T.hands[1], ['E2', 'B2', 'E3']); snare(T.hands[1], 0.6);
  chug(T.hands[2], ['G2', 'D3', 'G3']); kick(T.hands[2], 0.55);
  strum([0, 0.008, 0.016].map(d => T.hands[3] + d), ['A2', 'E3', 'A3'], 3.2, 0.55, 4.86, false);
  kick(T.hands[3], 0.6); snare(T.hands[3], 0.65); crash(T.hands[3], 0.4, 1.8);
  // transition
  whoosh(T.handsOut - 0.02, 0.5, 0.22);
  swell(4.7, T.final - 0.005, 0.3, 2500, 9000, 0.7, 'highpass');
  [[5.0, 210], [5.075, 175], [5.15, 140], [5.225, 112]].forEach(([tt, f]) => tom(tt, f, 0.3));
  // the final hit
  strum([0, 0.009, 0.018, 0.027].map(d => T.final + d), ['E2', 'B2', 'E3', 'B3'], 4.2, 0.6, null, false);
  kick(T.final, 0.75); boom(T.final, 0.55); crash(T.final, 0.85, 3.2); snare(T.final, 0.5);
  ['E4', 'Gs4', 'B4', 'E5'].forEach((n, i) => cleanNote(T.final + 0.04 + i * 0.06, F[n], 0.32, 0.35 - i * 0.2, 3.4));
  chime(T.url + 0.02, F.E6, 0.05);
}

function wavB64(buf) {
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
  let pk = 0; for (let c = 0; c < ch; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) pk = Math.max(pk, Math.abs(d[i])); }
  const gain = 0.89 / (pk || 1);
  const bytes = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) bytes.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); bytes.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt '); bytes.setUint32(16, 16, true); bytes.setUint16(20, 1, true); bytes.setUint16(22, ch, true);
  bytes.setUint32(24, sr, true); bytes.setUint32(28, sr * ch * 2, true); bytes.setUint16(32, ch * 2, true); bytes.setUint16(34, 16, true); w(36, 'data'); bytes.setUint32(40, n * ch * 2, true);
  const chans = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  let o = 44; for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { const v = clamp(chans[c][i] * gain, -1, 1); bytes.setInt16(o, v * 32767, true); o += 2; }
  let s = ''; const u8 = new Uint8Array(bytes.buffer); for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { b64: btoa(s), peak: pk };
}

// ───────────────────────── boot ─────────────────────────
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
setQuality(1);

window.GZ = {
  DUR,
  ready: ready.then(() => { initBursts(); }),
  frame: t => render(t),
  frameMB(t, n = 4) {
    if (!this.acc) { this.acc = mk(CW, CH); this.ax = this.acc.getContext('2d'); }
    const ax = this.ax;
    for (let i = 0; i < n; i++) {
      render(t + ((i + 0.5) / n - 0.5) / 120, false);
      ax.globalAlpha = 1 / (i + 1); ax.drawImage(canvas, 0, 0);
    }
    m.setTransform(1, 0, 0, 1, 0, 0); m.globalAlpha = 1; m.globalCompositeOperation = 'copy'; m.drawImage(this.acc, 0, 0); m.globalCompositeOperation = 'source-over';
    grain(Math.round(t * 60));
  },
  async audio() { const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr); buildAudio(oc, 0, 0); const b = await oc.startRendering(); return wavB64(b); },
};
if (RENDER) return;

// ───────────────────────── player UI ─────────────────────────
const stage = document.getElementById('stage');
const big = document.getElementById('big'), bigLabel = document.getElementById('bigLabel');
const playBtn = document.getElementById('play'), playLabel = document.getElementById('playLabel'), playIcon = document.getElementById('playIcon');
const soundBtn = document.getElementById('sound'), soundLabel = document.getElementById('soundLabel');
const scrub = document.getElementById('scrub'), tcNow = document.getElementById('tcNow');
const scenesEl = document.getElementById('scenes'), ticks = document.getElementById('ticks');
const SOUND_FILE = 'gz2h-intro.mp3';
const POSTER = 3.64;
const ICON_PLAY = 'M3 1.8v12.4c0 .6.7 1 1.2.7l10-6.2c.5-.3.5-1.1 0-1.4l-10-6.2C3.7.8 3 1.2 3 1.8z';
const ICON_PAUSE = 'M3 2h3.4v12H3zM9.6 2H13v12H9.6z';

SCENES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'scene'; b.type = 'button'; b.id = 'scene-' + i;
  b.innerHTML = `<span class="st">${String(i + 1).padStart(2, '0')} · ${s.t.toFixed(2)} s</span><span class="sn">${s.name}</span><span class="sd">${s.desc}</span><span class="fill"></span>`;
  b.addEventListener('click', () => play(s.t));
  scenesEl.appendChild(b);
  if (i) { const tk = document.createElement('i'); tk.style.left = `calc(${(s.t / DUR) * 100}% + ${7 - 14 * s.t / DUR}px)`; ticks.appendChild(tk); }
});

let now = POSTER, playing = false, soundOn = true, ac = null, t0 = 0, perf0 = 0, raf = 0, slow = 0;
function fitQuality() {
  const want = clamp(stage.clientWidth * Math.min(2, window.devicePixelRatio || 1) / W, 0.4, 1);
  const q = Math.round(want * 20) / 20;
  if (Math.abs(q - Q) > 0.049) { setQuality(q); BG = VIG = LETTER_FILL = null; }
}
function show(t) {
  now = t; render(t);
  scrub.value = t.toFixed(3); scrub.style.setProperty('--p', (t / DUR * 100) + '%');
  tcNow.textContent = t.toFixed(2);
  SCENES.forEach((s, i) => {
    const el = scenesEl.children[i], on = t >= s.t && t < s.end;
    el.classList.toggle('on', on);
    el.querySelector('.fill').style.width = (clamp((t - s.t) / (s.end - s.t)) * 100) + '%';
  });
}
// Sound comes from a pre-rendered soundtrack file played through an <audio> element, which the
// iPhone silent switch does not mute (Web Audio is muted by it). Live synthesis is the fallback.
const snd = new Audio(); snd.preload = 'auto'; snd.src = SOUND_FILE;
let fileOK = true, mode = 'none', synthFrom = 0;
snd.addEventListener('error', () => { fileOK = false; });
snd.addEventListener('playing', () => { if (mode === 'file' && ac) { ac.close().catch(() => {}); ac = null; } });
function stopAudio() { mode = 'none'; try { snd.pause(); } catch (err) {} if (ac) { ac.close().catch(() => {}); ac = null; } }
function noSound() { mode = 'none'; soundLabel.textContent = 'No sound'; }
function startSynth() {
  if (!ac) return noSound();
  try {
    synthFrom = clamp((performance.now() - perf0) / 1000, 0, DUR);
    if (ac.resume) ac.resume();
    t0 = ac.currentTime + 0.15; buildAudio(ac, t0, synthFrom); mode = 'synth';
  } catch (err) { noSound(); }
}
function setPlayingUI(p) {
  playing = p;
  playLabel.textContent = p ? 'Pause' : (now >= DUR - 0.01 ? 'Replay' : 'Play');
  playIcon.firstElementChild.setAttribute('d', p ? ICON_PAUSE : ICON_PLAY);
  big.hidden = p;
}
function play(from = 0) {
  if (from >= DUR - 0.05) from = 0;
  stopAudio(); cancelAnimationFrame(raf);
  perf0 = performance.now() - from * 1000;
  const startedAt = performance.now();
  if (soundOn) {
    soundLabel.textContent = 'Sound on';
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (err) {}
    // unlock a context inside this tap, in case the file can't play and we fall back to synthesis
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.resume) ac.resume(); } catch (err) { ac = null; }
    if (fileOK) {
      mode = 'file';
      try { snd.currentTime = from; } catch (err) {}
      const p = snd.play();
      if (p && p.catch) p.catch(() => { if (mode === 'file') startSynth(); });
    } else startSynth();
  }
  slow = 0;
  setPlayingUI(true);
  const tick = () => {
    let t;
    if (mode === 'file') {
      if (snd.ended) t = DUR;
      else if (!snd.paused && snd.readyState >= 3) { t = snd.currentTime; perf0 = performance.now() - t * 1000; }
      else if (performance.now() - startedAt < 1500) { t = from; perf0 = performance.now() - from * 1000; }
      else { startSynth(); t = (performance.now() - perf0) / 1000; }
    } else if (mode === 'synth' && ac) t = ac.currentTime - t0 + synthFrom - (ac.outputLatency || 0);
    else t = (performance.now() - perf0) / 1000;
    const f0 = performance.now();
    show(clamp(t, 0, DUR));
    if (performance.now() - f0 > 26 && ++slow > 20 && Q > 0.5) { setQuality(Math.max(0.5, Q - 0.2)); BG = VIG = LETTER_FILL = null;  slow = 0; }
    if (t >= DUR) { setPlayingUI(false); show(6.9); now = DUR; playLabel.textContent = 'Replay'; bigLabel.textContent = 'Replay with sound'; big.hidden = false; stopAudio(); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
GZ.player = { snd, get mode() { return mode; } };
function pause() { cancelAnimationFrame(raf); stopAudio(); setPlayingUI(false); }

big.addEventListener('click', () => play(now >= DUR - 0.01 || now === POSTER ? 0 : now));
playBtn.addEventListener('click', () => (playing ? pause() : play(now >= DUR - 0.01 ? 0 : now)));
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.setAttribute('aria-pressed', String(soundOn)); soundLabel.textContent = soundOn ? 'Sound on' : 'Sound off';
  bigLabel.textContent = soundOn ? 'Play with sound' : 'Play';
  if (playing) play(now);
});
scrub.addEventListener('input', () => { if (playing) pause(); show(+scrub.value); });
stage.addEventListener('keydown', ev => { if (ev.key === ' ' && ev.target === stage) { ev.preventDefault(); playing ? pause() : play(now); } });
window.addEventListener('resize', () => { fitQuality(); if (!playing) show(now); });

GZ.ready.then(() => { fitQuality(); show(now); });
})();
</script>
