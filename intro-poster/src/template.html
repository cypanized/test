<title>GZ2H Gig Poster</title>
<style>
/* Layout: the poster video is the page's one object, pinned up like a print; transport and the four scene tickets sit under it */
:root {
  --paper: #efe6d2;
  --card: #f7f1e3;
  --ink: #241b18;
  --red: #c41f2b;
  --red-deep: #9c0d1a;
  --muted: #6b5d55;
  --rule: rgba(36, 27, 24, 0.22);
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;

html, body { background: var(--paper); color: var(--ink); }
body { margin: 0; font-family: var(--display); background-image: radial-gradient(rgba(36, 27, 24, 0.06) 0.9px, transparent 1.3px); background-size: 7px 7px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 28px 56px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
h1 { margin: 0; font-size: clamp(24px, 3vw, 34px); font-weight: 700; letter-spacing: -0.02em; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }

.meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #1d1512; overflow: hidden; border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--red); box-sizing: border-box; }
.stage canvas { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; inset: 0; display: grid; place-items: end start; border: 0; padding: 0 0 7.5% 4.5%; cursor: pointer; color: var(--paper); background: radial-gradient(ellipse at 20% 85%, rgba(20, 12, 10, 0.3), rgba(20, 12, 10, 0) 45%); }
@media (max-width: 560px) { .overlay { place-items: center; padding: 0; background: radial-gradient(ellipse at center, rgba(20, 12, 10, 0) 30%, rgba(20, 12, 10, 0.4)); } .pill { font-size: 13px; gap: 10px; padding: 7px 16px 7px 7px; } .disc { width: 36px; height: 36px; } }

.overlay:focus-visible { outline: none; }

.disc { width: 44px; height: 44px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); display: grid; place-items: center; box-sizing: border-box; }
.disc svg { width: 17px; height: 17px; margin-left: 3px; fill: var(--red); }
.transport { display: flex; align-items: center; gap: 12px 14px; flex-wrap: wrap; }
.tbtn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); font: 700 12px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
.tbtn:hover { background: #fffaf0; }
.tbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.tbtn:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
.tbtn svg { width: 14px; height: 14px; fill: currentColor; }

  -webkit-mask: radial-gradient(circle at 0 50%, transparent 8px, #000 8.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 8px, #000 8.5px) right / 51% 100% no-repeat;
  mask: radial-gradient(circle at 0 50%, transparent 8px, #000 8.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 8px, #000 8.5px) right / 51% 100% no-repeat; }
.scene:hover { background: #fffaf0; }

.scene.on { background: var(--red); color: var(--paper); }
.scene.on .st { color: var(--paper); border-bottom-color: rgba(247, 241, 227, 0.45); }

body.render .wrap > *:not(.stage) { display: none !important; }
body.render .wrap { padding: 0; max-width: none; display: block; }
body.render .stage { width: 1920px; height: 1080px; box-shadow: none; border: 0; }
body.render .overlay { display: none !important; }
@media (prefers-reduced-motion: reduce) { .pill, .overlay:hover .pill, .overlay:focus-visible .pill { transition: none; transform: rotate(-2deg); } .tbtn:active { transform: none; } }

<script>
(() => {
'use strict';

// ───────────────────────── math ─────────────────────────
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const sstep = (a, b, x) => { const t = inv(a, b, x); return t * t * (3 - 2 * t); };
const eOut3 = t => 1 - (1 - t) ** 3;
const eIO3 = t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
const mulberry = a => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const sgn = n => (hash(n) * 2 - 1);
const ihash = (x, y) => { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const TAU = Math.PI * 2, DEG = Math.PI / 180;

// ───────────────────────── timeline ─────────────────────────
// Everything on the poster is stop-motion at 12 drawings a second (each held 5 frames at 60 fps).
// Only the camera moves continuously. Drawing boundaries sit halfway between 60 fps frames, so
// motion-blur sub-frames never straddle two drawings.
const DUR = 8.0, DFPS = 12;
const drawingOf = t => Math.floor((clamp(t, 0, DUR) + 1 / 120) * DFPS);
const D = {
  drop: [1, 2, 3, 4], tape: [5, 6, 7],
  sqR: [7, 8, 9, 10, 11], redDone: 12,          // red pass: squeegee left to right, done on the downbeat at 1.0 s
  sqK: [13, 14, 15], blackDone: 16,            // black pass: right to left
  slash: [20, 21, 22], hero: 24,
  letters: { G: 32, Z: 36, two: 40, H: 44 },   // one per beat (180 bpm, a beat is 4 drawings)
  hands: { horns: 48, thumb: 49, wave: 50, ok: 51 },
  pick: 52, press: 56, ticket: 64, pin: 72,
};
const SQ_R_X = [-30, 400, 830, 1260, 1690];
const SQ_K_X = [1420, 870, 320];
const SCENES = [
  { t: 0.00, end: 1.00, name: 'Paper & red ink', desc: 'The sheet drops, tape rips across a corner and the squeegee pulls a giant halftone 0.' },
  { t: 1.00, end: 2.50, name: 'Zero to hero', desc: 'The black pass prints ZERO. A red marker slashes it and a rubber stamp thumps HERO.' },
  { t: 2.50, end: 4.55, name: 'Cut & paste', desc: 'G, Z, 2 and H slap down one per beat, the hands flick on and a pick stamp hits the corner.' },
  { t: 4.55, end: 8.00, name: 'Lockup', desc: 'Letterpress wordmark, a ticket stub with the URL, a pin through it and a slow push in.' },
];
// boil clock: normal until the tape stop, then the drawings slow down and freeze with the music
function boilOf(d) { if (d < 84) return d; let k = 84; for (const e of [86, 89, 93]) if (d >= e) k = e; return k; }
// misregistration of each ink plate (0 red, 1 black): a fixed offset plus a per-drawing wobble, 2 to 6 px
function misreg(ink, d) {
  const b = boilOf(d), base = ink ? [-2.2, 2.6] : [3.3, -1.9];
  return [base[0] + 1.25 * sgn(b * 3.17 + ink * 17.3), base[1] + 1.25 * sgn(b * 5.71 + ink * 29.1 + 3)];
}
// per-drawing nudge for things placed by hand
const boil = (d, id, a = 1) => { const b = boilOf(d); return [a * 0.8 * sgn(b * 1.91 + id * 7.3), a * 0.8 * sgn(b * 2.37 + id * 3.1 + 9), a * 0.0022 * sgn(b * 1.13 + id * 5.9 + 4)]; };

// ───────────────────────── poster layout (poster units: 1720 × 968) ─────────────────────────
const W = 1920, H = 1080, PW = 1720, PH = 968, PS = 1.12;   // PS: raster px per poster unit (sharp at the final push-in)
const PRW = Math.ceil(PW * PS), PRH = Math.ceil(PH * PS);
const REST = { x: 960, y: 540, r: -0.6 * DEG, s: 1, lift: 0 };
const RING = { cx: 860, cy: 520, rxo: 318, ryo: 384, rxi: 192, ryi: 252 };
const WAVE = { gap: 70, fill: 0.4, v0: 0.44, fall: 0.76 };
const HEAD = { x: 88, base: 104 };
const ZERO = { x: 214, base: 322, cap: 150 };
const HERO = { cx: 1140, cy: 244, w: 500, h: 188, rot: -6 * DEG };
const LS = 0.338, LC = [1611, 662], LPOS = [862, 592];
const WMP = { cx: 858, base: 900, cap: 64 };
const TK = { cx: 1478, cy: 870, w: 460, h: 146, rot: 4.5 * DEG, perf: 352 };
const PICK = { cx: 1566, cy: 134, rot: 13 * DEG, s: 1 };
const REG = [[50, 500], [1670, 500]];
const RED = [212, 36, 46], BLACK = [38, 30, 28], PAPER = [241, 233, 214];
const CUT_RED = [186, 14, 30], CUT_BLACK = [33, 27, 25], CREAM = 'rgb(248,243,230)';
const LOGO_BB = { G: [58, 251, 778, 922], horns: [313, 65, 536, 271], Z: [821, 207, 1442, 913], thumb: [868, 104, 1080, 347], two: [1465, 208, 1992, 922], wave: [1527, 51, 1761, 282], H: [2042, 207, 3165, 1274], ok: [2427, 317, 2704, 611] };
const WRIST = { horns: [392, 262], thumb: [985, 336], wave: [1700, 270], ok: [2650, 600] };
const HAND_OF = { G: 'horns', Z: 'thumb', two: 'wave', H: 'ok' };
const LETTER_REST = { G: [-5, 4, -2.4], Z: [3, -3, 1.7], two: [-2, 5, -1.3], H: [3, -1, 1.2] };   // dx, dy, degrees: hand-placed, not quite straight
const L2P = (x, y) => [LPOS[0] + (x - LC[0]) * LS, LPOS[1] + (y - LC[1]) * LS];

// ───────────────────────── canvases ─────────────────────────
const out = document.getElementById('c');
const ctx = out.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
const g2 = (c, rf) => c.getContext('2d', rf ? { willReadFrequently: true } : undefined);
// canvases we read pixels from stay CPU-backed; finished bitmaps are copied to plain canvases for fast compositing
const fin = c => { const o = mk(c.width, c.height); o.getContext('2d').drawImage(c, 0, 0); return o; };
let Q = 1, CW = 1920, CH = 1080;
function setQuality(q) { Q = q; CW = Math.round(W * q); CH = Math.round(H * q); out.width = CW; out.height = CH; }

// ───────────────────────── fonts ─────────────────────────
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0)).buffer;
const FONT = (w, px, fam = 'Space Grotesk') => `${w} ${px}px "${fam}"`;
function spaced(g, str, x, y, ls) { for (const ch of str) { g.fillText(ch, x, y); x += g.measureText(ch).width + ls; } return x; }
function spacedW(g, str, ls) { let w = 0; for (const ch of str) w += g.measureText(ch).width + ls; return w - ls; }

// ───────────────────────── noise ─────────────────────────
const NT = 512;
function noiseTile(cells, seed) {
  const r = mulberry(seed), L = new Float32Array(cells * cells).map(() => r()), o = new Float32Array(NT * NT), k = cells / NT;
  for (let y = 0; y < NT; y++) {
    const fy = y * k, iy = Math.floor(fy), ty = fy - iy, sy = ty * ty * (3 - 2 * ty), y0 = (iy % cells) * cells, y1 = ((iy + 1) % cells) * cells;
    for (let x = 0; x < NT; x++) {
      const fx = x * k, ix = Math.floor(fx), tx = fx - ix, sx = tx * tx * (3 - 2 * tx), x0 = ix % cells, x1 = (ix + 1) % cells;
      const a = L[y0 + x0], b = L[y0 + x1], c = L[y1 + x0], d = L[y1 + x1];
      o[y * NT + x] = a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
    }
  }
  return o;
}
let NLO, NMID, NHI;
const nAt = (A, x, y) => A[((y | 0) & 511) * NT + ((x | 0) & 511)];

// ───────────────────────── textures built once ─────────────────────────
let paperC, backC, grainT = [], grainP = [], vignC, sheetSh = {}, pinSh = {}, PL = {}, SPR = {}, TAPE, SQ, BLOCK = {}, PLATEN;

function buildPaper() {
  const c = mk(PRW, PRH), g = g2(c, true), id = g.createImageData(c.width, c.height), P = id.data, w = c.width, h = c.height;
  for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i += 4) {
    const lo = nAt(NLO, x * 0.22 + 40, y * 0.22 + 90), mid = nAt(NMID, x, y), hi = nAt(NHI, x, y), hi2 = nAt(NHI, x + 2, y + 2);
    const v = 1 + 0.045 * (lo - 0.5) + 0.03 * (mid - 0.5) + 0.07 * (hi - hi2) + 0.03 * (ihash(x, y) - 0.5);
    const warm = 0.012 * (nAt(NLO, x * 0.1 + 300, y * 0.1) - 0.5);
    P[i] = PAPER[0] * (v + warm); P[i + 1] = PAPER[1] * v; P[i + 2] = PAPER[2] * (v - warm); P[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  // fibres: short curly hairs, a few darker, a few brighter, a handful of coloured flecks
  const r = mulberry(77);
  g.setTransform(PS, 0, 0, PS, 0, 0); g.lineCap = 'round';
  for (let k = 0; k < 2600; k++) {
    const x = r() * PW, y = r() * PH, a = r() * TAU, L = 4 + r() * 16, bend = (r() - 0.5) * 10, typ = r();
    g.strokeStyle = typ < 0.55 ? `rgba(120,96,64,${0.06 + r() * 0.12})` : typ < 0.97 ? `rgba(255,252,244,${0.18 + r() * 0.3})` : (r() < 0.5 ? 'rgba(170,40,50,0.35)' : 'rgba(60,80,140,0.3)');
    g.lineWidth = 0.4 + r() * 0.8;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * L / 2 - Math.sin(a) * bend, y + Math.sin(a) * L / 2 + Math.cos(a) * bend, x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke();
  }
  // trimmed edge
  g.strokeStyle = 'rgba(90,70,50,0.35)'; g.lineWidth = 1.6; g.strokeRect(0.8, 0.8, PW - 1.6, PH - 1.6);
  g.strokeStyle = 'rgba(255,252,244,0.5)'; g.lineWidth = 1; g.strokeRect(3, 3, PW - 6, PH - 6);
  paperC = fin(c);
}

function buildBackdrop() {
  // stained plywood bench seen from above: long grain, a few knots, old ink drips, staples and tape scraps
  const M = 32, w = Math.ceil((W + 2 * M) * 0.75), h = Math.ceil((H + 2 * M) * 0.75), sc = 0.75;
  const c = mk(w, h), g = g2(c, true), id = g.createImageData(w, h), P = id.data;
  for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i += 4) {
    const X = x / sc - M, Y = y / sc - M;
    const warp = 60 * (nAt(NLO, X * 0.08, Y * 0.08) - 0.5);
    const grain = nAt(NMID, X * 0.035 + 7, (Y + warp) * 1.6) * 0.6 + nAt(NHI, X * 0.06, (Y + warp) * 2.2) * 0.4;
    const ring = 0.5 + 0.5 * Math.sin((Y + warp * 2.2) * 0.11 + 6 * nAt(NLO, X * 0.03, Y * 0.2));
    const light = 1.18 - 0.55 * Math.hypot((X - 640) / 1500, (Y - 300) / 1100);
    const v = (0.78 + 0.32 * grain + 0.1 * ring + 0.05 * (ihash(x, y) - 0.5)) * light;
    P[i] = 50 * v; P[i + 1] = 36 * v; P[i + 2] = 29 * v; P[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  g.setTransform(sc, 0, 0, sc, M * sc, M * sc);
  const r = mulberry(4242);
  // old ink splats from earlier print runs
  for (let k = 0; k < 26; k++) {
    const edge = k % 4, along = r();
    const x = edge === 0 ? along * W : edge === 1 ? W - 20 - r() * 70 : edge === 2 ? along * W : 10 + r() * 80;
    const y = edge === 0 ? 8 + r() * 40 : edge === 1 ? along * H : edge === 2 ? H - 10 - r() * 40 : along * H;

  const gr = g.createRadialGradient(x - R * 0.35, y - R * 0.4, R * 0.1, x, y, R * 1.05);
  gr.addColorStop(0, '#8a7f78'); gr.addColorStop(0.25, '#3a302c'); gr.addColorStop(1, '#0f0b0a');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, R, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.ellipse(x - R * 0.38, y - R * 0.42, R * 0.22, R * 0.13, -0.7, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 1.2; g.beginPath(); g.arc(x, y, R, 0, TAU); g.stroke();
}

function render(t) {
  t = clamp(t, 0, DUR);
  const d = drawingOf(t), cam = camera(t);
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.filter = 'none';
  const camM = () => { g.setTransform(Q, 0, 0, Q, 0, 0); g.translate(960 + cam.sx, 540 + cam.sy); g.rotate(cam.r); g.scale(cam.z, cam.z); g.translate(-cam.fx, -cam.fy); };
  camM();
  g.imageSmoothingQuality = 'low';
  g.drawImage(backC, -backC.M, -backC.M, W + 2 * backC.M, H + 2 * backC.M);
  const pp = posePoster(d);
  if (pp) {
    // the sheet's shadow on the bench
    const sh = pp.lift > 0.2 ? sheetSh.soft : sheetSh.tight, off = lerp(5, 70, pp.lift);
    g.save(); g.translate(pp.x + off * 0.7, pp.y + off); g.rotate(pp.r); g.scale(pp.s * (1 + 0.03 * pp.lift), pp.s * (1 + 0.03 * pp.lift));
    g.globalAlpha = lerp(0.62, 0.36, pp.lift); g.drawImage(sh.c, -PW / 2 - sh.pad, -PH / 2 - sh.pad, PW + 2 * sh.pad, PH + 2 * sh.pad); g.restore();
    g.save(); g.translate(pp.x, pp.y); g.rotate(pp.r); g.scale(pp.s, pp.s); g.translate(-PW / 2, -PH / 2);
    g.imageSmoothingQuality = 'high'; g.drawImage(printLayer(d), 0, 0, PW, PH); g.imageSmoothingQuality = 'medium';
    drawLogo(g, d);
    if (d >= D.ticket - 2) { const ps = slapPose(d, D.ticket, 9, [0, 0, TK.rot / DEG]); drawSprite(g, SPR.ticket, TK.cx + ps.dx, TK.cy + ps.dy, ps.rot, ps.s, ps.lift); }
    drawPin(g, d);
    drawTape(g, d);
    drawSqueegee(g, d);
    drawBlock(g, d, D.hero, BLOCK.hero, HERO.cx, HERO.cy, HERO.rot, [150, -170]);
    drawBlock(g, d, D.pick, BLOCK.pick, PICK.cx, PICK.cy, PICK.rot, [120, -150]);
    drawPlaten(g, d);
    g.restore();
  }
  // light: warm key from the top left, falloff to the corners; stop-motion exposure flicker; grain
  g.setTransform(1, 0, 0, 1, 0, 0);
  // as the turntable winds down at the end, the bench light sags a little with it
  const sag = 0.085 * sstep(7.0, 7.8, t);
  if (sag > 0.001) { g.globalAlpha = sag; g.fillStyle = '#120a06'; g.fillRect(0, 0, CW, CH); g.globalAlpha = 1; }
  const bo = boilOf(d), fl = Math.min(4, Math.floor(hash(bo * 0.77 + 5) * 5));
  g.globalCompositeOperation = 'multiply'; g.imageSmoothingQuality = 'low'; g.drawImage(vignC[d < 1 ? 2 : fl], 0, 0, CW, CH);
  if (!grainP.length) grainP = grainT.map(c => g.createPattern(c, 'repeat'));
  const pat = grainP[bo % 4]; pat.setTransform(new DOMMatrix([Q, 0, 0, Q, -Math.floor(hash(bo) * 256) * Q, -Math.floor(hash(bo + 0.5) * 256) * Q]));
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.07; g.fillStyle = pat; g.fillRect(0, 0, CW, CH);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
}

// ───────────────────────── audio ─────────────────────────
// The score: a garage-rock riff on gzMix's double-tracked rigs plus a bit-crushed, band-passed parallel bus,
// over a vinyl crackle bed. Foley for every physical action. The last chord dies in a turntable/tape stop.
function buildAudio(ac, t0, from = 0) {
  const M = gzMix(ac, t0, from, { dur: DUR, fadeAt: 7.8, drive: 18, seed: 7 });
  const { at, live, bq, G, chain, src, panTo, F, osc, send, NB } = M;
  const after = x => Math.max(x, from);
  // master → tape-stop low-pass → glue compressor → out
  const tapeLP = bq('lowpass', 19000, 0.6), comp = ac.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.18;
  M.master.disconnect(); M.master.connect(tapeLP); tapeLP.connect(comp); comp.connect(ac.destination);
  const STOP = 6.95, STOP_END = 7.75;
  if (from < STOP_END) { const st = after(STOP), f0 = 19000 * Math.pow(700 / 19000, inv(STOP, STOP_END, st)); tapeLP.frequency.setValueAtTime(f0, at(st)); tapeLP.frequency.exponentialRampToValueAtTime(700, at(STOP_END)); }

  // lo-fi bus: bit-crushed and band-passed like a transistor radio
  const crush = bits => { const n = 2048, c = new Float32Array(n), q = 2 ** (bits - 1); for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.round(x * q) / q; } const ws = ac.createWaveShaper(); ws.curve = c; ws.oversample = 'none'; return ws; };
  const lofiBus = (lvl) => { const i = G(1), o = chain(i, bq('highpass', 420), gzShaper(ac, 6, 0.06), crush(4), bq('bandpass', 1500, 0.75), bq('peaking', 2800, 2, 5), bq('lowpass', 4200), G(lvl)); o.connect(M.master); send(o, 0.1); return i; };
  const lofi = lofiBus(0.42), radio = lofiBus(0.2);
  // the rigs also feed the lo-fi bus in parallel once the band comes in
  const par = G(0); M.L.connect(par); M.R.connect(par); par.connect(lofi);
  par.gain.setValueAtTime(from >= 1.0 ? 0.85 : 0, at(from)); if (from < 1.0) par.gain.setValueAtTime(0.85, at(1.0));

  // vinyl crackle bed (hiss, ticks, pops), started at the playhead; it slows down with the turntable at the end
  const sr = ac.sampleRate;
  const crackle = ac.createBuffer(2, Math.floor(sr * 8.6), sr);
  for (let c = 0; c < 2; c++) {
    const d = crackle.getChannelData(c), r = mulberry(606 + c), n = d.length; let lp = 0;
    for (let i = 0; i < n; i++) { lp += 0.08 * ((r() * 2 - 1) - lp); d[i] = lp * 0.18 + (r() < 0.0012 ? (r() * 2 - 1) * (0.15 + 0.6 * r() * r()) : 0); }
    for (let k = 0; k < 34; k++) { const i0 = Math.floor(r() * (n - 600)), A = 0.25 + r() * 0.55, s = r() < 0.5 ? -1 : 1; for (let j = 0; j < 500; j++) d[i0 + j] += s * A * Math.exp(-j / 40) * Math.sin(j * 0.9) ; }
  }
  const crk = ac.createBufferSource(); crk.buffer = crackle;
  const crkG = G(0.42); crk.connect(bq('highpass', 260)).connect(bq('lowpass', 7500)).connect(crkG); crkG.connect(M.master);
  crk.start(at(from), from); crk.stop(at(DUR + 0.1));
  const fin = [crk];

  // helpers
  let seed = 900;
  const CH = { E5: ['E2', 'B2', 'E3'], e: ['E2', 'B2'], G5: ['G2', 'D3', 'G3'], A5: ['A2', 'E3', 'A3'], B5: ['B2', 185.0, 'B3'], D5: ['D3', 'A3', 'D4'] };
  const chord = (time, name, o = {}) => CH[name].forEach((n, i) => {
    const f = typeof n === 'number' ? n : F[n], mute = name === 'e' || o.mute;
    const ko = { t60: mute ? 0.22 : (o.t60 ?? 1.4), bright: mute ? 0.32 : 0.74, pick: 0.12, damp: mute ? 0.62 : 0.5 };
    const len = Math.min(ko.t60 * 1.1, 4.5), g = (o.gain ?? 0.55) * (mute ? 1.5 : 1), dt = (o.up ? -1 : 1) * i * 0.007;
    const a = src(gzKS(ac, f, len, { ...ko, seed: seed++ }), time + dt, o.L || M.L, g, 1, o.stop);
    const b = src(gzKS(ac, f, len, { ...ko, seed: seed++ }), time + dt + 0.011, o.R || M.R, g, 1.0023, o.stop);
    if (o.keep) { if (a) fin.push(a.s); if (b) fin.push(b.s); }
  });
  const nz = (time, dur, gain, filters, o = {}) => {
    if (!live(time)) return null;
    const s = ac.createBufferSource(); s.buffer = NB; s.playbackRate.value = o.rate || 1;
    const a = G(0); let node = s; for (const f of filters) { node.connect(f); node = f; } node.connect(a); a.connect(o.dest || M.master);
    const att = o.att ?? 0.002;
    a.gain.setValueAtTime(0.0001, at(time)); a.gain.exponentialRampToValueAtTime(gain, at(time + att));
    if (o.hold) a.gain.setValueAtTime(gain, at(time + att + o.hold));
    a.gain.exponentialRampToValueAtTime(0.0001, at(time + dur));
    s.start(at(time), hash(time * 7.31 + gain) * 2); s.stop(at(time + dur + 0.05));
    return a;
  };
  // filtered noise drawn across a surface: band sweeps f1 → f2, with stick-slip judder
  const scrape = (t1, t2, f1, f2, g, q = 2, judder = 38, pan = 0) => {
    if (!live(t2)) return;
    const st = after(t1), s = ac.createBufferSource(); s.buffer = NB;
    const bp = bq('bandpass', f1, q), env = G(0), am = G(0.6), lfo = ac.createOscillator(), lg = G(0.4);
    lfo.type = 'triangle'; lfo.frequency.value = judder; lfo.connect(lg).connect(am.gain);
    s.connect(bp).connect(bq('peaking', 3400, 2.5, 5)).connect(env).connect(am).connect(panTo(pan, M.master));
    const u = inv(t1, t2, st);
    bp.frequency.setValueAtTime(lerp(f1, f2, u), at(st)); bp.frequency.linearRampToValueAtTime(f2, at(t2));
    env.gain.setValueAtTime(0.0001, at(st)); env.gain.linearRampToValueAtTime(g, at(Math.min(t2, st + 0.035)));
    env.gain.setValueAtTime(g, at(Math.max(st + 0.035, t2 - 0.05))); env.gain.linearRampToValueAtTime(0.0001, at(t2 + 0.02));
    s.start(at(st), hash(t1) * 2); lfo.start(at(st)); s.stop(at(t2 + 0.05)); lfo.stop(at(t2 + 0.05));
  };
  const slap = (time, g = 1, pan = 0) => {   // paper slapped flat: short low thud, papery crack, a breath of air before
    osc('sine', 150, 62, time, 0.13, 0.3 * g, M.master, 0.002);
    nz(time, 0.075, 0.55 * g, [bq('bandpass', 1500, 0.6)], { att: 0.001, dest: panTo(pan, M.master) });
    nz(time, 0.03, 0.28 * g, [bq('highpass', 4200)], { att: 0.0005, dest: panTo(pan, M.master) });
    nz(time - 0.08, 0.085, 0.07 * g, [bq('highpass', 2500)], { att: 0.06 });
  };
  const thump = (time, g = 1) => {   // rubber stamp: dead, woody, a little squelch of ink
    osc('sine', 120, 52, time, 0.18, 0.24 * g, M.master, 0.002);
    nz(time, 0.06, 0.34 * g, [bq('bandpass', 560, 1.5)], { att: 0.001 });
    nz(time, 0.04, 0.22 * g, [bq('bandpass', 2400, 1)], { att: 0.0007 });
    nz(time + 0.012, 0.09, 0.08 * g, [bq('bandpass', 900, 3)], { att: 0.02 });
  };
  const splat = (time, n = 7) => { for (let i = 0; i < n; i++) nz(time + 0.02 + hash(i + time) * 0.16, 0.012, 0.12 * (1 - i / n), [bq('highpass', 3500)], { att: 0.0005, dest: panTo(sgn(i * 3.3 + time) * 0.7, M.master) }); };
  const press = time => {   // platen press: latch click, heavy impression, a ring of iron
    nz(time - 0.085, 0.025, 0.22, [bq('bandpass', 2300, 2.5)], { att: 0.0006 });
    osc('sine', 96, 44, time, 0.28, 0.3, M.master, 0.002);
    nz(time, 0.1, 0.42, [bq('lowpass', 1400)], { att: 0.001 });
    [612, 1388, 2243, 3171].forEach((f, i) => osc('sine', f, f * 0.996, time + 0.003, 0.38 - i * 0.06, 0.045, panTo((i - 1.5) * 0.35, M.master), 0.001));
  };
  const pin = time => { osc('sine', 340, 130, time, 0.06, 0.16, M.master, 0.001); nz(time, 0.018, 0.32, [bq('highpass', 3000)], { att: 0.0004 }); nz(time + 0.004, 0.05, 0.14, [bq('bandpass', 1100, 1.2)], { att: 0.001 }); };
  const flick = (time, pan) => nz(time, 0.03, 0.16, [bq('bandpass', 4200, 1.4)], { att: 0.0008, dest: panTo(pan, M.master) });
  const keepClean = (time, f, g, pan, t60) => { const r = M.cleanNote(time, f, g, pan, t60); if (r) fin.push(r.s); };

  // ── 0.0–1.0  needle drop, the sheet lands, tape rips, the red squeegee pass; the riff plays on a little radio
  if (live(0)) { osc('sine', 70, 40, 0.0, 0.18, 0.22, M.master, 0.002); nz(0.0, 0.02, 0.3, [bq('highpass', 1800)], { att: 0.0004 }); }
  M.whoosh(0.07, 0.2, 0.12, 1700, 380);
  slap(0.25, 1.15);
  scrape(0.4, 0.5, 2300, 3100, 0.2, 0.9, 92, -0.4);          // tape unrolling: a fast raspy crackle
  nz(0.5, 0.035, 0.42, [bq('highpass', 1600)], { att: 0.0006, dest: panTo(-0.5, M.master) });   // the tear
  nz(0.583, 0.06, 0.14, [bq('lowpass', 900)], { att: 0.002 });
  scrape(0.585, 1.0, 820, 1350, 0.3, 2.2, 36, -0.2);        // squeegee, left to right
  [[0.167, 'E5'], [0.333, 'e'], [0.5, 'e'], [0.667, 'G5'], [0.833, 'A5']].forEach(([t, c]) => chord(t, c, { L: radio, R: radio, gain: 0.7, t60: 0.9, stop: t + 0.16 }));
  M.swell(0.55, 1.0, 0.22, 900, 6500, 0.8);

  // ── 1.0–2.5  the band drops in with the black pass; ZERO gets slashed, HERO stamped
  chord(1.0, 'E5', { t60: 1.8, stop: 1.32 }); M.kick(1.0, 0.75); M.boom(1.0, 0.4); M.crash(1.0, 0.72, 2.2);
  scrape(1.083, 1.33, 1400, 950, 0.24, 2.2, 40, 0.25);       // squeegee back, right to left
  chord(1.333, 'e'); chord(1.5, 'e'); M.snare(1.333, 0.55);
  chord(1.667, 'G5', { t60: 1.2, stop: 1.98 }); M.kick(1.667, 0.6);
  scrape(1.667, 1.86, 2600, 4300, 0.16, 3, 52, -0.3);         // marker squeak
  chord(2.0, 'A5', { t60: 1.4, stop: 2.3 }); M.snare(2.0, 0.6); thump(2.0, 1.1);
  chord(2.167, 'e');
  for (let i = 0; i < 8; i++) M.hat(1.0 + i / 6, i % 2 ? 0.18 : 0.3);
  // fill: snare roll and a pick scrape down the strings
  [2.333, 2.417, 2.5, 2.583].forEach((t, i) => M.snare(t, 0.32 + 0.1 * i));
  if (live(2.333)) {
    const s = ac.createBufferSource(); s.buffer = NB; const bp = bq('bandpass', 3000, 6), e = G(0);
    s.connect(bp).connect(e); e.connect(M.L); e.connect(M.R);
    bp.frequency.setValueAtTime(3200, at(2.333)); bp.frequency.exponentialRampToValueAtTime(380, at(2.64));
    e.gain.setValueAtTime(0.0001, at(2.333)); e.gain.exponentialRampToValueAtTime(0.5, at(2.36)); e.gain.setValueAtTime(0.5, at(2.6)); e.gain.exponentialRampToValueAtTime(0.0001, at(2.66));
    s.start(at(2.333), 0.4); s.stop(at(2.7));
  }

  // ── 2.5–4.6  stop-time stabs, one per cut-out letter; the hands flick on; the pick stamp
  [[2.667, 'E5'], [3.0, 'G5'], [3.333, 'A5'], [3.667, 'B5']].forEach(([t, c], i) => {
    chord(t, c, { t60: 1.3, stop: t + 0.24, gain: 0.6 }); M.kick(t, 0.62); M.crash(t, 0.32, 0.45); slap(t, 0.9, -0.3 + i * 0.2);
    if (i % 2) M.snare(t, 0.45);
  });
  [[4.0, 'E5'], [4.083, 'G5'], [4.167, 'A5'], [4.25, 'B5']].forEach(([t, n], i) => { M.cleanNote(t, F[n], 1.0, -0.45 + i * 0.3, 1.6, 0.85); flick(t, -0.45 + i * 0.3); });
  thump(4.333, 0.95); splat(4.333, 8); chord(4.333, 'E5', { t60: 0.6, stop: 4.47, gain: 0.6 }); M.kick(4.333, 0.4);
  M.snare(4.49, 0.3); M.snare(4.5, 0.55); M.swell(4.25, 4.667, 0.26, 700, 7000, 1.1);

  // ── 4.6–8.0  letterpress impression on the big E; the riff once more; ticket; pin; final chord; turntable stop
  press(4.667); chord(4.667, 'E5', { t60: 1.8, stop: 4.98, gain: 0.62 }); M.kick(4.667, 0.7); M.boom(4.667, 0.4); M.crash(4.667, 0.85, 2.6);
  chord(5.0, 'e'); chord(5.167, 'e'); M.snare(5.0, 0.55);
  chord(5.333, 'G5', { t60: 1.2, stop: 5.64 }); M.kick(5.333, 0.6); slap(5.333, 0.85, 0.4);
  chord(5.667, 'A5', { t60: 1.0, stop: 5.82 }); M.snare(5.667, 0.55);
  chord(5.833, 'B5', { t60: 1.0, stop: 5.99, gain: 0.5 }); M.snare(5.833, 0.35); M.kick(5.833, 0.45);
  for (let i = 0; i < 8; i++) M.hat(4.667 + i / 6, i % 2 ? 0.16 : 0.28);
  chord(6.0, 'E5', { t60: 7, gain: 0.62, keep: true }); M.kick(6.0, 0.75); M.boom(6.0, 0.55); M.crash(6.0, 0.9, 3.0); pin(6.0);
  [['E4', 0.0], ['B4', 0.05], ['E5', 0.1]].forEach(([n, dt], i) => keepClean(6.0 + dt, F[n], 0.42, 0.4 - i * 0.4, 3.6));
  // turntable stop: everything still ringing slows to a stop
  if (from < STOP_END) for (const s of fin) { const st = after(STOP), r0 = s.playbackRate.value; s.playbackRate.setValueAtTime(r0 * Math.pow(0.05, inv(STOP, STOP_END, st)), at(st)); s.playbackRate.exponentialRampToValueAtTime(r0 * 0.05, at(STOP_END)); }
  if (live(7.86)) nz(7.86, 0.03, 0.12, [bq('bandpass', 1800, 1)], { att: 0.0005 });   // needle lifts
}

  capture(t, n = 1) {
    if (!this.acc) { this.acc = mk(CW, CH); this.ax = this.acc.getContext('2d'); }
    for (let i = 0; i < n; i++) { render(t + (n > 1 ? ((i + 0.5) / n - 0.5) / 120 : 0)); this.ax.globalAlpha = 1 / (i + 1); this.ax.drawImage(out, 0, 0); }
    return this.acc.toDataURL('image/png').split(',')[1];
  },
  async audio() { const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr); buildAudio(oc, 0, 0); const b = await oc.startRendering(); return gzWavB64(b); },
};

let now = POSTER, playing = false, soundOn = true, ac = null, t0 = 0, perf0 = 0, raf = 0, slow = 0;
function fitQuality() {
  const want = clamp(stage.clientWidth * Math.min(2, window.devicePixelRatio || 1) / W, 0.4, 1);
  const q = Math.round(want * 20) / 20;
  if (Math.abs(q - Q) > 0.049) setQuality(q);
}
function show(t) {
  now = t; if (built) render(t);
  scrub.value = t.toFixed(3); scrub.style.setProperty('--p', (t / DUR * 100) + '%');
  tcNow.textContent = t.toFixed(2);
  SCENES.forEach((sc, i) => {
    const el = scenesEl.children[i], on = t >= sc.t && t < sc.end;
    el.classList.toggle('on', on);
    el.querySelector('.fill').style.width = (clamp((t - sc.t) / (sc.end - sc.t)) * 100) + '%';
  });
}
// Sound comes from a pre-rendered soundtrack file played through an <audio> element, which the
// iPhone silent switch does not mute (Web Audio is muted by it). Live synthesis is the fallback.
const snd = new Audio(); snd.preload = 'auto'; snd.src = SOUND_FILE;
let fileOK = true, mode = 'none', synthFrom = 0;
snd.addEventListener('error', () => { fileOK = false; });
snd.addEventListener('playing', () => { if (mode === 'file' && ac) { ac.close().catch(() => {}); ac = null; } });
function stopAudio() { mode = 'none'; try { snd.pause(); } catch (err) {} if (ac) { ac.close().catch(() => {}); ac = null; } }
function noSound() { mode = 'none'; soundLabel.textContent = 'No sound'; }
function startSynth() {
  if (!ac) return noSound();
  try {
    synthFrom = clamp((performance.now() - perf0) / 1000, 0, DUR);
    if (ac.resume) ac.resume();
    t0 = ac.currentTime + 0.15; buildAudio(ac, t0, synthFrom); mode = 'synth';
  } catch (err) { noSound(); }
}
function setPlayingUI(p) {
  playing = p;
  playLabel.textContent = p ? 'Pause' : (now >= DUR - 0.01 ? 'Replay' : 'Play');
  playIcon.firstElementChild.setAttribute('d', p ? ICON_PAUSE : ICON_PLAY);
  big.hidden = p;
}
function play(from = 0) {
  if (from >= DUR - 0.05) from = 0;
  stopAudio(); cancelAnimationFrame(raf);
  perf0 = performance.now() - from * 1000;
  const startedAt = performance.now();
  if (soundOn) {
    soundLabel.textContent = 'Sound on';
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (err) {}
    // unlock a context inside this tap, in case the file can't play and we fall back to synthesis
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.resume) ac.resume(); } catch (err) { ac = null; }
    if (fileOK) {
      mode = 'file';
      try { snd.currentTime = from; } catch (err) {}
      const p = snd.play();
      if (p && p.catch) p.catch(() => { if (mode === 'file') startSynth(); });
    } else startSynth();
  }
  slow = 0;
  setPlayingUI(true);
  const tick = () => {
    let t;
    if (mode === 'file') {
      if (snd.ended) t = DUR;
      else if (!snd.paused && snd.readyState >= 3) { t = snd.currentTime; perf0 = performance.now() - t * 1000; }
      else if (performance.now() - startedAt < 1500) { t = from; perf0 = performance.now() - from * 1000; }
      else { startSynth(); t = (performance.now() - perf0) / 1000; }
    } else if (mode === 'synth' && ac) t = ac.currentTime - t0 + synthFrom - (ac.outputLatency || 0);
    else t = (performance.now() - perf0) / 1000;
    const f0 = performance.now();
    show(clamp(t, 0, DUR));
    if (performance.now() - f0 > 26 && ++slow > 20 && Q > 0.5) { setQuality(Math.max(0.5, Q - 0.2)); slow = 0; }
    if (t >= DUR) { setPlayingUI(false); show(POSTER); now = DUR; playLabel.textContent = 'Replay'; bigLabel.textContent = 'Replay with sound'; big.hidden = false; stopAudio(); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
GZ.player = { snd, get mode() { return mode; } };
function pause() { cancelAnimationFrame(raf); stopAudio(); setPlayingUI(false); }

big.addEventListener('click', () => play(now >= DUR - 0.01 || now === POSTER ? 0 : now));
playBtn.addEventListener('click', () => (playing ? pause() : play(now >= DUR - 0.01 ? 0 : now)));
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.setAttribute('aria-pressed', String(soundOn)); soundLabel.textContent = soundOn ? 'Sound on' : 'Sound off';
  bigLabel.textContent = soundOn ? 'Play with sound' : 'Play';
  if (playing) play(now);
});
scrub.addEventListener('input', () => { if (playing) pause(); show(+scrub.value); });
window.addEventListener('resize', () => { fitQuality(); if (!playing) show(now); });

ready.then(() => { fitQuality(); show(now); });

})();
</script>
