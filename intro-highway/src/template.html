<title>GZ2H Note Highway</title>
<style>
/* Layout: the game screen is the page's one object; transport and four "level" cards sit under it like a console HUD */
:root {
  --bg: #090205;
  --panel: #150609;
  --panel-2: #1e080d;
  --line: #3b131b;
  --line-hi: #6a2230;
  --red: #e0182e;
  --amber: #ffb04a;
  --cream: #fff1e2;
  --text: #f7e9e2;
  --muted: #b49c99;
  --ramp: linear-gradient(90deg, #d4142c 0%, #ec3a24 22%, #f6682a 42%, #fb9a3c 62%, #fdc77a 82%, #fff0d8 100%);
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--text); }
body { margin: 0; font-family: var(--display); background: radial-gradient(120% 70% at 50% -12%, #3d0713 0%, rgba(61, 7, 19, 0) 62%), var(--bg); min-height: 100vh; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 26px 56px; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 700; letter-spacing: -0.015em; }
.tag { font: 700 11px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: #1a0306; background: var(--amber); padding: 5px 9px 4px; border-radius: 3px; transform: skewX(-10deg); }
.meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 1px #2a0c12, 0 0 0 4px #110306, 0 0 0 5px #3a1018, 0 40px 90px -40px rgba(255, 70, 40, 0.4); }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage::after { content: ""; position: absolute; inset: 8px; pointer-events: none; background:
  linear-gradient(var(--amber), var(--amber)) top left / 18px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) top left / 2px 18px no-repeat,
  linear-gradient(var(--amber), var(--amber)) top right / 18px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) top right / 2px 18px no-repeat,
  linear-gradient(var(--amber), var(--amber)) bottom left / 18px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) bottom left / 2px 18px no-repeat,
  linear-gradient(var(--amber), var(--amber)) bottom right / 18px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) bottom right / 2px 18px no-repeat; opacity: 0.55; }
.overlay { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; border: 0; padding: 0; cursor: pointer; color: var(--text); background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.6)); }
.overlay[hidden] { display: none !important; }
.pill { display: inline-flex; align-items: center; gap: 14px; padding: 10px 22px 10px 12px; border-radius: 10px; background: rgba(12, 3, 6, 0.86); border: 1px solid rgba(255, 176, 74, 0.45); border-bottom-width: 3px; font: 700 14px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; transition: transform 0.18s ease, border-color 0.18s ease; }
.overlay:hover .pill, .overlay:focus-visible .pill { transform: translateY(-2px) scale(1.03); border-color: var(--amber); }
.overlay:focus-visible { outline: none; }
.overlay:focus-visible .pill { outline: 2px solid var(--amber); outline-offset: 4px; }
.pick { width: 50px; height: 56px; display: grid; place-items: center; filter: drop-shadow(0 0 14px rgba(255, 120, 50, 0.6)); }
.pick svg { width: 100%; height: 100%; }
.transport { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.tbtn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line); border-bottom: 3px solid #0a0204; background: var(--panel-2); color: var(--text); font: 700 12px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
.tbtn:hover { border-color: var(--line-hi); border-bottom-color: #0a0204; }
.tbtn:active { transform: translateY(1px); }
.tbtn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.tbtn svg { width: 14px; height: 14px; fill: currentColor; }
.tbtn[aria-pressed="false"] { color: var(--muted); }
.track { position: relative; flex: 1 1 240px; min-width: 0; height: 38px; display: flex; align-items: center; }
.ticks { position: absolute; inset: 0; pointer-events: none; }
.ticks i { position: absolute; top: 5px; width: 2px; height: 8px; background: var(--amber); opacity: 0.7; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 38px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, transparent var(--p, 0%), #2a0d13 var(--p, 0%)), var(--ramp); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: #2a0d13; }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--ramp); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 4px; transform: rotate(45deg); background: var(--cream); border: 0; box-shadow: 0 0 12px rgba(255, 176, 74, 0.9); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 3px; background: var(--cream); border: 0; }
input[type="range"]:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.tc { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding: 6px 10px; background: #0b0305; border: 1px solid var(--line); border-radius: 6px; }
.tc b { color: var(--amber); font-weight: 700; }
.scenes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 440px) { .scenes { grid-template-columns: minmax(0, 1fr); } }
.scene { position: relative; display: grid; gap: 6px; align-content: start; text-align: left; padding: 14px 14px 18px; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(180deg, var(--panel-2), var(--panel)); color: var(--text); font: inherit; cursor: pointer; overflow: hidden; min-width: 0; }
.scene::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--c, var(--red)); opacity: 0.85; }
.scene:hover { border-color: var(--line-hi); }
.scene:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.scene .st { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
.scene .st em { font-style: normal; font-weight: 700; color: #1a0306; background: var(--c, var(--red)); padding: 1px 6px; border-radius: 3px; }
.scene .sn { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.scene .sd { font-size: 13.5px; line-height: 1.45; color: var(--muted); }
.scene .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--ramp); box-shadow: 0 0 10px rgba(255, 140, 60, 0.7); }
.scene.on { border-color: rgba(255, 176, 74, 0.6); box-shadow: 0 0 0 1px rgba(255, 176, 74, 0.25), 0 12px 30px -18px rgba(255, 120, 40, 0.6); }
.scene.on .st { color: var(--amber); }
body.render { margin: 0; overflow: hidden; background: #000; }
body.render .wrap > *:not(.stage) { display: none !important; }
body.render .wrap { padding: 0; max-width: none; display: block; }
body.render .stage { width: 1920px; height: 1080px; box-shadow: none; border-radius: 0; }
body.render .stage::after, body.render .overlay { display: none !important; }
@media (prefers-reduced-motion: reduce) { .pill, .overlay:hover .pill, .tbtn:active { transition: none; transform: none; } }
</style>

<script>
(() => {
'use strict';

// ───────────────────────── math ─────────────────────────
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const sstep = (a, b, x) => { const t = inv(a, b, x); return t * t * (3 - 2 * t); };
const eOut2 = t => 1 - (1 - t) * (1 - t);
const eOut3 = t => 1 - (1 - t) ** 3;
const eIn2 = t => t * t;
const eIn3 = t => t * t * t;
const eIO3 = t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
const eOutBack = (t, s = 1.7) => 1 + (s + 1) * (t - 1) ** 3 + s * (t - 1) ** 2;
const expLerp = (a, b, t) => Math.exp(lerp(Math.log(a), Math.log(b), t));
const spring = (tau, f = 2.4, z = 0.34) => { if (tau <= 0) return 0; const w = 2 * Math.PI * f; return 1 - Math.exp(-z * w * tau) * Math.cos(w * Math.sqrt(1 - z * z) * tau); };
const mulberry = a => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const vnoise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
const env = (t, t0, d) => (t >= t0 ? Math.exp(-(t - t0) / d) : 0);
const TAU = Math.PI * 2;
const mod = (a, n) => ((a % n) + n) % n;
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${clamp(a)})`;
const mixc = (c, d, k) => [Math.round(lerp(c[0], d[0], k)), Math.round(lerp(c[1], d[1], k)), Math.round(lerp(c[2], d[2], k))];

// ───────────────────────── timeline (seconds) ─────────────────────────
// 150 BPM, straight eighths on a 0.2 s grid. The count-in, the chart, the drums and every hit share it.
const DUR = 8.4, E8 = 0.2;
const T = {
  count: [0.2, 0.4, 0.6, 0.8], riff: 1.0, x2: 1.8, x4: 2.6, hero: 3.4, last: 4.2,
  fold0: 4.2, fold1: 4.6, slam: 4.6, hands: [4.8, 5.0, 5.2, 5.4], sweep: 5.46,
  burst: [5.8, 5.9, 6.0, 6.1], lock: 6.2, url: 6.36, shine: 6.95, fade0: 7.95,
};
const SCENES = [
  { t: 0.00, end: 1.00, name: 'Count-in', desc: 'The highway powers up, the sticks click 1 2 3 4 and the meter sits at ZERO.' },
  { t: 1.00, end: 4.20, name: 'Zero to hero', desc: 'Twenty notes land on the beat. The combo climbs, ×2, ×4, and at HERO the lane catches fire.' },
  { t: 4.20, end: 5.80, name: 'Neck to logo', desc: 'The last chord folds six lanes into the neck of the H. GZ2H slams in and the hands pop on.' },
  { t: 5.80, end: 8.40, name: 'Lockup', desc: 'Each letter bursts like a hit note and lands in the wordmark, with the URL under the stage lights.' },
];

// ───────────────────────── the chart: ONE note list drives gems, score, meter and the riff ─────────────────────────
// [time, "string:fret ...", accent, kind]. Strings 6 (low E) → 1 (high E). Lanes run low E (left, red) → high E (right, cream).
const OPEN = [0, 329.63, 246.94, 196.0, 146.83, 110.0, 82.41];
const CHART = [
  [1.0, '6:0 5:2', 2], [1.2, '6:0', 0, 'mute'], [1.4, '6:3', 1], [1.6, '6:0', 0, 'mute'],
  [1.8, '5:0 4:2', 2], [2.0, '6:0', 0, 'mute'], [2.2, '5:2', 1], [2.4, '5:0', 1],
  [2.6, '6:0 5:2', 2], [2.8, '4:2', 1], [3.0, '3:0', 1], [3.2, '3:2', 1],
  [3.4, '3:4', 2], [3.5, '2:3', 1], [3.6, '1:0', 1], [3.7, '2:8', 1], [3.8, '1:5', 1], [3.9, '2:12', 1], [4.0, '1:12', 1],
  [4.2, '6:0 5:2 4:2 3:4 2:5 1:0', 3, 'final'],
];
const multAt = combo => (combo >= 9 ? 4 : combo >= 5 ? 2 : 1);
const HERO_AT = 13;   // combo that fills the meter (lands on T.hero)
let runScore = 0;
const NOTES = CHART.map(([t, g, acc, kind], i) => {
  const gems = g.split(' ').map(s => { const [st, fr] = s.split(':').map(Number); return { s: st, fret: fr, li: 6 - st, hz: OPEN[st] * Math.pow(2, fr / 12) }; });
  const combo = i + 1, mult = multAt(combo), pts = gems.length * 50 * mult;
  runScore += pts;
  return { t, gems, acc, kind: kind || (gems.length > 1 ? 'chord' : 'note'), combo, mult, pts, score: runScore, final: kind === 'final' };
});

// ───────────────────────── look ─────────────────────────
const W = 1920, H = 1080;
const LC = [[222, 22, 46], [240, 62, 38], [248, 108, 44], [252, 158, 62], [254, 204, 128], [255, 241, 220]];   // lane colours low E → high E
const LNAME = ['E', 'A', 'D', 'G', 'B', 'E'];
const LGLOW = [[255, 24, 48], [255, 60, 36], [255, 100, 36], [255, 140, 50], [255, 170, 80], [255, 196, 120]];
const CREAM = [255, 241, 226], AMBER = [255, 176, 74], HOT = [255, 246, 236];
const BRAND = '#b80016';

// ───────────────────────── canvases ─────────────────────────
const canvas = document.getElementById('c');
const m = canvas.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
let Q = 1, CW = 1920, CH = 1080;
let eC, e, b1C, b1, b2C, b2;
function setQuality(q) {
  Q = q; CW = Math.round(W * q); CH = Math.round(H * q);
  canvas.width = CW; canvas.height = CH;
  eC = mk(CW, CH); e = eC.getContext('2d');
  b1C = mk(Math.ceil(CW / 4), Math.ceil(CH / 4)); b1 = b1C.getContext('2d');
  b2C = mk(Math.ceil(CW / 8), Math.ceil(CH / 8)); b2 = b2C.getContext('2d');
  GRAD = {};
}
let GRAD = {};
const P = {};
for (const k in LOGO) P[k] = new Path2D(LOGO[k]);
const WG = WORDMARK.glyphs.map(g => ({ ...g, p: new Path2D(g.d), cx: (g.x1 + g.x2) / 2, cy: (g.y1 + g.y2) / 2 }));
const PICK = new Path2D('M0 0.6C0.13 0.5 0.5 0.08 0.5 -0.2C0.5 -0.46 0.26 -0.54 0 -0.54C-0.26 -0.54 -0.5 -0.46 -0.5 -0.2C-0.5 0.08 -0.13 0.5 0 0.6Z');
// soft round sprite (white core), tinted copies per colour
function sprite(col, size = 64) {
  const c = mk(size, size), x = c.getContext('2d'), g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, rgba(mixc(col, [255, 255, 255], 0.75), 1)); g.addColorStop(0.2, rgba(col, 0.75)); g.addColorStop(0.55, rgba(col, 0.18)); g.addColorStop(1, rgba(col, 0));
  x.fillStyle = g; x.fillRect(0, 0, size, size); return c;
}
const SPR = LGLOW.map(c => sprite(c));
const SPR_HOT = sprite([255, 170, 90]), SPR_RED = sprite([255, 40, 50]), SPR_CREAM = sprite(CREAM);
// bokeh disc
const BOKEH = (() => { const c = mk(96, 96), x = c.getContext('2d'), g = x.createRadialGradient(48, 48, 0, 48, 48, 46); g.addColorStop(0, 'rgba(255,255,255,0.5)'); g.addColorStop(0.8, 'rgba(255,255,255,0.62)'); g.addColorStop(0.93, 'rgba(255,255,255,0.9)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.beginPath(); x.arc(48, 48, 47, 0, TAU); x.fill(); return c; })();
const tint = (img, col) => { const c = mk(img.width, img.height), x = c.getContext('2d'); x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = rgba(col, 1); x.fillRect(0, 0, c.width, c.height); return c; };
const BOKEH_C = [[255, 60, 70], [255, 150, 70], [255, 220, 180], [200, 20, 50]].map(c => tint(BOKEH, c));

// ───────────────────────── fonts ─────────────────────────
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
const ready = (async () => {
  const faces = [
    new FontFace('Space Grotesk', b64(FONTS.sg), { weight: '300 700' }),
    new FontFace('Space Mono', b64(FONTS.sm4), { weight: '400' }),
    new FontFace('Space Mono', b64(FONTS.sm7), { weight: '700' }),
  ];
  for (const f of faces) { await f.load(); document.fonts.add(f); }
})();
function spaced(c, str, x, y, ls, align = 'left') {
  let w = 0; for (const ch of str) w += c.measureText(ch).width + ls; w -= ls;
  let cx = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  for (const ch of str) { c.fillText(ch, cx, y); cx += c.measureText(ch).width + ls; }
  return w;
}

// ───────────────────────── 3D: camera, lane, projection ─────────────────────────
const HW = 3.0;          // lane half width (world units); six lanes 1 unit apart
const SPEED = 11.0;       // world units per second down the highway
const LFAR = 26, LFOG = 13, VNEAR = -2.6;
const LANE_U = [0, 1, 2, 3, 4, 5].map(i => -1 + (2 * i + 1) / 6);
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const addS = (a, b, s) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => mul(a, 1 / Math.hypot(a[0], a[1], a[2]));
const rotX = (v, p) => { const c = Math.cos(p), s = Math.sin(p); return [v[0], v[1] * c - v[2] * s, v[1] * s + v[2] * c]; };
const rotZ = (v, q) => { const c = Math.cos(q), s = Math.sin(q); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c, v[2]]; };

const PUMPS = [[1.0, 0.018], [1.8, 0.01], [2.6, 0.018], [3.4, 0.03], [4.2, 0.035]];
// camera: height h, distance d behind the strike line, and the screen row where the strike line sits
function camera(t) {
  const boot = eOut3(inv(0, 1.0, t)), hero = eIO3(inv(T.hero - 0.06, T.last, t));
  const h = lerp(9.5, 5.0, boot) + 2.6 * hero;
  const d = lerp(10.5, 6.6, boot) + 0.6 * hero;

  m.globalAlpha = 1; m.drawImage(eC, 0, 0);
  m.globalAlpha = 0.8; m.drawImage(b1C, 0, 0, CW, CH);
  m.globalAlpha = 0.75; m.drawImage(b2C, 0, 0, CW, CH);
  const fl = 0.22 * env(t, T.last, 0.07) + 0.2 * env(t, T.slam, 0.06) + 0.24 * env(t, T.lock, 0.08) + 0.1 * env(t, T.hero, 0.06);
  if (fl > 0.003) { m.globalAlpha = clamp(fl); m.fillStyle = '#ff8a6a'; m.fillRect(0, 0, CW, CH); }
  m.globalAlpha = 1; m.globalCompositeOperation = 'source-over';
}
function vignette() {
  setS(m); m.globalCompositeOperation = 'source-over';
  if (!GRAD.vig) { const g = m.createRadialGradient(960, 520, 300, 960, 560, 1180); g.addColorStop(0, 'rgba(6,0,3,0)'); g.addColorStop(1, 'rgba(6,0,3,0.88)'); GRAD.vig = g; }
  m.globalAlpha = 1; m.fillStyle = GRAD.vig; m.fillRect(0, 0, W, H);
}
function post(t) {
  setS(m);
  const black = Math.max(1 - sstep(0, 0.22, t), sstep(T.fade0, DUR, t));
  if (black > 0.001) { m.globalAlpha = black; m.fillStyle = '#000'; m.fillRect(0, 0, W, H); }
  m.globalAlpha = 1;
}
function render(t) {
  t = clamp(t, 0, DUR);
  CAM = camera(t); LANE = laneXf(t, CAM); SH = shake(t);
  e.setTransform(1, 0, 0, 1, 0, 0); e.globalCompositeOperation = 'source-over'; e.clearRect(0, 0, CW, CH); e.globalCompositeOperation = 'lighter'; e.globalAlpha = 1;
  drawBackground(t);
  drawLane(t);
  drawGems(t);
  drawHits(t);
  drawLogo(t);
  drawComets(t);
  drawWordmark(t);
  drawParticles(t);
  vignette();
  drawPopups(t);
  drawHUD(t);
  drawCount(t);
  composite(t);
  post(t);
}

// ───────────────────────── audio (score built from the same chart) ─────────────────────────
function buildAudio(ac, t0, from = 0, only = '') {
  const X = gzMix(ac, t0, from, { dur: DUR, fadeAt: T.fade0, seed: 7, drive: 18 });

  const { at, live, bq, G, master, send, panTo, strum, chug, kick, snare, hat, crash, boom, tom, swell, whoosh, noise, osc, cleanNote, F } = X;
  // drumstick click: two hard maple sticks
  const stick = (time, g) => { noise(time, 0.035, 0.55 * g, [bq('bandpass', 2600, 2.2), bq('highpass', 1200)], master, 0.0006); osc('triangle', 1750, 1620, time, 0.045, 0.28 * g, master, 0.0006); osc('sine', 3480, 3400, time, 0.03, 0.08 * g, master, 0.0006); };
  // soft high tick on every hit, pitched by string
  const tick = (time, li, g = 1) => { osc('sine', 3000 + li * 240, 3000 + li * 240, time, 0.05, 0.05 * g, panTo(-0.5 + li * 0.2, master), 0.0008); osc('sine', 6000 + li * 480, 6000 + li * 480, time, 0.02, 0.012 * g, master, 0.0005); };
  // crowd: noise through vowel-like formant bandpasses, a few "sections" with their own breathing
  // only = 'crowd' | 'music' renders a stem, for measuring the mix
  const crowdBus = G(1);
  if (only === 'crowd') { X.master.disconnect(); crowdBus.connect(ac.destination); } else if (only !== 'music') { crowdBus.connect(master); send(crowdBus, 0.45); }
  const CROWD_ENV = [[0, 0.0001], [0.25, 0.04], [1.0, 0.045], [2.6, 0.055], [3.3, 0.075], [3.9, 0.16], [4.25, 0.23], [4.7, 0.15], [5.5, 0.1], [6.0, 0.11], [6.35, 0.19], [7.2, 0.075], [DUR, 0.03]];
  const envAt = x => { for (let i = 1; i < CROWD_ENV.length; i++) { const [a, ga] = CROWD_ENV[i - 1], [b, gb] = CROWD_ENV[i]; if (x <= b) return lerp(ga, gb, inv(a, b, x)); } return CROWD_ENV[CROWD_ENV.length - 1][1]; };
  crowdBus.gain.setValueAtTime(Math.max(0.0001, envAt(from)), at(from));
  for (const [x, g] of CROWD_ENV) if (x > from) crowdBus.gain.linearRampToValueAtTime(g, at(x));
  const SECTIONS = [
    { f: [700, 1150, 2600], q: [4, 5, 7], pan: -0.6, lfo: 3.3, seed: 0 }, { f: [560, 950, 2450], q: [4, 6, 7], pan: 0.55, lfo: 4.1, seed: 0.37 },
    { f: [820, 1300, 2900], q: [5, 6, 8], pan: 0.0, lfo: 5.2, seed: 0.71 }, { f: [380, 2000, 2800], q: [5, 6, 8], pan: -0.2, lfo: 2.6, seed: 1.13 },
  ];
  const cs = Math.max(0, from);
  for (const S of SECTIONS) {
    const s = ac.createBufferSource(); s.buffer = X.NB; s.loop = true;
    const sum = G(1);
    S.f.forEach((f, k) => { const b = bq('bandpass', f, S.q[k]); s.connect(b); b.connect(G([5.5, 3.5, 2.2][k])).connect(sum); });
    const am = G(0.65); sum.connect(am);
    const lfo = ac.createOscillator(), lg = G(0.35); lfo.frequency.value = S.lfo; lfo.connect(lg).connect(am.gain);
    const lfo2 = ac.createOscillator(), lg2 = G(0.2); lfo2.frequency.value = S.lfo * 0.37 + 0.5; lfo2.connect(lg2).connect(am.gain);
    am.connect(panTo(S.pan, crowdBus));
    s.start(at(cs), (S.seed * 2.1 + cs) % 2.9); lfo.start(at(cs)); lfo2.start(at(cs));
    s.stop(at(DUR)); lfo.stop(at(DUR)); lfo2.stop(at(DUR));
  }
  const whistle = (time, f0, f1, d, g, pan) => { if (!live(time)) return; const o = ac.createOscillator(), a = G(0); o.frequency.setValueAtTime(f0, at(time)); o.frequency.linearRampToValueAtTime(f1, at(time + d * 0.7)); o.frequency.linearRampToValueAtTime(f1 * 0.93, at(time + d)); a.gain.setValueAtTime(0.0001, at(time)); a.gain.linearRampToValueAtTime(g, at(time + 0.06)); a.gain.setValueAtTime(g, at(time + d * 0.75)); a.gain.linearRampToValueAtTime(0.0001, at(time + d)); o.connect(a); a.connect(panTo(pan, master)); send(a, 0.5); o.start(at(time)); o.stop(at(time + d + 0.02)); };

  // ── count-in ──
  T.count.forEach((tc, i) => stick(tc, i === 3 ? 0.85 : 0.7));
  swell(0.3, T.riff - 0.004, 0.12, 2500, 8000, 0.7, 'highpass');
  // ── the riff, straight from the chart ──
  NOTES.forEach((N, i) => {
    const next = NOTES[i + 1] ? NOTES[i + 1].t : null, hz = N.gems.map(g => g.hz);
    if (N.kind === 'mute') chug(N.t, [hz[0], hz[0] * 1.4983, hz[0] * 2], 0.95);
    else if (N.final) strum(hz.map((_, k) => N.t + k * 0.009), hz, 3.6, 0.5, T.slam - 0.035);
    else if (hz.length > 1) strum(hz.map((_, k) => N.t + k * 0.007), [...hz, hz[0] * 2], 1.6, 0.55, next - 0.012);
    else strum([N.t], [hz[0]], N.t >= T.hero ? 1.4 : 1.8, N.t >= 2.8 ? 0.6 : 0.62, next - 0.012);
    N.gems.forEach((g, k) => tick(N.t + k * 0.004, g.li, N.final ? 1.4 : 1));
  });
  // drums on the same grid
  const KICK = [1.0, 1.6, 1.8, 2.4, 2.6, 3.2, 3.4, 3.5, 3.6, 3.7], SNARE = [1.4, 2.2, 3.0, 3.8];
  KICK.forEach(x => kick(x, x === 1.0 || x === 2.6 || x === 3.4 ? 0.72 : x > 3.45 ? 0.42 : 0.6));
  SNARE.forEach(x => snare(x, x === 3.8 ? 0.7 : 0.6));
  for (let x = 1.2; x < 3.4; x += 0.2) if (Math.abs(x - 2.6) > 0.01) hat(+x.toFixed(2), 0.5);
  [[3.9, 190], [4.0, 150], [4.1, 118]].forEach(([x, f]) => tom(x, f, 0.34));
  crash(1.0, 0.65, 1.6); crash(2.6, 0.6, 1.5); crash(T.hero, 0.75, 1.6);
  // HERO: the lane ignites
  whoosh(T.hero - 0.02, 0.5, 0.22, 400, 4200);
  noise(T.hero, 0.6, 0.06, [bq('lowpass', 1800), bq('highpass', 200)], master, 0.02);
  whistle(3.55, 1900, 2600, 0.55, 0.018, 0.5); whistle(3.75, 2200, 2900, 0.5, 0.014, -0.4);
  // ── the last big note ──
  kick(T.last, 0.75); boom(T.last, 0.5); crash(T.last, 0.9, 2.4); snare(T.last, 0.5);
  cleanNote(T.last + 0.03, F.E5, 0.3, 0.3, 2.2);
  // fold: the lanes zip into the neck
  whoosh(T.fold0 + 0.04, 0.38, 0.26, 700, 5200);
  swell(T.fold0 + 0.05, T.slam - 0.004, 0.18, 1500, 7000, 0.9, 'bandpass');
  // logo slam + hands on the grid
  kick(T.slam, 0.65); snare(T.slam, 0.62); boom(T.slam, 0.28); crash(T.slam, 0.45, 1.2);
  strum([0, 0.006, 0.012].map(d => T.slam + d), [F.E2, F.B2, F.E3], 1.2, 0.55, T.slam + 0.17);
  const HANDCH = [[F.E2, F.B2, F.E3], [F.E2, F.B2, F.E3], [F.G2, F.D3, F.G3], [F.A2, F.E3, F.A3]];
  T.hands.forEach((x, i) => {
    if (i < 3) chug(x, HANDCH[i], 1.0); else strum([0, 0.007, 0.014].map(d => x + d), HANDCH[i], 2.2, 0.55, T.burst[0] - 0.02);
    (i % 2 ? snare : kick)(x, 0.6); tick(x, 3 + (i % 3), 1.3);
  });
  crash(T.hands[3], 0.35, 1.2); hat(4.9, 0.4); hat(5.1, 0.4); hat(5.3, 0.4);
  whistle(4.75, 2100, 2800, 0.5, 0.016, -0.5);
  // the fill: each letter bursts on a tom
  swell(5.45, T.lock - 0.004, 0.24, 2500, 9500, 0.7, 'highpass');
  [[T.burst[0], 210], [T.burst[1], 175], [T.burst[2], 140], [T.burst[3], 112]].forEach(([x, f], i) => { tom(x, f, 0.36); noise(x, 0.12, 0.08, [bq('highpass', 5000)]); if (i % 2 === 0) snare(x, 0.4); });
  kick(T.burst[0], 0.55);
  // ── lockup: the final chord and crash ──
  strum([0, 0.009, 0.018, 0.027, 0.036, 0.045].map(d => T.lock + d), [F.E2, F.B2, F.E3, F.B3, F.E4, F.E4], 6.5, 0.55, null, false);
  // the amp starts to feed back while the chord rings
  if (live(T.lock)) {
    const st = Math.max(T.lock + 0.3, from), o = ac.createOscillator(), vib = ac.createOscillator(), vg = G(3.5), a = G(0);
    o.frequency.value = F.E5; vib.frequency.value = 5.2; vib.connect(vg).connect(o.frequency);
    a.gain.setValueAtTime(0.0001, at(st)); a.gain.exponentialRampToValueAtTime(0.03, at(Math.max(st + 0.05, 7.5)));
    o.connect(bq('lowpass', 2400)).connect(a); a.connect(panTo(0.2, master)); send(a, 0.4);
    o.start(at(st)); vib.start(at(st)); o.stop(at(DUR)); vib.stop(at(DUR));
  }
  kick(T.lock, 0.75); boom(T.lock, 0.55); crash(T.lock, 0.95, 3.0); snare(T.lock, 0.5);
  ['E4', 'Gs4', 'B4', 'E5'].forEach((n, i) => cleanNote(T.lock + 0.05 + i * 0.06, F[n], 0.34, 0.35 - i * 0.2, 3.4));
  whistle(6.45, 2000, 2700, 0.6, 0.02, 0.45); whistle(6.7, 1800, 2500, 0.55, 0.015, -0.35);
  osc('sine', 2637, 2637, T.url + 0.02, 1.2, 0.03, panTo(0.15, master), 0.004);
}

// ───────────────────────── boot ─────────────────────────
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
setQuality(1);
CAM = camera(0); LANE = laneXf(0, CAM);
initEvents();

window.GZ = {
  DUR, ready,
  frame: t => render(t),
  // motion blur: n sub-frames across a 180° shutter, averaged; returns a PNG as base64
  capture(t, n = 1) {
    if (!this.acc) { this.acc = mk(CW, CH); this.ax = this.acc.getContext('2d'); }
    for (let i = 0; i < n; i++) { render(t + (n > 1 ? ((i + 0.5) / n - 0.5) / 120 : 0)); this.ax.globalAlpha = 1 / (i + 1); this.ax.drawImage(canvas, 0, 0); }
    return this.acc.toDataURL('image/png').split(',')[1];
  },
  async audio() { const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr); buildAudio(oc, 0, 0); const b = await oc.startRendering(); return gzWavB64(b); },
  _build: buildAudio, _notes: NOTES,
};
if (RENDER) return;

// ───────────────────────── player UI ─────────────────────────
const stage = document.getElementById('stage');
const big = document.getElementById('big'), bigLabel = document.getElementById('bigLabel');
const playBtn = document.getElementById('play'), playLabel = document.getElementById('playLabel'), playIcon = document.getElementById('playIcon');
const soundBtn = document.getElementById('sound'), soundLabel = document.getElementById('soundLabel');
const scrub = document.getElementById('scrub'), tcNow = document.getElementById('tcNow');
const scenesEl = document.getElementById('scenes'), ticks = document.getElementById('ticks');
const SOUND_FILE = 'gz2h-highway.mp3';
const POSTER = 3.47;
const ICON_PLAY = 'M3 1.8v12.4c0 .6.7 1 1.2.7l10-6.2c.5-.3.5-1.1 0-1.4l-10-6.2C3.7.8 3 1.2 3 1.8z';
const ICON_PAUSE = 'M3 2h3.4v12H3zM9.6 2H13v12H9.6z';
const CHIP_C = ['#e0182e', '#f6682a', '#fb9a3c', '#fff0d8'];

SCENES.forEach((sc, i) => {
  const b = document.createElement('button');
  b.className = 'scene'; b.type = 'button'; b.id = 'scene-' + i; b.style.setProperty('--c', CHIP_C[i]);
  b.innerHTML = `<span class="st"><em>${String(i + 1).padStart(2, '0')}</em>${sc.t.toFixed(2)} s</span><span class="sn">${sc.name}</span><span class="sd">${sc.desc}</span><span class="fill"></span>`;
  b.addEventListener('click', () => play(sc.t));
  scenesEl.appendChild(b);
  if (i) { const tk = document.createElement('i'); tk.style.left = `calc(${(sc.t / DUR) * 100}% + ${7 - 14 * sc.t / DUR}px)`; ticks.appendChild(tk); }
});

let now = POSTER, playing = false, soundOn = true, ac = null, t0 = 0, perf0 = 0, raf = 0, slow = 0;
function fitQuality() {
  const want = clamp(stage.clientWidth * Math.min(2, window.devicePixelRatio || 1) / W, 0.4, 1);
  const q = Math.round(want * 20) / 20;
  if (Math.abs(q - Q) > 0.049) setQuality(q);
}
function show(t) {
  now = t; render(t);
  scrub.value = t.toFixed(3); scrub.style.setProperty('--p', (t / DUR * 100) + '%');
  tcNow.textContent = t.toFixed(2);
  SCENES.forEach((sc, i) => {
    const el = scenesEl.children[i], on = t >= sc.t && t < sc.end;
    el.classList.toggle('on', on);
    el.querySelector('.fill').style.width = (clamp((t - sc.t) / (sc.end - sc.t)) * 100) + '%';
  });
}
// Sound comes from a pre-rendered soundtrack file played through an <audio> element, which the
// iPhone silent switch does not mute (Web Audio is muted by it). Live synthesis is the fallback.
const snd = new Audio(); snd.preload = 'auto'; snd.src = SOUND_FILE;
let fileOK = true, mode = 'none', synthFrom = 0;
snd.addEventListener('error', () => { fileOK = false; });
snd.addEventListener('playing', () => { if (mode === 'file' && ac) { ac.close().catch(() => {}); ac = null; } });
function stopAudio() { mode = 'none'; try { snd.pause(); } catch (err) {} if (ac) { ac.close().catch(() => {}); ac = null; } }
function noSound() { mode = 'none'; soundLabel.textContent = 'No sound'; }
function startSynth() {
  if (!ac) return noSound();
  try {
    synthFrom = clamp((performance.now() - perf0) / 1000, 0, DUR);
    if (ac.resume) ac.resume();
    t0 = ac.currentTime + 0.15; buildAudio(ac, t0, synthFrom); mode = 'synth';
  } catch (err) { noSound(); }
}
function setPlayingUI(p) {
  playing = p;
  playLabel.textContent = p ? 'Pause' : (now >= DUR - 0.01 ? 'Replay' : 'Play');
  playIcon.firstElementChild.setAttribute('d', p ? ICON_PAUSE : ICON_PLAY);
  big.hidden = p;
}
function play(from = 0) {
  if (from >= DUR - 0.05) from = 0;
  stopAudio(); cancelAnimationFrame(raf);
  perf0 = performance.now() - from * 1000;
  const startedAt = performance.now();
  if (soundOn) {
    soundLabel.textContent = 'Sound on';
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (err) {}
    // unlock a context inside this tap, in case the file can't play and we fall back to synthesis
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.resume) ac.resume(); } catch (err) { ac = null; }
    if (fileOK) {
      mode = 'file';
      try { snd.currentTime = from; } catch (err) {}
      const p = snd.play();
      if (p && p.catch) p.catch(() => { if (mode === 'file') startSynth(); });
    } else startSynth();
  }
  slow = 0;
  setPlayingUI(true);
  const tick = () => {
    let t;
    if (mode === 'file') {
      if (snd.ended) t = DUR;
      else if (!snd.paused && snd.readyState >= 3) { t = snd.currentTime; perf0 = performance.now() - t * 1000; }
      else if (performance.now() - startedAt < 1500) { t = from; perf0 = performance.now() - from * 1000; }
      else { startSynth(); t = (performance.now() - perf0) / 1000; }
    } else if (mode === 'synth' && ac) t = ac.currentTime - t0 + synthFrom - (ac.outputLatency || 0);
    else t = (performance.now() - perf0) / 1000;
    const f0 = performance.now();
    show(clamp(t, 0, DUR));
    if (performance.now() - f0 > 26 && ++slow > 20 && Q > 0.5) { setQuality(Math.max(0.5, Q - 0.2)); slow = 0; }
    if (t >= DUR) { setPlayingUI(false); show(7.3); now = DUR; playLabel.textContent = 'Replay'; bigLabel.textContent = 'Replay with sound'; big.hidden = false; stopAudio(); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
GZ.player = { snd, get mode() { return mode; } };
function pause() { cancelAnimationFrame(raf); stopAudio(); setPlayingUI(false); }

big.addEventListener('click', () => play(now >= DUR - 0.01 || now === POSTER ? 0 : now));
playBtn.addEventListener('click', () => (playing ? pause() : play(now >= DUR - 0.01 ? 0 : now)));
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.setAttribute('aria-pressed', String(soundOn)); soundLabel.textContent = soundOn ? 'Sound on' : 'Sound off';
  bigLabel.textContent = soundOn ? 'Play with sound' : 'Play';
  if (playing) play(now);
});
scrub.addEventListener('input', () => { if (playing) pause(); show(+scrub.value); });
window.addEventListener('resize', () => { fitQuality(); if (!playing) show(now); });

ready.then(() => { fitQuality(); show(now); });
})();
</script>
