<style>
/* Layout: one cinema stage, a transport bar under it, and the four scenes as a storyboard strip */

}
html, body { background: var(--ink); color: var(--text); }
body { font-family: var(--display); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 28px 56px; display: grid; gap: 18px; }

.stage canvas { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; border: 0; padding: 0; cursor: pointer; color: var(--text); background: radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.5)); }
.overlay[hidden] { display: none !important; }
.pill { display: inline-flex; align-items: center; gap: 14px; padding: 12px 22px 12px 12px; border-radius: 999px; background: rgba(13, 3, 6, 0.74); border: 1px solid rgba(255, 255, 255, 0.14); font: 600 16px var(--display); letter-spacing: 0.01em; transition: transform 0.2s ease, background 0.2s ease; }
.overlay:hover .pill, .overlay:focus-visible .pill { transform: scale(1.04); background: rgba(13, 3, 6, 0.9); }

<script>
(() => {
'use strict';

// ───────────────────────── math ─────────────────────────
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const sstep = (a, b, x) => { const t = inv(a, b, x); return t * t * (3 - 2 * t); };
const eOut3 = t => 1 - (1 - t) ** 3;
const eOut4 = t => 1 - (1 - t) ** 4;
const eIO3 = t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
const eOutBack = (t, s = 1.7) => 1 + (s + 1) * (t - 1) ** 3 + s * (t - 1) ** 2;
const eInBack = (t, s = 1.7) => (s + 1) * t * t * t - s * t * t;
const spring = (tau, f = 2.6, z = 0.38) => {
  if (tau <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
};
const mulberry = a => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const vnoise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
const TAU = Math.PI * 2;

// ───────────────────────── timeline (seconds) ─────────────────────────
const DUR = 8.0;
const T = {
  pluck6: 0.42,
  arp: [0.86, 0.98, 1.10, 1.22, 1.34],                   // strings 5 → 1, open A D G B E
  strum: 1.62,
  strumAt: [1.600, 1.611, 1.621, 1.632, 1.642, 1.653],    // strings 6 → 1
  hands: [2.70, 2.95, 3.20, 3.45],                        // horns, thumb, wave, ok
  sweep1: 3.66,
  handsOut: 4.30,
  morph0: 4.38,
  line0: 4.62,
  lower0: 4.80,
  final: 5.30,
  url: 5.56,
  sweep2: 6.10,
  fade0: 7.45,
};
const SCENES = [
  { t: 0.00, end: 1.62, name: 'One string', desc: 'A single low E in the dark, then the open strings E A D G B E light up in turn.' },
  { t: 1.62, end: 2.70, name: 'The strum', desc: 'A full power chord. The shockwave throws the camera back and the neck turns out to be the H.' },
  { t: 2.70, end: 4.30, name: 'Four hands', desc: 'Rock horns, thumbs up, wave and OK land on four beats, each with a chug and a drum hit.' },
  { t: 4.30, end: 8.00, name: 'Zero2Hero', desc: 'The letters fold into the wordmark and ride one last plucked string.' },
];

// ───────────────────────── world geometry (traced logo units) ─────────────────────────
const K0 = 0.38;                     // logo units → screen px at rest
const HOME = { x: 1611, y: 655 };
const W = 1920, H = 1080;
const STR = {
  xL: 2150, xN: 2790,
  y: [517, 536, 555, 574, 593, 612],
  w: [3.2, 2.7, 2.2, 1.6, 1.2, 0.9],
  f: [3.6, 4.1, 4.7, 5.3, 6.0, 6.8],   // slow-motion visual frequencies
  posts: [[2885, 494], [2960, 494], [3040, 494], [3040, 638], [2960, 638], [2885, 638]],
};
const SCALE_LEN = 2352;               // so frets 1–5 fit the visible neck
const FRETS = [1, 2, 3, 4, 5].map(n => STR.xN - SCALE_LEN * (1 - Math.pow(2, -n / 12)));
const REVEAL_C = { x: 2578, y: 566 };

const LET = {
  G:   { bb: [58, 251, 778, 922] },
  Z:   { bb: [821, 207, 1442, 913] },
  two: { bb: [1465, 208, 1992, 922] },
  H:   { bb: [2042, 207, 2700, 1274] },
};
const HANDS = [
  { id: 'horns', letter: 'G',   anchor: [392, 262], dir: -1, bb: [313, 65, 536, 271] },
  { id: 'thumb', letter: 'Z',   anchor: [985, 336], dir: 1,  bb: [868, 104, 1080, 347] },
  { id: 'wave',  letter: 'two', anchor: [1700, 270], dir: 1, bb: [1527, 51, 1761, 282] },
  { id: 'ok',    letter: 'H',   anchor: [2650, 600], dir: 1, bb: [2427, 317, 2704, 611] },
];
const MORPH_MAP = { G: 0, Z: 6, two: 10, H: 11 };
const MBB = { G: [58, 251, 778, 922], Z: [821, 207, 1442, 913], two: [1465, 208, 1992, 922], H: [2042, 207, 2700, 922] };   // index into "GuitarZero2Hero"

// pluck events per string (index 0 = string 6, low E, top)
const PL = [[], [], [], [], [], []];
PL[0].push({ t: T.pluck6, xp: 2566, A: 9 });
T.arp.forEach((t, j) => PL[j + 1].push({ t, xp: 2570 + j * 4, A: 7.5 }));
T.strumAt.forEach((t, i) => PL[i].push({ t, xp: 2572 + i * 5, A: 13 }));

// pick tip keyframes [t, x, y]
const PICK = [
  [0.00, 2380, 300], [0.18, 2470, 400], [0.34, 2552, 500], [0.42, 2566, 526], [0.50, 2578, 532],
  [0.66, 2600, 470], [0.79, 2572, 524], [0.86, 2578, 544], [0.98, 2582, 563], [1.10, 2586, 582],
  [1.22, 2590, 601], [1.34, 2594, 620], [1.43, 2606, 668], [1.54, 2540, 452], [1.585, 2554, 500],
  [1.62, 2577, 566], [1.655, 2600, 622], [1.76, 2660, 830], [1.9, 2700, 1000],
];
const LIFT = t => {
  if (t < 0.34) return 1 - sstep(0.18, 0.34, t);
  if (t < 0.79) return sstep(0.47, 0.6, t) * (1 - sstep(0.66, 0.79, t));
  if (t < 1.6) return sstep(1.36, 1.46, t) * (1 - sstep(1.54, 1.585, t));
  return sstep(1.66, 1.8, t);
};

// ───────────────────────── canvas setup ─────────────────────────
const canvas = document.getElementById('c');
const m = canvas.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
let Q = 1, CW = 1920, CH = 1080;
let eC, e, b1C, b1, b2C, b2, sC, sh;
function setQuality(q) {
  Q = q; CW = Math.round(W * q); CH = Math.round(H * q);
  canvas.width = CW; canvas.height = CH;
  eC = mk(CW, CH); e = eC.getContext('2d');
  b1C = mk(Math.ceil(CW / 4), Math.ceil(CH / 4)); b1 = b1C.getContext('2d');
  b2C = mk(Math.ceil(CW / 8), Math.ceil(CH / 8)); b2 = b2C.getContext('2d');
  sC = mk(Math.ceil(CW / 4), Math.ceil(CH / 4)); sh = sC.getContext('2d');
}

const P = {};
for (const k in LOGO) P[k] = new Path2D(LOGO[k]);

// grain tiles
const GRAIN = [0, 1, 2, 3].map(s => {
  const c = mk(256, 256), x = c.getContext('2d'), id = x.createImageData(256, 256), r = mulberry(99 + s * 7);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 120; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0); return c;
});
// soft ember sprite
const SPR = (() => {
  const c = mk(64, 64), x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,236,220,1)'); g.addColorStop(0.18, 'rgba(255,150,110,0.85)'); g.addColorStop(0.5, 'rgba(255,50,40,0.25)'); g.addColorStop(1, 'rgba(255,0,20,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return c;
})();

// ───────────────────────── fonts & layout ─────────────────────────
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
const ready = (async () => {
  const faces = [
    new FontFace('Space Grotesk', b64(FONTS.sg), { weight: '300 700' }),
    new FontFace('Space Mono', b64(FONTS.sm4), { weight: '400' }),
    new FontFace('Space Mono', b64(FONTS.sm7), { weight: '700' }),
  ];
  for (const f of faces) { await f.load(); document.fonts.add(f); }
  layout();
})();

const WM = { text: 'GuitarZero2Hero', glyphs: [], fs: 0, base: 545, lineY: 580, cap: 0 };
const URL_T = { text: 'guitarzero2hero.com', fs: 33, base: 646 };
const toW = (sx, sy) => [HOME.x + (sx - 960) / K0, HOME.y + (sy - 540) / K0];

function layout() {
  const c = mk(10, 10).getContext('2d');
  c.font = '700 100px "Space Grotesk"';
  const capH = c.measureText('H').actualBoundingBoxAscent;
  const targetW = 1240, cap = targetW / 11.27;
  const fs = 100 * cap / capH;
  c.font = `700 ${fs}px "Space Grotesk"`;
  const tx = WM.text, mAll = c.measureText(tx);
  const ink = mAll.actualBoundingBoxLeft + mAll.actualBoundingBoxRight;
  const ls = (targetW - ink) / (tx.length - 1);
  const x0 = 960 - targetW / 2 + mAll.actualBoundingBoxLeft;
  WM.fs = fs; WM.cap = cap; WM.glyphs = [];
  let lowerRank = 0;
  for (let i = 0; i < tx.length; i++) {
    const ch = tx[i], gm = c.measureText(ch);
    const ox = x0 + c.measureText(tx.slice(0, i)).width + i * ls;
    const bb = [ox - gm.actualBoundingBoxLeft, WM.base - gm.actualBoundingBoxAscent, ox + gm.actualBoundingBoxRight, WM.base + gm.actualBoundingBoxDescent];
    const cap = Object.values(MORPH_MAP).includes(i);
    WM.glyphs.push({ ch, ox, bb, cap, rank: cap ? -1 : lowerRank++, cx: (bb[0] + bb[2]) / 2 });
  }
  c.font = `500 ${URL_T.fs}px "Space Grotesk"`;
  URL_T.adv = [...URL_T.text].map(ch => c.measureText(ch).width);
}

// ───────────────────────── camera ─────────────────────────
const PUMPS = [{ t: 2.70, a: 0.012 }, { t: 2.95, a: 0.012 }, { t: 3.20, a: 0.012 }, { t: 3.45, a: 0.018 }, { t: 5.30, a: 0.02 }];
const SHAKES = [{ t: 1.62, a: 26, d: 0.2 }, { t: 2.70, a: 4, d: 0.09 }, { t: 2.95, a: 4, d: 0.09 }, { t: 3.20, a: 4, d: 0.09 }, { t: 3.45, a: 6, d: 0.1 }, { t: 5.30, a: 9, d: 0.14 }];
const CAM_A = 1.64, CAM_B = 2.6;
function camera(t) {
  let cx, cy, z, rot;
  if (t < CAM_A) {
    const u = t / CAM_A, ee = eIO3(u);
    cx = lerp(2604, 2690, ee); cy = lerp(560, 566, ee); z = lerp(11.2, 9.4, u); rot = lerp(-0.12, -0.085, ee);
  } else {
    const u = inv(CAM_A, CAM_B, t), ez = eOut4(u), ec = eOut4(clamp(u * 1.1));
    z = Math.exp(lerp(Math.log(9.4), 0, ez)); cx = lerp(2690, HOME.x, ec); cy = lerp(566, HOME.y, ec); rot = lerp(-0.085, 0, ez);
  }
  for (const p of PUMPS) { const tau = t - p.t; if (tau > 0 && tau < 0.8) z *= 1 + p.a * (1 - Math.exp(-tau * 60)) * Math.exp(-tau * 7); }
  return { cx, cy, z, rot, k: K0 * z };
}
function shake(t) {
  let x = 0, y = 0, r = 0;
  for (const s of SHAKES) {
    const tau = t - s.t; if (tau < 0 || tau > 1.2) continue;
    const a = s.a * Math.exp(-tau / s.d);
    x += a * vnoise(tau * 38 + s.t * 10); y += a * vnoise(tau * 41 + s.t * 20 + 7); r += a * 0.0008 * vnoise(tau * 30 + s.t);
  }
  return { x, y, r };
}
function state(t) { return { t, cam: camera(t), sh: shake(t), gz: 1 + 0.035 * sstep(5.3, 8, t) }; }
function setScreen(c, st, q = Q) {
  c.setTransform(q, 0, 0, q, 0, 0);
  c.translate(960 + st.sh.x, 540 + st.sh.y); c.rotate(st.sh.r); c.scale(st.gz, st.gz); c.translate(-960, -540);
}
function setWorld(c, st, q = Q) {
  setScreen(c, st, q);
  const k = st.cam;
  c.translate(960, 540); c.rotate(k.rot); c.scale(k.k, k.k); c.translate(-k.cx, -k.cy);
}
function w2s(t, x, y) {
  const c = camera(t);
  const dx = (x - c.cx) * c.k, dy = (y - c.cy) * c.k, cr = Math.cos(c.rot), sr = Math.sin(c.rot);
  return { x: 960 + dx * cr - dy * sr, y: 540 + dx * sr + dy * cr };
}

// ───────────────────────── strings ─────────────────────────
function modal(u, tau, p, A, f, gam) {
  let y = 0;
  const den = Math.PI * Math.PI * p * (1 - p);
  for (let n = 1; n <= 10; n++) {
    const bn = 2 * A * Math.sin(n * Math.PI * p) / (n * n * den);
    y += bn * Math.sin(n * Math.PI * u) * Math.cos(TAU * n * f * tau) * Math.exp(-gam * (1 + 0.4 * (n - 1)) * tau);
  }
  return y;
}
function strDisp(i, x, t) {
  const ev = PL[i], Ls = STR.xN - STR.xL, u = (STR.xN - x) / Ls;
  let y = 0;
  for (let k = 0; k < ev.length; k++) {
    const E = ev[k], nx = ev[k + 1];
    let w = 1;
    if (nx && t > nx.t) { if (t > nx.t + 0.03) continue; w = 1 - (t - nx.t) / 0.03; }
    if (t < E.t - 0.07) continue;
    const p = (STR.xN - E.xp) / Ls;
    if (t < E.t) { const a = E.A * eOut3(inv(E.t - 0.07, E.t, t)); y += w * a * (u < p ? u / p : (1 - u) / (1 - p)); }
    else y += w * modal(u, t - E.t, p, E.A, STR.f[i], 1.35);
  }
  return y;
}
function strEnergy(i, t) {
  let en = 0;
  for (const E of PL[i]) {

function drawLogo(st) {

function buildAudio(ac, t0, from = 0) {

  const strum = (times, notes, t60, gain, stopAt, mute) => notes.forEach((n, i) => {
    const o = { t60, bright: mute ? 0.3 : 0.7, pick: 0.12, damp: mute ? 0.62 : 0.5 };
    src(ksBuffer(ac, F[n], Math.min(t60 * 1.1, 4.5), { ...o, seed: seed++ }), times[i], L, gain, 1, stopAt);
    src(ksBuffer(ac, F[n], Math.min(t60 * 1.1, 4.5), { ...o, seed: seed++ }), times[i] + 0.011, R, gain, 1.0023, stopAt);
  });

  const kick = (time, g = 1) => {

    n.g.disconnect(); const env = G(0); n.g.connect(bq('highpass', 900)).connect(bq('peaking', 2000, 0.8, 4)).connect(env); env.connect(master); send(env, 0.35);
    env.gain.setValueAtTime(0.0001, at(time)); env.gain.exponentialRampToValueAtTime(0.55 * g, at(time + 0.003)); env.gain.exponentialRampToValueAtTime(0.0001, at(time + 0.22)); n.s.stop(at(time + 0.25));
    const o = ac.createOscillator(), a = G(0); o.type = 'triangle'; o.frequency.setValueAtTime(200, at(time)); o.frequency.exponentialRampToValueAtTime(160, at(time + 0.08));
    a.gain.setValueAtTime(0.0001, at(time)); a.gain.exponentialRampToValueAtTime(0.4 * g, at(time + 0.003)); a.gain.exponentialRampToValueAtTime(0.0001, at(time + 0.12));
    o.connect(a).connect(master); o.start(at(time)); o.stop(at(time + 0.14));
  };
  const tom = (time, f, g = 1) => {
    if (!live(time)) return;
    const o = ac.createOscillator(), a = G(0); o.frequency.setValueAtTime(f * 1.7, at(time)); o.frequency.exponentialRampToValueAtTime(f, at(time + 0.07));
    a.gain.setValueAtTime(0.0001, at(time)); a.gain.exponentialRampToValueAtTime(0.75 * g, at(time + 0.004)); a.gain.exponentialRampToValueAtTime(0.0001, at(time + 0.38));

  };
  const boom = (time, g = 1) => {
    if (!live(time)) return;
    const o = ac.createOscillator(), a = G(0); o.frequency.setValueAtTime(62, at(time)); o.frequency.exponentialRampToValueAtTime(31, at(time + 1.1));
    a.gain.setValueAtTime(0.0001, at(time)); a.gain.exponentialRampToValueAtTime(0.9 * g, at(time + 0.01)); a.gain.exponentialRampToValueAtTime(0.0001, at(time + 1.7));
    o.connect(a).connect(master); o.start(at(time)); o.stop(at(time + 1.8));
  };

    s.connect(flt).connect(env); env.connect(master); send(env, 0.25);

    flt.frequency.setValueAtTime(lerp(f1, f2, inv(t1, t2, st)), at(st)); flt.frequency.exponentialRampToValueAtTime(f2, at(t2));
    env.gain.setValueAtTime(Math.max(0.0001, g * inv(t1, t2, st) ** 3), at(st)); env.gain.exponentialRampToValueAtTime(g, at(t2)); env.gain.exponentialRampToValueAtTime(0.0001, at(t2 + 0.03));

    if (!live(time)) return;

    s.connect(flt).connect(env); env.connect(master); send(env, 0.3);
    flt.frequency.setValueAtTime(2600, at(time)); flt.frequency.exponentialRampToValueAtTime(320, at(time + dur));
    env.gain.setValueAtTime(0.0001, at(time)); env.gain.exponentialRampToValueAtTime(g, at(time + dur * 0.35)); env.gain.exponentialRampToValueAtTime(0.0001, at(time + dur));
    s.start(at(time)); s.stop(at(time + dur + 0.02));
  };

    if (!live(t2)) return;
    for (const [f, gg] of [[41.2, 1], [82.4, 0.35]]) {
      const o = ac.createOscillator(), a = G(0); o.frequency.value = f; o.connect(a).connect(master);

  swell(0.0, T.strum - 0.01, 0.15, 300, 4200, 3);
  whoosh(0.06, 0.42, 0.12);                                  // glint along the string

  // the final hit
  strum([0, 0.009, 0.018, 0.027].map(d => T.final + d), ['E2', 'B2', 'E3', 'B3'], 4.2, 0.6, null, false);
  kick(T.final, 0.75); boom(T.final, 0.55); crash(T.final, 0.85, 3.2); snare(T.final, 0.5);
  ['E4', 'Gs4', 'B4', 'E5'].forEach((n, i) => cleanNote(T.final + 0.04 + i * 0.06, F[n], 0.32, 0.35 - i * 0.2, 3.4));

}

function wavB64(buf) {
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
  let pk = 0; for (let c = 0; c < ch; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) pk = Math.max(pk, Math.abs(d[i])); }
  const gain = 0.89 / (pk || 1);
  const bytes = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) bytes.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); bytes.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt '); bytes.setUint32(16, 16, true); bytes.setUint16(20, 1, true); bytes.setUint16(22, ch, true);
  bytes.setUint32(24, sr, true); bytes.setUint32(28, sr * ch * 2, true); bytes.setUint16(32, ch * 2, true); bytes.setUint16(34, 16, true); w(36, 'data'); bytes.setUint32(40, n * ch * 2, true);
  const chans = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  let o = 44; for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { const v = clamp(chans[c][i] * gain, -1, 1); bytes.setInt16(o, v * 32767, true); o += 2; }
  let s = ''; const u8 = new Uint8Array(bytes.buffer); for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { b64: btoa(s), peak: pk };
}

// ───────────────────────── boot ─────────────────────────
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
setQuality(1);

window.GZ = {
  DUR,
  ready: ready.then(() => { initBursts(); }),
  frame: t => render(t),
  frameMB(t, n = 4) {
    if (!this.acc) { this.acc = mk(CW, CH); this.ax = this.acc.getContext('2d'); }
    const ax = this.ax;
    for (let i = 0; i < n; i++) {
      render(t + ((i + 0.5) / n - 0.5) / 120, false);
      ax.globalAlpha = 1 / (i + 1); ax.drawImage(canvas, 0, 0);
    }
    m.setTransform(1, 0, 0, 1, 0, 0); m.globalAlpha = 1; m.globalCompositeOperation = 'copy'; m.drawImage(this.acc, 0, 0); m.globalCompositeOperation = 'source-over';
    grain(Math.round(t * 60));
  },
  async audio() { const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr); buildAudio(oc, 0, 0); const b = await oc.startRendering(); return wavB64(b); },
};
if (RENDER) return;

// ───────────────────────── player UI ─────────────────────────
const stage = document.getElementById('stage');
const big = document.getElementById('big'), bigLabel = document.getElementById('bigLabel');
const playBtn = document.getElementById('play'), playLabel = document.getElementById('playLabel'), playIcon = document.getElementById('playIcon');
const soundBtn = document.getElementById('sound'), soundLabel = document.getElementById('soundLabel');
const scrub = document.getElementById('scrub'), tcNow = document.getElementById('tcNow');
const scenesEl = document.getElementById('scenes'), ticks = document.getElementById('ticks');
const SOUND_FILE = 'gz2h-intro.mp3';
const POSTER = 3.64;
const ICON_PLAY = 'M3 1.8v12.4c0 .6.7 1 1.2.7l10-6.2c.5-.3.5-1.1 0-1.4l-10-6.2C3.7.8 3 1.2 3 1.8z';
const ICON_PAUSE = 'M3 2h3.4v12H3zM9.6 2H13v12H9.6z';

SCENES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'scene'; b.type = 'button'; b.id = 'scene-' + i;
  b.innerHTML = `<span class="st">${String(i + 1).padStart(2, '0')} · ${s.t.toFixed(2)} s</span><span class="sn">${s.name}</span><span class="sd">${s.desc}</span><span class="fill"></span>`;
  b.addEventListener('click', () => play(s.t));
  scenesEl.appendChild(b);
  if (i) { const tk = document.createElement('i'); tk.style.left = `calc(${(s.t / DUR) * 100}% + ${7 - 14 * s.t / DUR}px)`; ticks.appendChild(tk); }
});

let now = POSTER, playing = false, soundOn = true, ac = null, t0 = 0, perf0 = 0, raf = 0, slow = 0;
function fitQuality() {
  const want = clamp(stage.clientWidth * Math.min(2, window.devicePixelRatio || 1) / W, 0.4, 1);
  const q = Math.round(want * 20) / 20;
  if (Math.abs(q - Q) > 0.049) { setQuality(q); BG = VIG = LETTER_FILL = null; }
}
function show(t) {
  now = t; render(t);
  scrub.value = t.toFixed(3); scrub.style.setProperty('--p', (t / DUR * 100) + '%');
  tcNow.textContent = t.toFixed(2);
  SCENES.forEach((s, i) => {
    const el = scenesEl.children[i], on = t >= s.t && t < s.end;
    el.classList.toggle('on', on);
    el.querySelector('.fill').style.width = (clamp((t - s.t) / (s.end - s.t)) * 100) + '%';
  });
}
// Sound comes from a pre-rendered soundtrack file played through an <audio> element, which the
// iPhone silent switch does not mute (Web Audio is muted by it). Live synthesis is the fallback.
const snd = new Audio(); snd.preload = 'auto'; snd.src = SOUND_FILE;
let fileOK = true, mode = 'none', synthFrom = 0;
snd.addEventListener('error', () => { fileOK = false; });
snd.addEventListener('playing', () => { if (mode === 'file' && ac) { ac.close().catch(() => {}); ac = null; } });
function stopAudio() { mode = 'none'; try { snd.pause(); } catch (err) {} if (ac) { ac.close().catch(() => {}); ac = null; } }
function noSound() { mode = 'none'; soundLabel.textContent = 'No sound'; }
function startSynth() {
  if (!ac) return noSound();
  try {
    synthFrom = clamp((performance.now() - perf0) / 1000, 0, DUR);
    if (ac.resume) ac.resume();
    t0 = ac.currentTime + 0.15; buildAudio(ac, t0, synthFrom); mode = 'synth';
  } catch (err) { noSound(); }
}
function setPlayingUI(p) {
  playing = p;
  playLabel.textContent = p ? 'Pause' : (now >= DUR - 0.01 ? 'Replay' : 'Play');
  playIcon.firstElementChild.setAttribute('d', p ? ICON_PAUSE : ICON_PLAY);
  big.hidden = p;
}
function play(from = 0) {
  if (from >= DUR - 0.05) from = 0;
  stopAudio(); cancelAnimationFrame(raf);
  perf0 = performance.now() - from * 1000;
  const startedAt = performance.now();
  if (soundOn) {
    soundLabel.textContent = 'Sound on';
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (err) {}
    // unlock a context inside this tap, in case the file can't play and we fall back to synthesis
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.resume) ac.resume(); } catch (err) { ac = null; }
    if (fileOK) {
      mode = 'file';
      try { snd.currentTime = from; } catch (err) {}
      const p = snd.play();
      if (p && p.catch) p.catch(() => { if (mode === 'file') startSynth(); });
    } else startSynth();
  }
  slow = 0;
  setPlayingUI(true);
  const tick = () => {
    let t;
    if (mode === 'file') {
      if (snd.ended) t = DUR;
      else if (!snd.paused && snd.readyState >= 3) { t = snd.currentTime; perf0 = performance.now() - t * 1000; }
      else if (performance.now() - startedAt < 1500) { t = from; perf0 = performance.now() - from * 1000; }
      else { startSynth(); t = (performance.now() - perf0) / 1000; }
    } else if (mode === 'synth' && ac) t = ac.currentTime - t0 + synthFrom - (ac.outputLatency || 0);
    else t = (performance.now() - perf0) / 1000;
    const f0 = performance.now();
    show(clamp(t, 0, DUR));
    if (performance.now() - f0 > 26 && ++slow > 20 && Q > 0.5) { setQuality(Math.max(0.5, Q - 0.2)); BG = VIG = LETTER_FILL = null;  slow = 0; }
    if (t >= DUR) { setPlayingUI(false); show(6.9); now = DUR; playLabel.textContent = 'Replay'; bigLabel.textContent = 'Replay with sound'; big.hidden = false; stopAudio(); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
GZ.player = { snd, get mode() { return mode; } };
function pause() { cancelAnimationFrame(raf); stopAudio(); setPlayingUI(false); }

big.addEventListener('click', () => play(now >= DUR - 0.01 || now === POSTER ? 0 : now));
playBtn.addEventListener('click', () => (playing ? pause() : play(now >= DUR - 0.01 ? 0 : now)));
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.setAttribute('aria-pressed', String(soundOn)); soundLabel.textContent = soundOn ? 'Sound on' : 'Sound off';
  bigLabel.textContent = soundOn ? 'Play with sound' : 'Play';
  if (playing) play(now);
});
scrub.addEventListener('input', () => { if (playing) pause(); show(+scrub.value); });
stage.addEventListener('keydown', ev => { if (ev.key === ' ' && ev.target === stage) { ev.preventDefault(); playing ? pause() : play(now); } });
window.addEventListener('resize', () => { fitQuality(); if (!playing) show(now); });

GZ.ready.then(() => { fitQuality(); show(now); });
})();
