<title>GZ2H Phosphor</title>
<style>
/* Layout: the scope screen is the page's one object; transport and the four scenes sit under it like a front panel */
:root {
  --ink: #070304;
  --panel: #120708;
  --line: #2a1013;
  --phosphor: #ff4a3a;
  --core: #ffe3dc;
  --text: #f3e6e3;
  --muted: #a2898b;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--text); }
body { font-family: var(--display); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 28px 56px; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
h1 span { font-family: var(--mono); font-weight: 400; font-size: 0.62em; letter-spacing: 0.14em; color: var(--phosphor); text-transform: uppercase; margin-left: 10px; vertical-align: 0.18em; }
.meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 1px #1c0b0d, 0 40px 90px -40px rgba(255, 60, 40, 0.35); }
.stage canvas { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; border: 0; padding: 0; cursor: pointer; color: var(--text); background: radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.55)); }
.overlay[hidden] { display: none !important; }
.pill { display: inline-flex; align-items: center; gap: 14px; padding: 12px 22px 12px 12px; border-radius: 999px; background: rgba(7, 3, 4, 0.8); border: 1px solid rgba(255, 74, 58, 0.35); font: 700 14px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; transition: transform 0.2s ease, border-color 0.2s ease; }
.overlay:hover .pill, .overlay:focus-visible .pill { transform: scale(1.04); border-color: rgba(255, 74, 58, 0.8); }
.overlay:focus-visible { outline: none; }
.overlay:focus-visible .pill { outline: 2px solid var(--phosphor); outline-offset: 3px; }
.disc { width: 46px; height: 46px; border-radius: 50%; background: var(--phosphor); display: grid; place-items: center; box-shadow: 0 0 22px rgba(255, 74, 58, 0.6); }
.disc svg { width: 18px; height: 18px; margin-left: 3px; fill: #1a0405; }
.transport { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.tbtn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 700 12px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
.tbtn:hover { border-color: #4a1a1f; }
.tbtn:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 2px; }
.tbtn svg { width: 14px; height: 14px; fill: currentColor; }
.tbtn[aria-pressed="false"] { color: var(--muted); }
.track { position: relative; flex: 1 1 260px; min-width: 0; height: 38px; display: flex; align-items: center; }
.ticks { position: absolute; inset: 0; pointer-events: none; }
.ticks i { position: absolute; top: 6px; width: 1px; height: 7px; background: var(--muted); opacity: 0.6; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 38px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--phosphor) var(--p, 0%), var(--line) var(--p, 0%)); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line); }
input[type="range"]::-moz-range-progress { height: 3px; background: var(--phosphor); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--core); border: 0; box-shadow: 0 0 10px rgba(255, 74, 58, 0.8); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--core); border: 0; }
input[type="range"]:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 2px; }
.tc { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tc b { color: var(--text); font-weight: 400; }
.scenes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.scene { position: relative; display: grid; gap: 6px; align-content: start; text-align: left; padding: 14px 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; overflow: hidden; min-width: 0; }
.scene:hover { border-color: #4a1a1f; }
.scene:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 2px; }
.scene .st { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
.scene .sn { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.scene .sd { font-size: 13.5px; line-height: 1.45; color: var(--muted); }
.scene .fill { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--phosphor); box-shadow: 0 0 8px var(--phosphor); }
.scene.on { border-color: rgba(255, 74, 58, 0.55); }
.scene.on .st { color: var(--phosphor); }
body.render { margin: 0; overflow: hidden; background: #000; }
body.render .wrap > *:not(.stage) { display: none !important; }
body.render .wrap { padding: 0; max-width: none; display: block; }
body.render .stage { width: 1920px; height: 1080px; box-shadow: none; border-radius: 0; }
body.render .overlay { display: none !important; }
@media (prefers-reduced-motion: reduce) { .pill, .overlay:hover .pill { transition: none; transform: none; } }

<script>
(() => {
'use strict';

// ───────────────────────── math ─────────────────────────
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const sstep = (a, b, x) => { const t = inv(a, b, x); return t * t * (3 - 2 * t); };
const eOut3 = t => 1 - (1 - t) ** 3;
const eIn3 = t => t * t * t;
const eIO3 = t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
const mulberry = a => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const TAU = Math.PI * 2;

// ───────────────────────── timeline (seconds) ─────────────────────────
const DUR = 8.0;
const T = {
  on: 0.05, plug: 0.62, pluck: 0.95,
  arp: [1.38, 1.50, 1.62, 1.74, 1.86],
  strum: 2.12, xy: 2.17,
  beats: [2.72, 2.97, 3.22, 3.47],
  logo: 3.86, logoIn: 4.32,
  wm0: 5.06, wm: 5.58, url: 5.80,
  off: 7.30,
};
const SCENES = [
  { t: 0.00, end: 0.95, name: 'Flatline', desc: 'The CRT warms up, a cable clicks in, and the trace sits at zero volts.' },
  { t: 0.95, end: 2.12, name: 'Open strings', desc: 'A low E, then A D G B E. Each string adds its own wave to the trace.' },
  { t: 2.12, end: 3.86, name: 'Intervals', desc: 'The power chord flips the scope to X-Y. A fifth, octave, fourth and third draw their shapes, then unison settles into a circle.' },
  { t: 3.86, end: 8.00, name: 'Zero2Hero', desc: 'The zero bursts into the logo, the logo flows into the wordmark, and the tube switches off.' },
];

// ───────────────────────── screen geometry ─────────────────────────
const W = 1920, H = 1080, CX = 960, CY = 520;
const GR = { x0: 160, x1: 1760, y0: 90, y1: 990, div: 100 };
const NOTES = [
  { t: T.pluck, f: 82.41, A: 1.0, p: 0.2, n: 'E2' },
  { t: T.arp[0], f: 110.0, A: 0.62, p: 0.17, n: 'A2' },
  { t: T.arp[1], f: 146.83, A: 0.55, p: 0.16, n: 'D3' },
  { t: T.arp[2], f: 196.0, A: 0.5, p: 0.15, n: 'G3' },
  { t: T.arp[3], f: 246.94, A: 0.45, p: 0.14, n: 'B3' },
  { t: T.arp[4], f: 329.63, A: 0.42, p: 0.13, n: 'E4' },
];
const XY = [
  { t: T.strum, a: 2, b: 3, name: 'PERFECT FIFTH', r: '3:2', x: 'E2', fx: 82.41, y: 'B2', fy: 123.47 },
  { t: T.beats[0], a: 1, b: 2, name: 'OCTAVE', r: '2:1', x: 'E2', fx: 82.41, y: 'E3', fy: 164.81 },
  { t: T.beats[1], a: 3, b: 4, name: 'PERFECT FOURTH', r: '4:3', x: 'E2', fx: 82.41, y: 'A2', fy: 110.0 },
  { t: T.beats[2], a: 4, b: 5, name: 'MAJOR THIRD', r: '5:4', x: 'E2', fx: 82.41, y: 'G#2', fy: 103.83 },
  { t: T.beats[3], a: 1, b: 1, name: 'UNISON', r: '1:1', x: 'E2', fx: 82.41, y: 'E2', fy: 82.41 },
];
const HUM_HZ = 41.2;   // the logo is traced 41.2 times a second: an E1

// beam shapes (screen px): x, y, visibility of the segment that ends at this point
const NB = SHAPES.N;
const toBeam = arr => { const o = new Float32Array(NB * 3); for (let i = 0; i < NB; i++) { o[i * 3] = arr[i * 3]; o[i * 3 + 1] = arr[i * 3 + 1]; o[i * 3 + 2] = 1 - arr[i * 3 + 2]; } return o; };
const LOGO_B = toBeam(SHAPES.logo), WM_B = toBeam(SHAPES.wm);
const BUF = [0, 1, 2, 3, 4].map(() => new Float32Array(NB * 3));

// ───────────────────────── canvases ─────────────────────────
const out = document.getElementById('c');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
let Q = 1, CW = 1920, CH = 1080;
let sC, s, eC, e, b1C, b1, b2C, b2;
function setQuality(q) {
  Q = q; CW = Math.round(W * q); CH = Math.round(H * q);
  out.width = CW; out.height = CH;
  sC = mk(CW, CH); s = sC.getContext('2d');
  eC = mk(CW, CH); e = eC.getContext('2d');
  b1C = mk(Math.ceil(CW / 4), Math.ceil(CH / 4)); b1 = b1C.getContext('2d');
  b2C = mk(Math.ceil(CW / 8), Math.ceil(CH / 8)); b2 = b2C.getContext('2d');
  if (gl) gl.viewport(0, 0, CW, CH);
}

// ───────────────────────── CRT shader ─────────────────────────
const VS = 'attribute vec2 p; varying vec2 vUv; void main(){ vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }';
const FS = `precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime, uCurve, uCA, uScan, uBright, uNoise, uSx, uSy, uLine, uGlitch, uGlass;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
  vec2 p = vUv * 2.0 - 1.0;
  vec2 c = p * (1.0 + uCurve * vec2(p.y * p.y * 0.55, p.x * p.x * 0.9));
  float tear = uGlitch * (hash(vec2(floor(vUv.y * 54.0), floor(uTime * 60.0))) - 0.5) * step(0.72, hash(vec2(floor(vUv.y * 18.0), floor(uTime * 30.0) + 3.0)));
  vec2 q = vec2((c.x + tear * 0.12) / max(uSx, 0.0001), c.y / max(uSy, 0.0001));
  vec2 uv = q * 0.5 + 0.5;
  float inside = step(abs(q.x), 1.0) * step(abs(q.y), 1.0);
  vec2 dir = c * (uCA + uGlitch * 0.004);
  vec3 col;
  col.r = texture2D(uTex, uv + dir).r;
  col.g = texture2D(uTex, uv).g;
  col.b = texture2D(uTex, uv - dir).b;
  col *= inside;
  float sl = 0.5 + 0.5 * cos(vUv.y * uRes.y * 3.14159265 / 1.5);
  col *= mix(1.0, 0.68 + 0.32 * sl, uScan);
  // the beam line / dot seen while the tube powers on and off
  float ly = c.y / (uSy * 0.3 + 0.0022);
  float lx = smoothstep(1.0, 0.92, abs(c.x) / max(uSx, 0.0025));
  col += uLine * exp(-ly * ly) * lx * vec3(1.0, 0.72, 0.66);
  vec2 cd = c * vec2(1.0, uRes.y / uRes.x);
  col += uLine * (0.5 * exp(-dot(cd, cd) / 0.0012) + 1.4 * exp(-dot(cd, cd) / 0.00006)) * vec3(1.0, 0.35, 0.28) * step(uSx, 0.05);
  // tube edge, corners, vignette, glass
  vec2 a = abs(c);
  float r = 0.07;
  float corner = length(max(a - vec2(1.0 - r), 0.0)) / r;
  float mask = smoothstep(1.0, 0.86, corner) * smoothstep(1.005, 0.975, max(a.x, a.y));
  col *= mask;
  col *= 1.0 - 0.32 * dot(p * 0.8, p * 0.8);
  col *= uBright;
  col += (hash(vUv * uRes + fract(uTime * 7.31)) - 0.5) * uNoise * mask;
  col += uGlass * (vec3(1.0, 0.86, 0.84) * 0.03 * smoothstep(0.85, 0.0, length(p - vec2(-0.55, 0.62))) + vec3(0.05, 0.012, 0.014)) * mask;
  gl_FragColor = vec4(col, 1.0);
}`;
let gl = null, U = {}, tex = null, out2d = null;
(function initGL() {
  try { gl = out.getContext('webgl', { preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false }); } catch (err) { gl = null; }
  if (!gl) { out2d = out.getContext('2d'); return; }
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
  const bu = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bu); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uTex', 'uRes', 'uTime', 'uCurve', 'uCA', 'uScan', 'uBright', 'uNoise', 'uSx', 'uSy', 'uLine', 'uGlitch', 'uGlass']) U[n] = gl.getUniformLocation(pr, n);
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
})();

// ───────────────────────── fonts ─────────────────────────
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0)).buffer;
const ready = (async () => {
  const faces = [
    new FontFace('Space Grotesk', b64(FONTS.sg), { weight: '300 700' }),
    new FontFace('Space Mono', b64(FONTS.sm4), { weight: '400' }),
    new FontFace('Space Mono', b64(FONTS.sm7), { weight: '700' }),
  ];
  for (const f of faces) { await f.load(); document.fonts.add(f); }
})();

// ───────────────────────── signals ─────────────────────────
function noteAmp(N, t) { const d = t - N.t; return d < 0 ? 0 : N.A * Math.min(1, d / 0.004) * Math.exp(-d / 1.6); }
// the voltage CH1 sees, tau seconds into a triggered sweep at time t
function sig(t, tau) {
  let v = 0;
  for (const N of NOTES) {
    const a = noteAmp(N, t); if (a < 0.002) continue;
    const drift = N.f * t * 0.0025;
    for (let n = 1; n <= 7; n++) v += a * Math.sin(n * Math.PI * N.p) / Math.pow(n, 1.45) * Math.exp(-(t - N.t) * n * 0.45) * Math.sin(TAU * (n * N.f * tau + drift * n) + n * 1.3);
  }
  const hd = t - T.plug;
  if (hd > 0 && hd < 0.5) { const ha = 1.1 * Math.exp(-hd / 0.09); v += ha * (Math.sin(TAU * 60 * tau) + 0.55 * Math.sin(TAU * 120 * tau + 1) + 0.4 * Math.sin(TAU * 180 * tau + 2)) + ha * 0.35 * (hash(tau * 9100 + t * 13) - 0.5); }
  const sd = t - (T.strum - 0.035);
  if (sd > 0) { const sa = 3.2 * Math.min(1, sd / 0.03); for (const f of [82.41, 123.47, 164.81]) v += sa * Math.sin(TAU * f * tau + f); }
  return v;
}
const YT_N = 1100;
const YT = new Float32Array(YT_N * 3), YT2 = new Float32Array(YT_N * 3);
function ytTrace(t, o) {
  const over = t > T.strum - 0.035;
  for (let i = 0; i < YT_N; i++) {
    const x = GR.x0 + (GR.x1 - GR.x0) * i / (YT_N - 1), tau = (i / (YT_N - 1)) * 0.032;
    const v = sig(t, tau) + 0.012 * (hash(i * 3.7 + Math.floor(t * 60) * 0.37) - 0.5);
    const y = CY - (over ? 330 * Math.tanh(1.6 * v) : 290 * Math.tanh(0.9 * v));
    o[i * 3] = x; o[i * 3 + 1] = y; o[i * 3 + 2] = i ? 1 : 0;
  }
  return o;
}
function liss(a, b, phi, R, o, cx = CX, cy = CY) {
  for (let i = 0; i < NB; i++) { const th = TAU * i / (NB - 1); o[i * 3] = cx + R * Math.sin(a * th + phi); o[i * 3 + 1] = cy - R * Math.sin(b * th); o[i * 3 + 2] = i ? 1 : 0; }
  return o;
}
function mix(A, B, m, o, visPow = 1) {
  const mv = Math.pow(m, visPow);
  for (let i = 0; i < NB * 3; i += 3) { o[i] = A[i] + (B[i] - A[i]) * m; o[i + 1] = A[i + 1] + (B[i + 1] - A[i + 1]) * m; o[i + 2] = A[i + 2] + (B[i + 2] - A[i + 2]) * mv; }
  return o;
}
const xyStage = t => { let k = 0; for (let i = 0; i < XY.length; i++) if (t >= XY[i].t) k = i; return k; };
const xyPhi = (t, k) => (k < 4 ? 0.4 + 1.15 * (t - T.strum) : Math.PI / 2 + (0.18 - Math.PI / 2) * Math.exp(-(t - XY[4].t) / 0.16));
const xyR = t => { let r = 330; for (const b of T.beats) { const d = t - b; if (d > 0) r *= 1 + 0.07 * Math.exp(-d / 0.08); } return r - 46 * sstep(3.62, T.logo, t); };
function figure(t, o) {
  const k = xyStage(t), X = XY[k], R = xyR(t);

  const F = { E1: 41.2, E2: 82.41, G2: 98.0, A2: 110.0, B2: 123.47, D3: 146.83, E3: 164.81, G3: 196.0, A3: 220.0, B3: 246.94, E4: 329.63, Gs4: 415.3, B4: 493.88, E5: 659.26, E6: 1318.5 };

  });
  const env = (node, time, peak, dur, att = 0.003) => { node.gain.setValueAtTime(0.0001, at(time)); node.gain.exponentialRampToValueAtTime(peak, at(time + att)); node.gain.exponentialRampToValueAtTime(0.0001, at(time + dur)); };

  };
  const kick = (time, g = 1) => { osc('sine', 155, 45, time, 0.5, g, master, 0.004); noise(time, 0.02, 0.3 * g, [bq('highpass', 1800)]); };

  const boom = (time, g = 1) => osc('sine', 62, 31, time, 1.7, 0.9 * g, master, 0.01);
  const tom = (time, f, g = 1) => { const a = osc('sine', f * 1.7, f, time, 0.38, 0.75 * g, master, 0.004); if (a) send(a, 0.3); };
  const click = (time, g = 1) => { noise(time, 0.012, 0.5 * g, [bq('highpass', 2500)], master, 0.0005); osc('square', 2200, 2200, time, 0.008, 0.05 * g, master, 0.0005); };

  // ── score ──
  // tube warms up: thump, degauss wobble, faint line whine, static

  if (live(T.on)) { const o = ac.createOscillator(), lfo = ac.createOscillator(), lg = G(0.5), a = G(0); o.type = 'sawtooth'; o.frequency.value = 50; lfo.frequency.value = 9; lfo.connect(lg).connect(a.gain); const lp = bq('lowpass', 420); o.connect(lp).connect(a); a.connect(master); a.gain.setValueAtTime(0.0001, at(T.on)); a.gain.linearRampToValueAtTime(0.06, at(T.on + 0.03)); a.gain.exponentialRampToValueAtTime(0.0001, at(T.on + 0.8)); o.start(at(T.on)); lfo.start(at(T.on)); o.stop(at(T.on + 0.85)); lfo.stop(at(T.on + 0.85)); }
  osc('sine', 7800, 7800, T.on + 0.1, 1.6, 0.006, panTo(0.3, master), 0.2);
  noise(T.on + 0.02, 0.16, 0.12, [bq('highpass', 3000)]);
  // cable plugged in: pop, ground hum, settle to silence (zero)
  noise(T.plug, 0.03, 0.3, [bq('lowpass', 900)], master, 0.001);
  if (live(T.plug)) { const o = ac.createOscillator(), a = G(0); o.type = 'sawtooth'; o.frequency.value = 60; o.connect(bq('lowpass', 1100)).connect(a); a.connect(master); env(a, T.plug, 0.07, 0.42, 0.004); o.start(at(T.plug)); o.stop(at(T.plug + 0.45)); }
  click(0.42, 0.4);
  // the open strings
  cleanNote(T.pluck, F.E2, 0.95, -0.25, 3.6);
  ['A2', 'D3', 'G3', 'B3', 'E4'].forEach((n, i) => cleanNote(T.arp[i], F[n], 0.82, -0.15 + i * 0.11, 3.0));
  swell(1.86, T.strum - 0.005, 0.3, 3000, 9000, 0.7, 'highpass');
  // power chord: the scope flips to X-Y

  kick(T.strum, 0.75); boom(T.strum, 0.45); crash(T.strum, 0.8, 2.6); snare(T.strum, 0.5); click(T.xy, 0.9);
  XY.forEach((X, k) => {
    const end = k < 4 ? XY[k + 1].t : T.logo;

  });

  chug(T.beats[0], ['E2', 'B2', 'E3']); kick(T.beats[0], 0.55); click(T.beats[0], 0.5);
  chug(T.beats[1], ['A2', 'E3', 'A3']); snare(T.beats[1], 0.6); click(T.beats[1], 0.5);
  chug(T.beats[2], ['G2', 'D3', 'G3']); kick(T.beats[2], 0.55); click(T.beats[2], 0.5);
  chug(T.beats[3], ['E2', 'B2', 'E3']); snare(T.beats[3], 0.65); click(T.beats[3], 0.5);
  swell(3.47, T.logo - 0.005, 0.32, 600, 7000, 1.2);

  kick(T.logo, 0.8); boom(T.logo, 0.55); crash(T.logo, 0.75, 2.4); snare(T.logo, 0.4);
  if (live(T.logo)) { const sN = ac.createBufferSource(); sN.buffer = logoHumBuffer(ac); sN.loop = true; const a = G(0); sN.connect(bq('lowpass', 2600)).connect(a); a.connect(master); a.gain.setValueAtTime(0.0001, at(T.logo)); a.gain.exponentialRampToValueAtTime(0.06, at(T.logo + 0.05)); a.gain.setValueAtTime(0.06, at(T.wm0)); a.gain.exponentialRampToValueAtTime(0.0001, at(T.wm0 + 0.3)); sN.start(at(T.logo)); sN.stop(at(T.wm0 + 0.32)); }

function wavB64(buf) {

  const bytes = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const w = (o, str) => { for (let i = 0; i < str.length; i++) bytes.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); bytes.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt '); bytes.setUint32(16, 16, true); bytes.setUint16(20, 1, true); bytes.setUint16(22, ch, true);
  bytes.setUint32(24, sr, true); bytes.setUint32(28, sr * ch * 2, true); bytes.setUint16(32, ch * 2, true); bytes.setUint16(34, 16, true); w(36, 'data'); bytes.setUint32(40, n * ch * 2, true);
  const chans = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  let o = 44; for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { const v = clamp(chans[c][i] * gain, -1, 1); bytes.setInt16(o, v * 32767, true); o += 2; }

}

// ───────────────────────── boot ─────────────────────────
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
setQuality(1);

window.GZ = {
  DUR, ready,
  frame: t => render(t),
  // motion blur: n sub-frames across a 180° shutter, averaged; returns a PNG as base64
  capture(t, n = 1) {
    if (!this.acc) { this.acc = mk(CW, CH); this.ax = this.acc.getContext('2d'); }
    for (let i = 0; i < n; i++) { render(t + (n > 1 ? ((i + 0.5) / n - 0.5) / 120 : 0), Math.sqrt(n)); this.ax.globalAlpha = 1 / (i + 1); this.ax.drawImage(out, 0, 0); }
    return this.acc.toDataURL('image/png').split(',')[1];
  },
  async audio() { const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr); buildAudio(oc, 0, 0); const b = await oc.startRendering(); return wavB64(b); },
};
if (RENDER) return;

// ───────────────────────── player UI ─────────────────────────
const stage = document.getElementById('stage');
const big = document.getElementById('big'), bigLabel = document.getElementById('bigLabel');
const playBtn = document.getElementById('play'), playLabel = document.getElementById('playLabel'), playIcon = document.getElementById('playIcon');
const soundBtn = document.getElementById('sound'), soundLabel = document.getElementById('soundLabel');
const scrub = document.getElementById('scrub'), tcNow = document.getElementById('tcNow');
const scenesEl = document.getElementById('scenes'), ticks = document.getElementById('ticks');
const SOUND_FILE = 'gz2h-phosphor.mp3';
const POSTER = 4.6;
const ICON_PLAY = 'M3 1.8v12.4c0 .6.7 1 1.2.7l10-6.2c.5-.3.5-1.1 0-1.4l-10-6.2C3.7.8 3 1.2 3 1.8z';
const ICON_PAUSE = 'M3 2h3.4v12H3zM9.6 2H13v12H9.6z';

SCENES.forEach((sc, i) => {
  const b = document.createElement('button');
  b.className = 'scene'; b.type = 'button'; b.id = 'scene-' + i;
  b.innerHTML = `<span class="st">${String(i + 1).padStart(2, '0')} · ${sc.t.toFixed(2)} s</span><span class="sn">${sc.name}</span><span class="sd">${sc.desc}</span><span class="fill"></span>`;
  b.addEventListener('click', () => play(sc.t));
  scenesEl.appendChild(b);
  if (i) { const tk = document.createElement('i'); tk.style.left = `calc(${(sc.t / DUR) * 100}% + ${7 - 14 * sc.t / DUR}px)`; ticks.appendChild(tk); }
});

let now = POSTER, playing = false, soundOn = true, ac = null, t0 = 0, perf0 = 0, raf = 0, slow = 0;
function fitQuality() {
  const want = clamp(stage.clientWidth * Math.min(2, window.devicePixelRatio || 1) / W, 0.4, 1);
  const q = Math.round(want * 20) / 20;
  if (Math.abs(q - Q) > 0.049) { setQuality(q); BG = null; }
}
function show(t) {
  now = t; render(t);
  scrub.value = t.toFixed(3); scrub.style.setProperty('--p', (t / DUR * 100) + '%');
  tcNow.textContent = t.toFixed(2);
  SCENES.forEach((sc, i) => {
    const el = scenesEl.children[i], on = t >= sc.t && t < sc.end;
    el.classList.toggle('on', on);
    el.querySelector('.fill').style.width = (clamp((t - sc.t) / (sc.end - sc.t)) * 100) + '%';
  });
}
// Sound comes from a pre-rendered soundtrack file played through an <audio> element, which the
// iPhone silent switch does not mute (Web Audio is muted by it). Live synthesis is the fallback.
const snd = new Audio(); snd.preload = 'auto'; snd.src = SOUND_FILE;
let fileOK = true, mode = 'none', synthFrom = 0;

snd.addEventListener('playing', () => { if (mode === 'file' && ac) { ac.close().catch(() => {}); ac = null; } });

function noSound() { mode = 'none'; soundLabel.textContent = 'No sound'; }

  if (!ac) return noSound();
  try {
    synthFrom = clamp((performance.now() - perf0) / 1000, 0, DUR);
    if (ac.resume) ac.resume();
    t0 = ac.currentTime + 0.15; buildAudio(ac, t0, synthFrom); mode = 'synth';
  } catch (err) { noSound(); }
}
function setPlayingUI(p) {
  playing = p;
  playLabel.textContent = p ? 'Pause' : (now >= DUR - 0.01 ? 'Replay' : 'Play');
  playIcon.firstElementChild.setAttribute('d', p ? ICON_PAUSE : ICON_PLAY);
  big.hidden = p;
}
function play(from = 0) {
  if (from >= DUR - 0.05) from = 0;
  stopAudio(); cancelAnimationFrame(raf);
  perf0 = performance.now() - from * 1000;
  const startedAt = performance.now();
  if (soundOn) {
    soundLabel.textContent = 'Sound on';
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (err) {}
    // unlock a context inside this tap, in case the file can't play and we fall back to synthesis
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.resume) ac.resume(); } catch (err) { ac = null; }
    if (fileOK) {
      mode = 'file';
      try { snd.currentTime = from; } catch (err) {}
      const p = snd.play();
      if (p && p.catch) p.catch(() => { if (mode === 'file') startSynth(); });
    } else startSynth();
  }
  slow = 0;
  setPlayingUI(true);
  const tick = () => {
    let t;
    if (mode === 'file') {
      if (snd.ended) t = DUR;
      else if (!snd.paused && snd.readyState >= 3) { t = snd.currentTime; perf0 = performance.now() - t * 1000; }
      else if (performance.now() - startedAt < 1500) { t = from; perf0 = performance.now() - from * 1000; }
      else { startSynth(); t = (performance.now() - perf0) / 1000; }
    } else if (mode === 'synth' && ac) t = ac.currentTime - t0 + synthFrom - (ac.outputLatency || 0);

    const f0 = performance.now();
    show(clamp(t, 0, DUR));
    if (performance.now() - f0 > 26 && ++slow > 20 && Q > 0.5) { setQuality(Math.max(0.5, Q - 0.2)); BG = null;  slow = 0; }
    if (t >= DUR) { setPlayingUI(false); show(6.6); now = DUR; playLabel.textContent = 'Replay'; bigLabel.textContent = 'Replay with sound'; big.hidden = false; stopAudio(); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
GZ.player = { snd, get mode() { return mode; } };
function pause() { cancelAnimationFrame(raf); stopAudio(); setPlayingUI(false); }

big.addEventListener('click', () => play(now >= DUR - 0.01 || now === POSTER ? 0 : now));
playBtn.addEventListener('click', () => (playing ? pause() : play(now >= DUR - 0.01 ? 0 : now)));
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.setAttribute('aria-pressed', String(soundOn)); soundLabel.textContent = soundOn ? 'Sound on' : 'Sound off';
  bigLabel.textContent = soundOn ? 'Play with sound' : 'Play';
  if (playing) play(now);
});
scrub.addEventListener('input', () => { if (playing) pause(); show(+scrub.value); });
window.addEventListener('resize', () => { fitQuality(); if (!playing) show(now); });

ready.then(() => { fitQuality(); show(now); });
})();
</script>
