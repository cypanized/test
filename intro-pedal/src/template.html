<title>GZ2H Pedalboard</title>
<style>
/* Layout: one big stage like a product monitor; under it a brushed-metal transport rail and five scene plates */
:root {
  --ink: #0b0a0a;
  --panel: #141312;
  --panel-2: #1b1a18;
  --hair: rgba(236, 228, 212, 0.13);

}

body { font-family: var(--display); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 28px 56px; display: grid; gap: 18px; }

.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; border-radius: 4px; box-shadow: 0 0 0 1px #24211f, 0 1px 0 1px rgba(255, 255, 255, 0.05), 0 40px 90px -40px rgba(208, 24, 43, 0.28); }

.overlay:hover .stomp, .overlay:focus-visible .stomp { transform: translateY(1px) scale(1.03); border-color: rgba(236,228,212,0.45); }

<script>
(() => {
'use strict';

// ───────────────────────── math ─────────────────────────
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const sstep = (a, b, x) => { const t = inv(a, b, x); return t * t * (3 - 2 * t); };
const eOut2 = t => 1 - (1 - t) ** 2, eOut3 = t => 1 - (1 - t) ** 3, eIn2 = t => t * t, eIn3 = t => t * t * t;
const eIO2 = t => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
const eIO3 = t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const vnoise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
const mulberry = a => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const refl = (v, n) => { const d = 2 * dot(n, v); return [d * n[0] - v[0], d * n[1] - v[1], d * n[2] - v[2]]; };
const decay = (t, t0, tau) => (t >= t0 ? Math.exp(-(t - t0) / tau) : 0);

// ───────────────────────── timeline (seconds) ─────────────────────────
const DUR = 8.0;
const T = {
  turn0: 0.46, turn1: 1.42,         // GAIN 0 → 10
  cut1: 1.62, contact: 1.80, lift: 1.95,
  cut2: 2.30, slam: 2.38, chug: [3.24, 3.385],
  cut3: 3.54, sweep1: 4.18, fb0: 4.10,
  whip0: 5.40, hit: 5.60, sweep2: 5.92, fade0: 7.55,
};
const SCENES = [
  { t: 0.00, end: T.cut1, name: 'Gain', desc: 'Amp hum in the dark. The GAIN knob clicks from 0 to 10, one detent at a time.' },
  { t: T.cut1, end: T.cut2, name: 'Stomp', desc: 'A boot hits the footswitch, the LED snaps on and the amp answers with a chord.' },
  { t: T.cut2, end: T.cut3, name: 'Peak', desc: 'Close on the VU meter. The needle slams into the red and the PEAK lamp fires.' },
  { t: T.cut3, end: T.whip0, name: 'Badge', desc: 'The amp front: woven grille cloth and the GZ2H logo as a chrome badge. Feedback rises.' },
  { t: T.whip0, end: DUR, name: 'Nameplate', desc: 'A whip up to the brushed-metal nameplate on the last chord, then a slow light sweep.' },
];

// GAIN knob: a smooth turn shaped into detents (it lingers in each notch and jumps between them)
const turnP = t => 10 * eIO2(inv(T.turn0, T.turn1, t));
const detentUnits = p => { const n = Math.min(9, Math.floor(p)), f = p - n; return n + f - 0.82 * Math.sin(TAU * f) / TAU; };
const DETENTS = [];   // times the knob seats in notches 1…10 (shared by picture and sound)
for (let n = 0; n < 10; n++) { let a = T.turn0, b = T.turn1; for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (turnP(m) < n + 0.66) a = m; else b = m; } DETENTS.push((a + b) / 2); }
const knobAngle = units => (-150 + 30 * units) * DEG;

// ───────────────────────── canvases ─────────────────────────
const W = 1920, H = 1080;
let out = document.getElementById('c');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; };
let Q = 1, CW = W, CH = H;
let sC, s, eC, e, fC, f, f2C, f2, d1C, d1, d2C, d2, b1C, b1, b2C, b2, mkC, mkx;
function setQuality(q) {
  Q = q; CW = Math.round(W * q); CH = Math.round(H * q);
  out.width = CW; out.height = CH;
  sC = mk(CW, CH); s = sC.getContext('2d');
  eC = mk(CW, CH); e = eC.getContext('2d');
  fC = mk(CW, CH); f = fC.getContext('2d');
  f2C = mk(CW, CH); f2 = f2C.getContext('2d');
  d1C = mk(Math.ceil(CW / 2), Math.ceil(CH / 2)); d1 = d1C.getContext('2d');
  d2C = mk(Math.ceil(CW / 5), Math.ceil(CH / 5)); d2 = d2C.getContext('2d');
  b1C = mk(Math.ceil(CW / 4), Math.ceil(CH / 4)); b1 = b1C.getContext('2d');
  b2C = mk(Math.ceil(CW / 10), Math.ceil(CH / 10)); b2 = b2C.getContext('2d');
  mkC = mk(Math.ceil(CW / 2), Math.ceil(CH / 2)); mkx = mkC.getContext('2d');
  if (gl) gl.viewport(0, 0, CW, CH);
}
const FILTER_OK = (() => { try { const x = mk(2, 2).getContext('2d'); x.filter = 'blur(2px)'; return x.filter === 'blur(2px)'; } catch (err) { return false; } })();
// blur src into a (smaller) canvas: ctx.filter where it exists, otherwise a downsample chain
const chainC = [mk(8, 8), mk(8, 8)];
function blurInto(dst, src, px) {
  const dc = dst.getContext('2d');
  dc.setTransform(1, 0, 0, 1, 0, 0); dc.globalCompositeOperation = 'source-over'; dc.globalAlpha = 1;
  dc.clearRect(0, 0, dst.width, dst.height);
  if (FILTER_OK) { dc.filter = `blur(${px}px)`; dc.drawImage(src, 0, 0, dst.width, dst.height); dc.filter = 'none'; return; }
  let cur = src, w = src.width, h = src.height, k = 0;
  const steps = Math.max(1, Math.round(Math.log2(Math.max(2, px * 2))));
  for (let i = 0; i < steps; i++) {
    w = Math.max(2, w >> 1); h = Math.max(2, h >> 1);
    const c = chainC[k]; if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    const x = c.getContext('2d'); x.clearRect(0, 0, w, h); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, w, h); cur = c; k ^= 1;
  }
  dc.imageSmoothingQuality = 'high'; dc.drawImage(cur, 0, 0, dst.width, dst.height);
}

// ───────────────────────── post shader (grade, lens, grain) ─────────────────────────
const VS = 'attribute vec2 p; varying vec2 vUv; void main(){ vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }';
const FS = `precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime, uGrain, uCA, uFade, uFlash, uVig;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
  vec2 p = vUv * 2.0 - 1.0;
  vec2 q = p * (1.0 - 0.012 * dot(p, p));
  vec2 uv = q * 0.5 + 0.5;
  vec2 dir = q * uCA;
  vec3 col;
  col.r = texture2D(uTex, uv + dir).r;
  col.g = texture2D(uTex, uv).g;
  col.b = texture2D(uTex, uv - dir * 0.8).b;
  // filmic shoulder, cool shadows, warm highlights
  float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(col * vec3(0.93, 0.97, 1.06), col * vec3(1.04, 1.0, 0.95), smoothstep(0.05, 0.6, l));
  col += uFlash * vec3(1.0, 0.55, 0.45) * (0.4 + 0.6 * l);
  col = col / (1.0 + 0.12 * col);
  col = pow(max(col, 0.0), vec3(1.04));
  vec2 vp = p * vec2(1.0, 0.82);
  col *= mix(1.0, smoothstep(1.55, 0.35, length(vp)), uVig);
  float g = hash(vUv * uRes + fract(uTime * 13.17)) + hash(vUv * uRes * 1.37 + fract(uTime * 7.31)) - 1.0;
  col += g * uGrain * (0.35 + 0.65 * (1.0 - l));
  col *= uFade;
  gl_FragColor = vec4(col, 1.0);
}`;
let gl = null, U = {}, tex = null, out2d = null;
(function initGL() {
  try { gl = out.getContext('webgl', { preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false }); } catch (err) { gl = null; }
  if (!gl) { out2d = out.getContext('2d'); return; }
  try {
    const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
    const bu = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bu); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    for (const n of ['uTex', 'uRes', 'uTime', 'uGrain', 'uCA', 'uFade', 'uFlash', 'uVig']) U[n] = gl.getUniformLocation(pr, n);
    tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  } catch (err) { gl = null; out2d = null; }
  if (!gl) { const c2 = document.createElement('canvas'); c2.id = 'c'; c2.width = out.width; c2.height = out.height; c2.setAttribute('aria-label', out.getAttribute('aria-label')); out.replaceWith(c2); out = c2; out2d = c2.getContext('2d'); }
})();

// ───────────────────────── fonts & shapes ─────────────────────────
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0)).buffer;
const ready = (async () => {
  const faces = [
    new FontFace('Space Grotesk', b64(FONTS.sg), { weight: '300 700' }),
    new FontFace('Space Mono', b64(FONTS.sm4), { weight: '400' }),
    new FontFace('Space Mono', b64(FONTS.sm7), { weight: '700' }),
  ];
  for (const fc of faces) { await fc.load(); document.fonts.add(fc); }
})();
const LP = {}; for (const k in LOGO) LP[k] = new Path2D(LOGO[k]);
const LOGO_ORDER = ['G', 'horns', 'Z', 'thumb', 'two', 'wave', 'H', 'ok'];
const LOGO_ALL = new Path2D(); for (const k of LOGO_ORDER) LOGO_ALL.addPath(LP[k]);
const LOGO_BB = [58, 51, 3165, 1274], LOGO_C = [1611.5, 662.5], LOGO_W = 3107;
const WMG = WORDMARK.glyphs.map(g => ({ ...g, p: new Path2D(g.d) }));
const WM_INK = WORDMARK.ink;   // cap = 100 units, baseline y = 0
function fillLogo(c, color) { c.fillStyle = color; for (const k of LOGO_ORDER) c.fill(LP[k], 'evenodd'); }

  mix.kick(T.hit, 0.62); mix.boom(T.hit, 0.45);
  mix.cleanNote(T.hit + 0.05, F.E4, 0.2, 0.5, 3.6); mix.cleanNote(T.hit + 0.11, F.B4, 0.18, -0.5, 3.6);
  noise(T.hit + 0.002, 0.03, 0.3, [bq('highpass', 2500)], master, 0.0005);
}

// ───────────────────────── boot ─────────────────────────
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
setQuality(1);

window.GZ = {
  DUR, ready,
  frame: t => render(t),
  // motion blur: n sub-frames across a 180° shutter, averaged; returns a PNG as base64.
  // All sub-frames share one grain pattern, and the video carries lighter grain than live playback (H.264 budget).
  capture(t, n = 1) {
    const cv = out;
    if (!this.acc || this.acc.width !== cv.width) { this.acc = mk(cv.width, cv.height); this.ax = this.acc.getContext('2d'); }
    for (let i = 0; i < n; i++) { render(t + (n > 1 ? ((i + 0.5) / n - 0.5) / 120 : 0), 0.4, t); this.ax.globalAlpha = 1 / (i + 1); this.ax.drawImage(cv, 0, 0); }
    this.ax.globalAlpha = 1;
    return this.acc.toDataURL('image/png').split(',')[1];
  },
  async audio() { const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr); buildAudio(oc, 0, 0); const b = await oc.startRendering(); return gzWavB64(b); },
};
if (RENDER) return;

// ───────────────────────── player UI ─────────────────────────
const stage = document.getElementById('stage');
const big = document.getElementById('big'), bigLabel = document.getElementById('bigLabel');
const playBtn = document.getElementById('play'), playLabel = document.getElementById('playLabel'), playIcon = document.getElementById('playIcon');
const soundBtn = document.getElementById('sound'), soundLabel = document.getElementById('soundLabel');
const scrub = document.getElementById('scrub'), tcNow = document.getElementById('tcNow');
const scenesEl = document.getElementById('scenes'), ticks = document.getElementById('ticks');
const SOUND_FILE = 'gz2h-pedal.mp3';
const POSTER = 6.9;
const ICON_PLAY = 'M3 1.8v12.4c0 .6.7 1 1.2.7l10-6.2c.5-.3.5-1.1 0-1.4l-10-6.2C3.7.8 3 1.2 3 1.8z';
const ICON_PAUSE = 'M3 2h3.4v12H3zM9.6 2H13v12H9.6z';

SCENES.forEach((sc, i) => {
  const b = document.createElement('button');
  b.className = 'scene'; b.type = 'button'; b.id = 'scene-' + i;
  b.innerHTML = `<span class="st">${String(i + 1).padStart(2, '0')} · ${sc.t.toFixed(2)} s</span><span class="sn">${sc.name}</span><span class="sd">${sc.desc}</span><span class="fill"></span>`;
  b.addEventListener('click', () => play(sc.t));
  scenesEl.appendChild(b);
  if (i) { const tk = document.createElement('i'); tk.style.left = `calc(${(sc.t / DUR) * 100}% + ${8 - 16 * sc.t / DUR}px)`; ticks.appendChild(tk); }
});

let now = POSTER, playing = false, soundOn = true, ac = null, t0 = 0, perf0 = 0, raf = 0, slow = 0;
function fitQuality() {
  const want = clamp(stage.clientWidth * Math.min(2, window.devicePixelRatio || 1) / W, 0.4, 1);
  const q = Math.round(want * 20) / 20;
  if (Math.abs(q - Q) > 0.049) setQuality(q);
}
function show(t) {
  now = t; render(t);
  scrub.value = t.toFixed(3); scrub.style.setProperty('--p', (t / DUR * 100) + '%');
  tcNow.textContent = t.toFixed(2);
  SCENES.forEach((sc, i) => {
    const el = scenesEl.children[i], on = t >= sc.t && t < sc.end;
    el.classList.toggle('on', on);
    el.querySelector('.fill').style.width = (clamp((t - sc.t) / (sc.end - sc.t)) * 100) + '%';
  });
}
// Sound comes from a pre-rendered soundtrack file played through an <audio> element, which the
// iPhone silent switch does not mute (Web Audio is muted by it). Live synthesis is the fallback.
const snd = new Audio(); snd.preload = 'auto'; snd.src = SOUND_FILE;
let fileOK = true, mode = 'none', synthFrom = 0;
snd.addEventListener('error', () => { fileOK = false; });
snd.addEventListener('playing', () => { if (mode === 'file' && ac) { ac.close().catch(() => {}); ac = null; } });
function stopAudio() { mode = 'none'; try { snd.pause(); } catch (err) {} if (ac) { ac.close().catch(() => {}); ac = null; } }
function noSound() { mode = 'none'; soundLabel.textContent = 'No sound'; }
function startSynth() {
  if (!ac) return noSound();
  try {
    synthFrom = clamp((performance.now() - perf0) / 1000, 0, DUR);
    if (ac.resume) ac.resume();
    t0 = ac.currentTime + 0.15; buildAudio(ac, t0, synthFrom); mode = 'synth';
  } catch (err) { noSound(); }
}
function setPlayingUI(p) {
  playing = p;
  playLabel.textContent = p ? 'Pause' : (now >= DUR - 0.01 ? 'Replay' : 'Play');
  playIcon.firstElementChild.setAttribute('d', p ? ICON_PAUSE : ICON_PLAY);
  big.hidden = p;
}
function play(from = 0) {
  if (from >= DUR - 0.05) from = 0;
  stopAudio(); cancelAnimationFrame(raf);
  perf0 = performance.now() - from * 1000;
  const startedAt = performance.now();
  if (soundOn) {
    soundLabel.textContent = 'Sound on';
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (err) {}
    // unlock a context inside this tap, in case the file can't play and we fall back to synthesis
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.resume) ac.resume(); } catch (err) { ac = null; }
    if (fileOK) {
      mode = 'file';
      try { snd.currentTime = from; } catch (err) {}
      const p = snd.play();
      if (p && p.catch) p.catch(() => { if (mode === 'file') startSynth(); });
    } else startSynth();
  }
  slow = 0;
  setPlayingUI(true);
  const tick = () => {
    let t;
    if (mode === 'file') {
      if (snd.ended) t = DUR;
      else if (!snd.paused && snd.readyState >= 3) { t = snd.currentTime; perf0 = performance.now() - t * 1000; }
      else if (performance.now() - startedAt < 1500) { t = from; perf0 = performance.now() - from * 1000; }
      else { startSynth(); t = (performance.now() - perf0) / 1000; }
    } else if (mode === 'synth' && ac) t = ac.currentTime - t0 + synthFrom - (ac.outputLatency || 0);
    else t = (performance.now() - perf0) / 1000;
    const f0 = performance.now();
    show(clamp(t, 0, DUR));
    if (performance.now() - f0 > 26 && ++slow > 20 && Q > 0.5) { setQuality(Math.max(0.5, Q - 0.2)); slow = 0; }
    if (t >= DUR) { setPlayingUI(false); show(POSTER); now = DUR; playLabel.textContent = 'Replay'; bigLabel.textContent = 'Replay with sound'; big.hidden = false; stopAudio(); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
GZ.player = { snd, get mode() { return mode; } };
function pause() { cancelAnimationFrame(raf); stopAudio(); setPlayingUI(false); }

big.addEventListener('click', () => play(now >= DUR - 0.01 || now === POSTER ? 0 : now));
playBtn.addEventListener('click', () => (playing ? pause() : play(now >= DUR - 0.01 ? 0 : now)));
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.setAttribute('aria-pressed', String(soundOn)); soundLabel.textContent = soundOn ? 'Sound on' : 'Sound off';
  bigLabel.textContent = soundOn ? 'Play with sound' : 'Play';
  if (playing) play(now);
});
scrub.addEventListener('input', () => { if (playing) pause(); show(+scrub.value); });
window.addEventListener('resize', () => { fitQuality(); if (!playing) show(now); });

ready.then(() => { fitQuality(); show(now); });
})();
</script>
