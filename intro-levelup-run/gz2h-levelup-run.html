<title>GZ2H Level Up Run</title>
<style>
/* Layout: the game screen is the page's one object; the transport and four stage-select cards sit under it like a console menu */
:root {
  --ink: #13060c;
  --panel: #2d0c1d;
  --panel-hi: #43122b;
  --edge: #000000;
  --red: #b80016;
  --crimson: #4b0011;
  --gold: #ffc21a;
  --amber: #c46a00;
  --cream: #f7e6c4;
  --muted: #c2a596;
  --px: 4px;
  --pixel: "GZ2H Pixel", "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  --mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--cream); }
body { margin: 0; font-family: var(--mono); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 28px 56px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
h1 { margin: 0; font: 400 30px/1.1 var(--pixel); letter-spacing: 0; color: var(--cream); text-shadow: 3px 3px 0 var(--red); overflow-wrap: anywhere; }
h1 span { display: inline-block; margin-left: 12px; padding: 3px 8px 2px; font-size: 20px; color: #1a0a00; background: var(--gold); text-shadow: none; vertical-align: 4px; box-shadow: 0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); }
.meta { font: 400 20px/1.2 var(--pixel); color: var(--muted); }
/* chunky pixel frame: four offset shadows leave the corners notched */
.pxbox { box-shadow: 0 calc(-1 * var(--px)) 0 0 var(--edge), 0 var(--px) 0 0 var(--edge), calc(-1 * var(--px)) 0 0 0 var(--edge), var(--px) 0 0 0 var(--edge); }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; margin: var(--px); width: calc(100% - 2 * var(--px));
  box-shadow: 0 -6px 0 0 var(--edge), 0 6px 0 0 var(--edge), -6px 0 0 0 var(--edge), 6px 0 0 0 var(--edge), 0 -12px 0 0 var(--red), 0 12px 0 0 var(--red), -12px 0 0 0 var(--red), 12px 0 0 0 var(--red), -6px -6px 0 0 var(--red), 6px -6px 0 0 var(--red), -6px 6px 0 0 var(--red), 6px 6px 0 0 var(--red); }
.stage canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.stage-shell { padding: 12px; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; border: 0; padding: 0; cursor: pointer; color: var(--cream); background: rgba(19, 6, 12, 0.35); }
.overlay[hidden] { display: none !important; }
.pill { display: inline-flex; align-items: center; gap: 14px; padding: 14px 22px 12px 18px; background: var(--panel); font: 400 20px/1 var(--pixel); color: var(--cream);
  box-shadow: 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), inset 0 4px 0 0 var(--panel-hi), inset 0 -4px 0 0 var(--crimson); }
.pill .cur { color: var(--gold); }
.overlay:hover .pill, .overlay:focus-visible .pill { background: var(--red); }
.overlay:hover .pill .cur, .overlay:focus-visible .pill .cur { animation: nudge 0.5s steps(2) infinite; }
.overlay:focus-visible { outline: none; }
.overlay:focus-visible .pill { outline: 4px solid var(--gold); outline-offset: 6px; }
@keyframes nudge { 50% { transform: translateX(4px); } }
.transport { display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; padding: 4px; }
.tbtn { position: relative; display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 2px 14px 0 12px; margin: 4px; border: 0; background: var(--panel); color: var(--cream); font: 400 20px/1 var(--pixel); cursor: pointer;
  box-shadow: 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), inset 0 4px 0 0 var(--panel-hi), inset 0 -4px 0 0 var(--crimson); }
.tbtn:hover { background: var(--panel-hi); }
.tbtn:active { transform: translateY(2px); }
.tbtn:focus-visible { outline: 4px solid var(--gold); outline-offset: 6px; }
.tbtn svg { width: 16px; height: 16px; fill: currentColor; shape-rendering: crispEdges; }
.tbtn[aria-pressed="false"] { color: var(--muted); }
.track { position: relative; flex: 1 1 260px; min-width: 0; height: 40px; display: flex; align-items: center; }
.ticks { position: absolute; inset: 0; pointer-events: none; }
.ticks i { position: absolute; top: 4px; width: 4px; height: 8px; background: var(--cream); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 40px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 12px; background: repeating-linear-gradient(to right, transparent 0 10px, var(--edge) 10px 12px), linear-gradient(to right, var(--gold) var(--p, 0%), var(--panel) var(--p, 0%)); box-shadow: 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge); }
input[type="range"]::-moz-range-track { height: 12px; background: var(--panel); box-shadow: 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge); }
input[type="range"]::-moz-range-progress { height: 12px; background: var(--gold); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 24px; margin-top: -6px; border-radius: 0; background: var(--cream); border: 0; box-shadow: 0 0 0 4px var(--edge); }
input[type="range"]::-moz-range-thumb { width: 12px; height: 24px; border-radius: 0; background: var(--cream); border: 4px solid var(--edge); }
input[type="range"]:focus-visible { outline: 4px solid var(--gold); outline-offset: 4px; }
.tc { font: 400 20px/1 var(--pixel); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tc b { color: var(--cream); font-weight: 400; }
.scenes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; padding: 4px; }
@media (max-width: 760px) { .scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; } }
.scene { position: relative; display: grid; gap: 8px; align-content: start; text-align: left; padding: 14px 14px 20px; margin: 4px; border: 0; background: var(--panel); color: var(--cream); font: inherit; cursor: pointer; overflow: hidden; min-width: 0;
  box-shadow: 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), inset 0 4px 0 0 var(--panel-hi); }
.scene:hover { background: var(--panel-hi); }
.scene:focus-visible { outline: 4px solid var(--gold); outline-offset: 6px; }
.scene .st { font: 400 20px/1 var(--pixel); color: var(--muted); }
.scene .sn { font: 400 20px/1.2 var(--pixel); color: var(--cream); }
.scene .sn::before { content: "\25B6"; color: var(--panel-hi); margin-right: 8px; }
.scene .sd { font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.scene .fill { position: absolute; left: 0; bottom: 0; height: 8px; width: 0; background: repeating-linear-gradient(to right, var(--gold) 0 8px, var(--amber) 8px 10px); }
.scene.on { background: var(--crimson); }
.scene.on .st { color: var(--gold); }
.scene.on .sn::before, .scene:hover .sn::before, .scene:focus-visible .sn::before { color: var(--gold); }
body.render { margin: 0; overflow: hidden; background: #000; }
body.render .wrap > *:not(.stage-shell) { display: none !important; }
body.render .wrap, body.render .stage-shell { padding: 0; max-width: none; display: block; }
body.render .stage { width: 1920px; height: 1080px; margin: 0; box-shadow: none; }
body.render .overlay { display: none !important; }
@media (prefers-reduced-motion: reduce) { .overlay .pill .cur, .overlay:hover .pill .cur, .overlay:focus-visible .pill .cur { animation: none; } .tbtn:active { transform: none; } }
</style>

// GZ2H audio kit: synthesized guitar, amp rigs, drums and FX on Web Audio.
// Paste or inline into an intro page (it defines globals). Works in AudioContext and OfflineAudioContext.
//
//   const mix = gzMix(ac, t0, from, { fadeAt: 7.6, dur: 8 });
//   mix.cleanNote(0.95, mix.F.E2, 0.9, -0.2);                     // clean electric pluck
//   mix.strum([1.60, 1.61, 1.62], ['E2', 'B2', 'E3'], 3.4, 0.55);  // distorted power chord, double-tracked L/R
//   mix.kick(1.62, 0.75); mix.snare(2.0, 0.6); mix.crash(1.62, 0.8);
//
// Times are seconds on the intro's timeline. `from` lets playback start mid-timeline (events before it are skipped).
// Mix lessons from earlier intros: keep kick ≤ 0.75 and boom ≤ 0.55 or the sub-bass swamps the guitars;
// the clean bus at 0.24 sits under distorted hits; master them to about -14 LUFS.

const gzMulberry = a => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  ['E5', 'G#5', 'B5'].forEach((n, k) => note(P1, D50, hz(n), T.hero + 0.02 + k * S / 2, S / 2, { v: 12 }));
  note(P1, D50, hz('E6'), T.hero + 0.02 + 1.5 * S, 0.3, { v: 12, decay: 4, vib: 18, vibAt: 4 }); tri('E2', T.hero, 0.5);
  noise(T.arena + 0.2, T.map4 - T.arena, { buf: NZ.mid, v: 1, v1: 4, lp: 2400 });

  // ── map 4 ──
  stinger(T.map4, 3); hops(T.map4); groove(16, { kick: false });
  for (let s = 0; s < 16; s += 2) tri(s % 4 ? 'E3' : 'E2', b16(16, s), S * 1.5);

  // ── 6 · world 5, stadium: the shred, LV MAX, GUITAR GOD and the LEGENDARY AXE ──
  crash(T.stadium, 11, 1.2); groove(17, { sixteenths: true });
  [['C2', 'C3'], ['C2', 'C3'], ['C2', 'C3'], ['C2', 'C3'], ['D2', 'D3'], ['D2', 'D3'], ['D2', 'D3'], ['D2', 'D3']].forEach(([a, b], k) => { tri(a, b16(17, k * 2), S * 0.8); tri(b, b16(17, k * 2 + 1), S * 0.8); });
  [[2, ['C6', 'E6', 'G6']], [6, ['E6', 'G6', 'C7']], [10, ['D6', 'F#6', 'A6']], [14, ['F#6', 'A6', 'D7']]].forEach(([s, ch]) => ch.forEach((n, k) => note(P2, D12, hz(n), b16(17, s) + k * S / 3, S / 3, { v: 7 })));
  note(FX, D12, 196, b16(17, 8), S * 8 - 0.01, { v: 4, v1: 11, sweep: 1.55 });
  noise(T.stadium, BAR * 2, { buf: NZ.mid, v: 2, v1: 6, lp: 2600 });
  // the god moment
  kick(T.god); crash(T.god, 14, 1.4); noise(T.god, 0.3, { buf: NZ.low, v: 14, decay: 2 });
  BOLTS.forEach(tb => noise(tb, 0.16, { buf: NZ.hi, v: 13, decay: 2 }));
  ['E5', 'G#5', 'B5'].forEach((n, k) => { note(P1, D50, hz(n), T.god + k * S, S * 0.9, { v: 13 }); note(P2, D25, hz(['B4', 'E5', 'G#5'][k]), T.god + k * S, S * 0.9, { v: 10 }); });
  note(P1, D50, hz('E6'), T.god + 3 * S, S * 4.8, { v: 13, decay: 6, sus: 7, vib: 24, vibAt: 6 }); note(P2, D25, hz('B5'), T.god + 3 * S, S * 4.8, { v: 10, decay: 6, sus: 5 });
  note(FX, D12, hz('E6'), T.god, S * 7.5, { v: 6, decay: 10, arp: [0, 4, 7, 12] });
  tri('E2', T.god, S * 4); tri('B1', T.god + 4 * S, S * 3.5);
  for (let s = 8; s < 16; s++) { tri(s % 2 ? 'E3' : 'E2', b16(18, s), S * 0.8); hat(b16(18, s), s % 2 ? 3 : 5); }
  kick(b16(18, 8)); snare(b16(18, 10), 12); kick(b16(18, 12)); kick(b16(18, 13), 11); snare(b16(18, 14), 12); snare(b16(18, 15), 9);

  // ── 7 · the boss hit, the logo, the four hands ──
  note(P1, D50, hz('E6'), T.hit, 0.9, { v: 14, decay: 5, vib: 22, vibAt: 8 });
  note(FX, D25, hz('E5'), T.hit, 0.62, { v: 11, decay: 4, arp: [0, 4, 7] });
  note(KCK, TRIW, hz('E2'), T.hit, 0.36, { sweep: -0.55 });
  kick(T.hit); crash(T.hit, 13, 1.3); snare(T.hit, 9);
  ['B4', 'E5', 'G#5', 'B5', 'E6', 'D6', 'B5'].forEach((n, k) => note(P2, D25, hz(n), T.hit + (1 + k) * S, S * 0.8, { v: 8, decay: 2, sus: 4 }));
  for (const k of [2, 4, 6]) tri('E2', T.hit + k * S, S * 1.2);
  for (let k = 1; k < 8; k++) clack(T.hit + k * S, 3 + (k % 2));
  note(FX, D12, hz('E7'), T.shine, 0.12, { v: 6, decay: 1 });
  const stab = (t, top, mid, lo, bass, len, v = 12) => {
    note(P1, D50, hz(top), t, len, { v, decay: 3, sus: 6 }); note(P2, D25, hz(mid), t, len, { v: v - 2, decay: 3, sus: 5 });
    note(FX, D12, hz(lo), t, len, { v: v - 4, decay: 3, sus: 4 }); tri(bass, t, len);
  };
  const pop = t => note(FX, D50, 330, t + 0.005, 0.07, { v: 8, sweep: 4 });
  stab(T.hands[0], 'C6', 'G5', 'E5', 'C3', S * 1.6); pop(T.hands[0]); kick(T.hands[0]); snare(T.hands[0], 9);
  stab(T.hands[1], 'C6', 'G5', 'E5', 'C3', S * 1.6); pop(T.hands[1]); snare(T.hands[1], 10);
  stab(T.hands[2], 'D6', 'A5', 'F#5', 'D3', S * 1.6); pop(T.hands[2]); kick(T.hands[2]); snare(T.hands[2], 10);
  stab(T.hands[3], 'D6', 'A5', 'F#5', 'D3', S * 0.85); pop(T.hands[3]); snare(T.hands[3], 11);
  stab(T.hit + 15 * S, 'D6', 'A5', 'F#5', 'D3', S * 0.85, 13); snare(T.hit + 15 * S, 13);
  for (let k = 8; k < 16; k++) hat(T.hit + k * S, 3);

  // ── 8 · title fanfare in E ──
  const TT = T.title;
  [[0, 'E5', 'B4', 1], [1, 'G#5', 'E5', 1], [2, 'B5', 'G#5', 2]].forEach(([s, a, b, l]) => { note(P1, D50, hz(a), TT + s * S, l * S * 0.9, { v: 13, decay: 6, sus: 9 }); note(P2, D25, hz(b), TT + s * S, l * S * 0.9, { v: 10, decay: 6, sus: 7 }); });
  note(P1, D50, hz('E6'), TT + 4 * S, 1.25, { v: 13, decay: 6, sus: 0, vib: 24, vibAt: 9 });
  note(P2, D25, hz('B5'), TT + 4 * S, 1.15, { v: 10, decay: 7, sus: 0, vib: 16, vibAt: 12 });
  note(FX, D12, hz('E5'), TT + 4 * S, 1.9, { v: 7, decay: 15, arp: [0, 4, 7, 12] });
  tri('E2', TT, S * 1.8); tri('B1', TT + 2 * S, S * 1.8); tri('E2', TT + 4 * S, 0.5);
  kick(TT); crash(TT, 12, 1.4); snare(TT + 2 * S, 11); kick(TT + 4 * S); crash(TT + 4 * S, 9, 1.6); snare(TT + 4 * S, 9);
  for (let k = 0; k < 19; k++) note(FX, D12, 1050 + Math.floor(rnd(k, 31) * 4) * 90, T.url + k / 45, 0.018, { v: 3 });
  note(P2, D12, hz('B6'), T.press, 0.06, { v: 5 });
  note(P2, D12, hz('E7'), T.press + 0.06, 0.12, { v: 4, decay: 1 });
}

// ───────────────────────── boot ─────────────────────────
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0)).buffer;
const ready = (async () => {
  try {
    const faces = [new FontFace('GZ2H Pixel', b64(FONTS.px)), new FontFace('Space Mono', b64(FONTS.sm4), { weight: '400' })];
    for (const f of faces) { await f.load(); document.fonts.add(f); }
  } catch (err) { /* the canvas never needs these; only the page chrome does */ }
})();
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
setQuality(1);

window.GZ = {
  DUR, ready,
  frame: t => render(t),
  // pixel art: no motion blur by default (n = 1). n > 1 still averages sub-frames for anyone who wants it
  capture(t, n = 1) {
    if (n <= 1) { render(t); return out.toDataURL('image/png').split(',')[1]; }
    if (!this.acc) { this.acc = document.createElement('canvas'); this.acc.width = CW; this.acc.height = CH; this.ax = this.acc.getContext('2d'); }
    for (let i = 0; i < n; i++) { render(t + ((i + 0.5) / n - 0.5) / 120); this.ax.globalAlpha = 1 / (i + 1); this.ax.drawImage(out, 0, 0); }
    return this.acc.toDataURL('image/png').split(',')[1];
  },
  async audio() { const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr); buildAudio(oc, 0, 0); const b = await oc.startRendering(); return gzWavB64(b); },
};
if (RENDER) return;

// ───────────────────────── player UI ─────────────────────────
const stage = document.getElementById('stage');
const big = document.getElementById('big'), bigLabel = document.getElementById('bigLabel');
const playBtn = document.getElementById('play'), playLabel = document.getElementById('playLabel'), playIcon = document.getElementById('playIcon');
const soundBtn = document.getElementById('sound'), soundLabel = document.getElementById('soundLabel');
const scrub = document.getElementById('scrub'), tcNow = document.getElementById('tcNow');
const scenesEl = document.getElementById('scenes'), ticks = document.getElementById('ticks');
const SOUND_FILE = 'gz2h-levelup-run.mp3';
const POSTER = 21.2;
const ICON_PLAY = 'M3 1h3v2h2v2h2v2h2v2h-2v2H8v2H6v2H3z';
const ICON_PAUSE = 'M3 2h4v12H3zM9 2h4v12H9z';

SCENES.forEach((sc, i) => {
  const b = document.createElement('button');
  b.className = 'scene'; b.type = 'button'; b.id = 'scene-' + i;
  b.innerHTML = `<span class="st">${String(i + 1).padStart(2, '0')} · ${sc.t.toFixed(2)} s</span><span class="sn">${sc.name}</span><span class="sd">${sc.desc}</span><span class="fill"></span>`;
  b.addEventListener('click', () => play(sc.t));
  scenesEl.appendChild(b);
  if (i) { const tk = document.createElement('i'); tk.style.left = `calc(${(sc.t / DUR) * 100}% + ${6 - 12 * sc.t / DUR}px - 2px)`; ticks.appendChild(tk); }
});

let now = POSTER, playing = false, soundOn = true, ac = null, t0 = 0, perf0 = 0, raf = 0;
function fitQuality() {
  const want = clamp(stage.clientWidth * Math.min(2, window.devicePixelRatio || 1) / 1920, 0.17, 1);
  const q = Math.min(1, Math.ceil(want * 6) / 6);
  if (Math.abs(q - Q) > 0.01) setQuality(q);
}
function show(t) {
  now = t; render(t);
  scrub.value = t.toFixed(3); scrub.style.setProperty('--p', (t / DUR * 100) + '%');
  tcNow.textContent = t.toFixed(2);
  SCENES.forEach((sc, i) => {
    const el = scenesEl.children[i], on = t >= sc.t && t < sc.end;
    el.classList.toggle('on', on);
    el.querySelector('.fill').style.width = (clamp((t - sc.t) / (sc.end - sc.t)) * 100) + '%';
  });
}
// Sound comes from a pre-rendered soundtrack file played through an <audio> element, which the
// iPhone silent switch does not mute (Web Audio is muted by it). Live synthesis is the fallback.
const snd = new Audio(); snd.preload = 'auto'; snd.src = SOUND_FILE;
let fileOK = true, mode = 'none', synthFrom = 0;
snd.addEventListener('error', () => { fileOK = false; });
snd.addEventListener('playing', () => { if (mode === 'file' && ac) { ac.close().catch(() => {}); ac = null; } });
function stopAudio() { mode = 'none'; try { snd.pause(); } catch (err) {} if (ac) { ac.close().catch(() => {}); ac = null; } }
function noSound() { mode = 'none'; soundLabel.textContent = 'No sound'; }
function startSynth() {
  if (!ac) return noSound();
  try {
    synthFrom = clamp((performance.now() - perf0) / 1000, 0, DUR);
    if (ac.resume) ac.resume();
    t0 = ac.currentTime + 0.15; buildAudio(ac, t0, synthFrom); mode = 'synth';
  } catch (err) { noSound(); }
}
function setPlayingUI(p) {
  playing = p;
  playLabel.textContent = p ? 'Pause' : (now >= DUR - 0.01 ? 'Replay' : 'Play');
  playIcon.firstElementChild.setAttribute('d', p ? ICON_PAUSE : ICON_PLAY);
  big.hidden = p;
}
function play(from = 0) {
  if (from >= DUR - 0.05) from = 0;
  stopAudio(); cancelAnimationFrame(raf);
  perf0 = performance.now() - from * 1000;
  const startedAt = performance.now();
  if (soundOn) {
    soundLabel.textContent = 'Sound on';
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (err) {}
    // unlock a context inside this tap, in case the file can't play and we fall back to synthesis
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.resume) ac.resume(); } catch (err) { ac = null; }
    if (fileOK) {
      mode = 'file';
      try { snd.currentTime = from; } catch (err) {}
      const p = snd.play();
      if (p && p.catch) p.catch(() => { if (mode === 'file') startSynth(); });
    } else startSynth();
  }
  setPlayingUI(true);
  const tick = () => {
    let t;
    if (mode === 'file') {
      if (snd.ended) t = DUR;
      else if (!snd.paused && snd.readyState >= 3) { t = snd.currentTime; perf0 = performance.now() - t * 1000; }
      else if (performance.now() - startedAt < 1500) { t = from; perf0 = performance.now() - from * 1000; }
      else { startSynth(); t = (performance.now() - perf0) / 1000; }
    } else if (mode === 'synth' && ac) t = ac.currentTime - t0 + synthFrom - (ac.outputLatency || 0);
    else t = (performance.now() - perf0) / 1000;
    show(clamp(t, 0, DUR));
    if (t >= DUR) { setPlayingUI(false); show(T.title + 1.2); now = DUR; playLabel.textContent = 'Replay'; bigLabel.textContent = 'Replay with sound'; big.hidden = false; stopAudio(); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
GZ.player = { snd, get mode() { return mode; } };
function pause() { cancelAnimationFrame(raf); stopAudio(); setPlayingUI(false); }

big.addEventListener('click', () => play(now >= DUR - 0.01 || now === POSTER ? 0 : now));
playBtn.addEventListener('click', () => (playing ? pause() : play(now >= DUR - 0.01 ? 0 : now)));
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.setAttribute('aria-pressed', String(soundOn)); soundLabel.textContent = soundOn ? 'Sound on' : 'Sound off';
  bigLabel.textContent = soundOn ? 'Play with sound' : 'Play';
  if (playing) play(now);
});
scrub.addEventListener('input', () => { if (playing) pause(); show(+scrub.value); });
window.addEventListener('resize', () => { fitQuality(); if (!playing) show(now); });

ready.then(() => { fitQuality(); show(now); });
})();
</script>
