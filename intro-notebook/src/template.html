<script>
(() => {
'use strict';

// ───────────────────────── math ─────────────────────────
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const sstep = (a, b, x) => { const t = inv(a, b, x); return t * t * (3 - 2 * t); };
const eOut3 = t => 1 - (1 - t) ** 3;
const eIO3 = t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
const mj = u => u * u * u * (10 - 15 * u + 6 * u * u);           // minimum-jerk pen profile
const mulberry = a => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const vnoise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
const spring = (tau, f = 2.6, z = 0.4) => {
  if (tau <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
};
const TAU = Math.PI * 2;

// ───────────────────────── timeline (seconds) ─────────────────────────
const DUR = 8.2;
const T = {
  lines: 0.08, lineStag: 0.065, lineDur: 0.24,
  zeros: 0.86, strum: 1.20,
  riff: [1.50, 1.74, 1.98, 2.22, 2.46, 2.72],
  doodle: 2.84, sketch: 2.88,
  clear: 3.36,
  morph: 3.44, morphStag: 0.065, morphDur: 0.5,
  attach: [4.40, 4.50, 4.60, 4.70],
  wm0: 4.86, wmStag: 0.062, wmDur: 0.26,
  chord: 6.10,
  url0: 6.07, url1: 6.60,
  swoosh: 6.62,
  slap: 6.92, glint: 7.08,
};
const SCENES = [
  { t: 0.00, end: 0.86, name: 'The staff', desc: 'A pencil rules six lines on grid paper, writes TAB and names the strings.' },
  { t: 0.86, end: 2.84, name: 'Zero to twelve', desc: 'Open strings are strummed, then a riff climbs the staff from fret 0 to the octave at 12.' },
  { t: 2.84, end: 4.86, name: 'Tab to logo', desc: 'Doodles fill the margins, and the six lines peel up into the GZ2H logo in red marker.' },
  { t: 4.86, end: 8.20, name: 'Lesson complete', desc: 'The wordmark is lettered and filled, the URL is penciled in, and a gold star lands.' },
];

// ───────────────────────── page geometry (world px; the final framing is about 1:1) ─────────────────────────
const W = 1920, H = 1080;
const LS = 0.30, LX = 1611.5, LY0 = 138;                        // logo units → world
const lw = (x, y) => [960 + (x - LX) * LS, LY0 + y * LS];
const LINE_Y = [215, 255, 295, 335, 375, 415], SX0 = 378, SX1 = 1546;   // tab staff (top = high e)
const OPEN = [329.63, 246.94, 196.0, 146.83, 110.0, 82.41];
const NAMES = ['e', 'B', 'G', 'D', 'A', 'E'];
const COL_X = 540;
const RIFF = [
  { x: 668, line: 5, fret: '0', f: 82.41 }, { x: 788, line: 4, fret: '3', f: 130.81 }, { x: 908, line: 3, fret: '5', f: 196.0 },
  { x: 1028, line: 2, fret: '7', f: 293.66 }, { x: 1158, line: 1, fret: '10', f: 440.0 }, { x: 1300, line: 0, fret: '12', f: 659.26 },
];
RIFF.forEach((r, i) => { r.t = T.riff[i]; r.y = LINE_Y[r.line]; });
const WM_SC = 1180 / SH.wm.inkW, WM_BASE = 682;
const STAR = { x: 1604, y: 232, R: 80, r: 38, rot: -0.2 };

// ───────────────────────── canvases ─────────────────────────
const out = document.getElementById('c');
const ctx = out.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
let Q = 1, CW = 1920, CH = 1080;
function setQuality(q) { Q = q; CW = Math.round(W * q); CH = Math.round(H * q); out.width = CW; out.height = CH; SHB = null; }
// shadows of ink lifted off the page go into a quarter-resolution buffer, blurred there (cheap), then multiplied on
let SHB = null;
function shadowLayer() {
  if (!SHB) { const w = Math.ceil(CW / 4), h = Math.ceil(CH / 4), a = mk(w, h), b = mk(w, h); SHB = { a, ax: a.getContext('2d'), b, bx: b.getContext('2d'), used: false, w, h }; }
  if (!SHB.used) { SHB.used = true; SHB.ax.setTransform(1, 0, 0, 1, 0, 0); SHB.ax.clearRect(0, 0, SHB.w, SHB.h); setCam(SHB.ax, camK, Q / 4); }
  return SHB.ax;
}
function shadowFlush(c) {
  if (!SHB || !SHB.used) return;
  const { a, b, bx, w, h } = SHB;
  bx.setTransform(1, 0, 0, 1, 0, 0); bx.clearRect(0, 0, w, h); bx.filter = `blur(${1.7 * Q}px)`; bx.drawImage(a, 0, 0); bx.filter = 'none';
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'multiply'; c.globalAlpha = 1; c.imageSmoothingEnabled = true;
  c.drawImage(b, 0, 0, w * 4, h * 4); c.restore();
  SHB.used = false;
}
// the paper texture is built at the resolution the current quality needs (on first use, and again if the stage grows)
function ensurePaper() { if (fontsOK && paperRes < 1.36 * Q - 0.05) buildPaper(1.36 * Q); }

// graphite: a grainy alpha texture anchored to the paper
const GRAPHITE = (() => {
  const c = mk(256, 256), x = c.getContext('2d'), id = x.createImageData(256, 256), r = mulberry(77);
  const cell = (i, j) => hash((i & 31) * 37.1 + (j & 31) * 91.7 + 0.3);
  for (let i = 0; i < 256 * 256; i++) {
    const px = (i % 256) / 8, py = Math.floor(i / 256) / 8, ix = Math.floor(px), iy = Math.floor(py), fx = px - ix, fy = py - iy;
    const coarse = lerp(lerp(cell(ix, iy), cell(ix + 1, iy), fx), lerp(cell(ix, iy + 1), cell(ix + 1, iy + 1), fx), fy);
    const n = r(), a = (n < 0.2 ? 0.12 + 0.25 * r() : 0.5 + 0.5 * r()) * (0.62 + 0.38 * coarse);
    id.data[i * 4] = 50; id.data[i * 4 + 1] = 51; id.data[i * 4 + 2] = 62; id.data[i * 4 + 3] = a * 255;
  }
  x.putImageData(id, 0, 0);
  return ctx.createPattern(c, 'repeat');
})();
const GRAIN = [0, 1, 2, 3].map(s => {
  const c = mk(256, 256), x = c.getContext('2d'), id = x.createImageData(256, 256), r = mulberry(99 + s * 7);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 90; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0); return c;
});
const FOIL = (() => {
  const c = mk(128, 128), x = c.getContext('2d'), id = x.createImageData(128, 128), r = mulberry(5);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - 0.5) * 150; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0); return ctx.createPattern(c, 'repeat');
})();

// ───────────────────────── paper ─────────────────────────
const PX0 = -320, PY0 = -380, PWW = 2560, PHH = 1840;
let paperC = null, paperRes = 0, fontsOK = false;
function buildPaper(res) {
  paperRes = res;
  const cw = Math.ceil(PWW * res), ch = Math.ceil(PHH * res);
  paperC = mk(cw, ch);
  const p = paperC.getContext('2d'), r = mulberry(2024);
  p.setTransform(res, 0, 0, res, -PX0 * res, -PY0 * res);
  p.fillStyle = '#f9f6ee'; p.fillRect(PX0, PY0, PWW, PHH);
  // soft mottling, two octaves
  for (const [gw, gh, a] of [[36, 26, 0.22], [110, 80, 0.12]]) {
    const s = mk(gw, gh), sx = s.getContext('2d'), id = sx.createImageData(gw, gh);
    for (let i = 0; i < gw * gh; i++) { const v = r(); id.data[i * 4] = 255 - v * 16; id.data[i * 4 + 1] = 253 - v * 21; id.data[i * 4 + 2] = 248 - v * 30; id.data[i * 4 + 3] = 255; }
    sx.putImageData(id, 0, 0);
    p.save(); p.globalCompositeOperation = 'multiply'; p.globalAlpha = a; p.imageSmoothingEnabled = true; p.imageSmoothingQuality = 'high';
    p.drawImage(s, PX0, PY0, PWW, PHH); p.restore();
  }
  // fibres
  for (const [col, wdt, count] of [['rgba(140,112,78,0.07)', 0.7, 2600], ['rgba(255,255,252,0.35)', 0.9, 1800], ['rgba(120,96,70,0.10)', 0.5, 900]]) {
    p.beginPath();
    for (let i = 0; i < count; i++) {
      const x = PX0 + r() * PWW, y = PY0 + r() * PHH, a = r() * TAU, l = 3 + r() * 11, bend = (r() - 0.5) * 5;
      const ex = x + Math.cos(a) * l, ey = y + Math.sin(a) * l;
      p.moveTo(x, y); p.quadraticCurveTo((x + ex) / 2 - Math.sin(a) * bend, (y + ey) / 2 + Math.cos(a) * bend, ex, ey);
    }
    p.strokeStyle = col; p.lineWidth = wdt; p.stroke();
  }

let camK = { z: 1 };
let LIGHT = null, WARM = null;
function render(t, fi = Math.round(t * 60)) {

// ───────────────────────── boot ─────────────────────────
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
setQuality(1);

window.GZ = {
  DUR, ready,
  frame: t => render(t),
  // motion blur: n sub-frames across a 180° shutter, averaged, where the motion is fast; returns a PNG as base64
  capture(t, n = 1) {

    if (!fastAt(t)) n = 1;

};

// ───────────────────────── player UI ─────────────────────────
const stage = document.getElementById('stage');
const big = document.getElementById('big'), bigLabel = document.getElementById('bigLabel');
const playBtn = document.getElementById('play'), playLabel = document.getElementById('playLabel'), playIcon = document.getElementById('playIcon');
const soundBtn = document.getElementById('sound'), soundLabel = document.getElementById('soundLabel');
const scrub = document.getElementById('scrub'), tcNow = document.getElementById('tcNow');
const scenesEl = document.getElementById('scenes'), ticks = document.getElementById('ticks');
const SOUND_FILE = 'gz2h-notebook.mp3';
const POSTER = 7.7;
const ICON_PLAY = 'M3 1.8v12.4c0 .6.7 1 1.2.7l10-6.2c.5-.3.5-1.1 0-1.4l-10-6.2C3.7.8 3 1.2 3 1.8z';
const ICON_PAUSE = 'M3 2h3.4v12H3zM9.6 2H13v12H9.6z';

SCENES.forEach((sc, i) => {
  const b = document.createElement('button');
  b.className = 'scene'; b.type = 'button'; b.id = 'scene-' + i;
  b.innerHTML = `<span class="st"><b>${i + 1}</b>${sc.t.toFixed(2)} s</span><span class="sn">${sc.name}</span><span class="sd">${sc.desc}</span><span class="fill"></span>`;

}

  tcNow.textContent = t.toFixed(2);

// Sound comes from a pre-rendered soundtrack file played through an <audio> element, which the

const snd = new Audio(); snd.preload = 'auto'; snd.src = SOUND_FILE;

GZ.player = { snd, get mode() { return mode; } };
function pause() { cancelAnimationFrame(raf); stopAudio(); setPlayingUI(false); }
